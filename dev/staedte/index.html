<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Imperium der Epochen: Städte Roms</title>
<link rel="icon" href="../favicon.ico">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="stil.css">
</head>
<body>
<canvas id="welt" aria-label="Stadtansicht"></canvas>

<header id="oben">
  <button id="menueKnopf" class="kachel" aria-label="Menü"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <div class="kachel stadt"><b>CREMONA</b><span id="datum">Frühling · 218 v. Chr.</span></div>
  <div class="kachel waren" id="waren"></div>
  <div class="kachel tempo" role="group" aria-label="Tempo">
    <button data-tempo="0" aria-label="Pause"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg></button>
    <button data-tempo="1" aria-label="Normal"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5l12 7-12 7z"/></svg></button>
    <button data-tempo="3" aria-label="Schnell"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6l8 6-8 6zM12 6l8 6-8 6z"/></svg></button>
  </div>
</header>

<nav id="ansicht" class="kachel" aria-label="Ansicht">
  <button data-umland aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7.8 4.5v9L12 21l-7.8-4.5v-9z"/><path d="M8 13l3-3 2 2 3-3"/></svg><small>Umland</small></button>
  <button data-familie><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><circle cx="16" cy="9" r="2.4"/><path d="M3.5 19c.8-3.4 3-5 5.5-5s4.7 1.6 5.5 5M14 14.6c2.6-.4 4.8 1 5.6 4.4"/></svg><small>Familie</small></button>
  <button data-forschung><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11M9 8h6"/></svg><small>Wissen</small></button>
  <button data-ansicht="wasser" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c4 5 6 8 6 11a6 6 0 0 1-12 0c0-3 2-6 6-11z"/></svg><small>Wasser</small></button>
  <button data-ansicht="stimmung" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 14c1 1.5 2.4 2.2 4 2.2s3-.7 4-2.2M9 9.5h.01M15 9.5h.01"/></svg><small>Stimmung</small></button>
  <button data-ansicht="feuer" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c1 4 5 6 5 11a5 5 0 0 1-10 0c0-3 2-4 2-7 2 1 3 3 3 5 1-1 1-3 0-9z"/></svg><small>Feuer</small></button>
  <button data-ansicht="arbeit" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4l6 6-3 3-6-6zM11 7l-7 7 3 3 7-7"/></svg><small>Arbeit</small></button>
</nav>
<div id="legende" class="feld" hidden></div>

<aside id="auftrag" class="feld">
  <small>AUFTRAG DES SENATS</small>
  <p id="auftragText"></p>
  <p id="forschZeile" class="forschzeile"></p>
  <p id="familieZeile" class="forschzeile"></p>
</aside>

<aside id="info" class="feld" hidden></aside>

<div id="baumodus" class="feld" hidden>
  <span id="baumodusText"></span>
  <button id="baumodusWeg" hidden aria-pressed="false">Entfernen</button>
  <button id="baumodusEnde">Fertig</button>
</div>

<footer id="leiste" class="feld">
  <div id="reiter" role="tablist"></div>
  <div id="karten"></div>
</footer>

<div id="startseite" class="start" hidden></div>

<div id="forschung" class="schleier" hidden></div>
<div id="familie" class="schleier" hidden></div>

<div id="menue" class="schleier" hidden>
  <div class="feld menuespalte">
    <h2>Städte Roms</h2>
    <button data-m="weiter">Weiterspielen</button>
    <button data-m="speichern">Speichern</button>
    <button data-m="neu">Provinz wählen / neu gründen</button>
    <button data-m="ton">Ton: an</button>
    <button data-m="hilfe">So wird gespielt</button>
    <p class="klein">Ableger von Imperium der Epochen · Stufe 4 (Familie &amp; Politik)</p>
  </div>
</div>

<div id="meldung" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
