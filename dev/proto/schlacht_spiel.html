<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Schlacht – Testschlacht</title>
<style>
:root{--bg:#1c1a16;--ink:#efe6d2;--mut:#b8ab90;--tinte:#2e261d;--bronze:#a9793a;--bronze2:#7a5524;--gold:#e0b45a;--rot:#a8322a;
  --holz:linear-gradient(#2e261d,#241d16);--perg:linear-gradient(#ecdfba,#cfba88);
  --sl:max(10px,env(safe-area-inset-left));--sr:max(10px,env(safe-area-inset-right));--st:max(10px,env(safe-area-inset-top));--sb:max(10px,env(safe-area-inset-bottom))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.35 Georgia,serif;overflow:hidden;touch-action:none;overscroll-behavior:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.titel{font-family:Marcellus,"Palatino Linotype",Palatino,Georgia,serif;letter-spacing:.02em}

/* Oberfläche: dunkles Holz für Karten, Bronze für Knöpfe, Pergament für Tafeln */
#zeile{position:fixed;left:50%;top:var(--st);transform:translateX(-50%);max-width:46vw;text-align:center;padding:7px 16px;
  background:var(--holz);border:1px solid var(--bronze2);border-radius:10px;box-shadow:inset 0 0 0 1px rgba(224,180,90,.25),0 3px 10px rgba(0,0,0,.5);
  font-size:15px;pointer-events:none}
#fps{position:fixed;right:var(--sr);top:var(--st);background:rgba(28,24,18,.8);border-radius:6px;padding:4px 9px;font:12px monospace;color:var(--mut);pointer-events:none}
#feinde{position:fixed;left:var(--sl);top:var(--st);display:flex;flex-direction:column;gap:5px;width:170px}
.chip{display:flex;align-items:center;gap:8px;padding:5px 9px;border-radius:8px;background:var(--holz);border:1px solid #5a3f1f;font-size:13px;min-height:34px}
.chip b{font-weight:normal;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip span{color:var(--gold);font-variant-numeric:tabular-nums}
.chip i{width:10px;height:10px;border-radius:50%;background:#7a3fa0;border:1px solid #000;flex:none}
.chip.weg{opacity:.45;filter:saturate(.3)}
#spalte{position:fixed;right:var(--sr);top:calc(var(--st) + 34px);display:flex;flex-direction:column;gap:8px;width:188px}
.plak{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:9px 14px;border-radius:10px;
  background:linear-gradient(#cfa05a,#8f6429);border:1px solid #5a3f17;color:#20170c;box-shadow:inset 0 1px 0 rgba(255,235,190,.5),0 3px 8px rgba(0,0,0,.45);min-height:50px}
.plak b{font-family:Marcellus,Georgia,serif;font-weight:normal;font-size:17px}
.plak small{font-size:12px;opacity:.78}
.plak:active{filter:brightness(.88)}
.plak.gross{background:linear-gradient(#e6bd6c,#a8722a);min-height:62px}
.plak.gross b{font-size:20px}
.plak.rot{background:linear-gradient(#c4503f,#7e231a);color:#fbeee0}
#ausw{display:none}
#karten{position:fixed;left:50%;transform:translateX(-50%);bottom:var(--sb);display:flex;gap:10px}
.karte{display:flex;align-items:center;gap:10px;width:178px;padding:8px 10px;border-radius:12px;background:var(--holz);border:2px solid #5a3f1f;
  box-shadow:0 3px 10px rgba(0,0,0,.5);cursor:pointer}
.karte.sel{border-color:var(--gold);box-shadow:0 0 14px rgba(224,180,90,.65),0 3px 10px rgba(0,0,0,.5)}
.karte.weg{opacity:.5;filter:saturate(.25)}
.karte .t{flex:1;min-width:0}
.karte .n{font-family:Marcellus,Georgia,serif;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.karte .s{font-size:13px;color:var(--mut)}
.karte .s b{color:var(--gold);font-weight:normal}
.karte .z{font-size:11.5px;color:#d9b36a;min-height:14px}
.karte .mud{height:4px;border-radius:2px;background:rgba(0,0,0,.45);margin-top:2px;overflow:hidden}
.karte .mud i{display:block;height:100%;width:0;background:#c9a24a}
.ring{width:48px;height:48px;border-radius:50%;flex:none;background:conic-gradient(var(--mc,#7bbf5a) calc(var(--m,100)*1%),rgba(0,0,0,.5) 0);display:grid;place-items:center}
.ring i{width:35px;height:35px;border-radius:50%;background:#241d16;display:grid;place-items:center;font:normal 12px Georgia,serif;color:var(--ink)}
#erkl,#ende{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);display:none;background:var(--perg);color:var(--tinte);
  border:3px solid var(--bronze2);border-radius:14px;box-shadow:inset 0 0 0 2px rgba(255,240,200,.6),0 10px 40px rgba(0,0,0,.65);padding:18px 24px;min-width:300px;max-width:420px}
#erkl{top:46%}
#erkl h2,#ende h2{margin:0 0 4px;font-family:Marcellus,Georgia,serif;font-weight:normal;font-size:24px;border-bottom:2px solid var(--bronze);padding-bottom:4px}
#erkl .zl{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dotted rgba(90,63,23,.4)}
#erkl .zl b{color:#7a4a10;font-weight:normal}
#erkl p{margin:8px 0 0;font-style:italic;font-size:14px}
#ende{text-align:center;padding:24px 34px;z-index:5}
#ende h2{font-size:44px;border:0;margin-bottom:2px}
#ende.sieg h2{color:#8a5a0e}#ende.nied h2{color:#8c2018}
#ende .u{margin:0 0 12px;font-style:italic}
#ende .zl{display:flex;justify-content:space-between;gap:30px;padding:4px 0;border-bottom:1px dotted rgba(90,63,23,.4)}
#ende .plak{margin:16px auto 0;align-items:center;width:200px;text-align:center}
#lade{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(#2e261d,#14110d);flex-direction:column;gap:12px;z-index:9;font-size:20px}
#lade .z{color:var(--mut);font-size:14px;min-height:18px}
.balken{width:min(320px,70vw);height:12px;border-radius:7px;background:#14110d;border:1px solid var(--bronze2);overflow:hidden}
.balken i{display:block;height:100%;width:0;background:linear-gradient(#e6bd6c,#a8722a)}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="zeile" class="titel"></div>
<div id="fps">– B/s</div>
<div id="feinde"></div>
<div id="spalte">
  <button class="plak gross" id="bBegin"><b>Schlacht beginnen</b><small>Die Heere rücken vor</small></button>
  <button class="plak" id="bHalt"><b>Halten</b><small>Haltung der gewählten Einheit</small></button>
  <button class="plak" id="bPause"><b>Pause</b><small>Schlacht anhalten</small></button>
  <button class="plak" id="bTempo"><b>Tempo 1×</b><small>Antippen: schneller</small></button>
</div>
<div id="karten"></div>
<div id="erkl"></div>
<div id="ende"></div>
<div id="lade"><div class="titel">Das Heer sammelt sich …</div><div class="balken"><i id="balki"></i></div><div class="z" id="ladez"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* ====================================================================================================
   Spielbare Testschlacht. Abschnitte: 1 Figurenmotor · 2 Gelände · 3 Einheiten/Formation · 4 Kampfregeln · 5 KI
   · 6 Steuerung · 7 Oberfläche · 8 Hauptschleife/Test-Schnittstelle.  Einheit: 1 m. Figuren blicken nach +Z.
   ==================================================================================================== */
const $=id=>document.getElementById(id);
const b64=s=>{const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u.buffer;};
const PI=Math.PI,TAU=PI*2;
const wrap=a=>{while(a>PI)a-=TAU;while(a<-PI)a+=TAU;return a;};
const fmt=n=>String(Math.round(n*10)/10).replace('.',',');

/* ---------- Daten ---------- */
const KITS=[
  {id:'A1_hastatus',key:'hast',n:'Hastati',atk:10,def:11,mor:70,hp:3,walk:1.3,run:3.8,ans:1.5,speer:false,
   info:'Gedrillte römische Linieninfanterie. Hält die Linie, bricht nicht so schnell.'},
  {id:'A2_libysch',key:'liby',n:'Libysche Speerträger',atk:9,def:12,mor:65,hp:3,walk:1.3,run:3.6,ans:1.5,speer:true,
   info:'Dichte Speerreihen. Stark in der Abwehr, träge im Angriff.'},
  {id:'A3_iberisch',key:'iber',n:'Iberische Scutarii',atk:11,def:9,mor:60,hp:2.5,walk:1.4,run:4.0,ans:1.5,speer:false,
   info:'Wendige Schwertkämpfer mit großem Schild. Kräftig im Angriff, verwundbar in der Abwehr.'},
  {id:'A6_keltisch',key:'kelt',n:'Keltische Krieger',atk:12,def:8,mor:55,hp:2.5,walk:1.4,run:4.2,ans:2,speer:false,
   info:'Furchtbarer Ansturm in den ersten Augenblicken – doch wer ihn übersteht, sieht sie bald wanken.'},
];
const ROSTER=[   // fest für den Test: Rom (Spieler) 0–2, Karthago 3–7
  {side:0,kit:0,name:'Hastati I',x:30,z:-60},{side:0,kit:0,name:'Hastati II',x:0,z:-60},{side:0,kit:0,name:'Hastati III',x:-30,z:-60},
  {side:1,kit:3,name:'Keltische Krieger I',x:48,z:60},{side:1,kit:1,name:'Libysche Speerträger I',x:24,z:60},
  {side:1,kit:2,name:'Iberische Scutarii',x:0,z:60},{side:1,kit:1,name:'Libysche Speerträger II',x:-24,z:60},
  {side:1,kit:3,name:'Keltische Krieger II',x:-48,z:60},
];
const SEITE=['Rom','Karthago'];
const PRO=40,BREIT=10,TIEF=4,ABST=1.2;     // Figuren je Einheit, Formation 10 × 4, Abstand 1,2 m
const NU=ROSTER.length,N=NU*PRO;
const FELD_X=200,FELD_Z=150;               // Feld 400 × 300 m
const NAH=60;                              // Meter: nähere Figuren in voller Stufe
const FLIEH_MORAL=25;

/* ====================================================================================================
   1  FIGURENMOTOR  (GPU-Skinning aus Animations-Textur, wie dev/proto/schlacht_figuren.html)
   ==================================================================================================== */
const renderer=new THREE.WebGLRenderer({canvas:$('cv'),antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
renderer.outputEncoding=THREE.sRGBEncoding;
const scene=new THREE.Scene();scene.background=new THREE.Color(.74,.80,.88);scene.fog=new THREE.Fog(scene.background,200,800);
const camera=new THREE.PerspectiveCamera(45,1,.5,2500);
scene.add(new THREE.HemisphereLight(0xcfe3ff,0x6b6a45,.65));
const sun=new THREE.DirectionalLight(0xfff0d6,.9);sun.position.set(-.5,.8,.4);scene.add(sun);

function geometrie(pk,stufe){
  const teile=Object.values(pk.koerper).map(k=>({d:k[stufe]}));
  for(const t of Object.values(pk.teile))teile.push({d:t.nah});
  let n=0,m=0;teile.forEach(t=>{n+=t.d.n;m+=new Uint16Array(b64(t.d.idx)).length;});
  const P=new Float32Array(n*3),Nr=new Float32Array(n*3),C=new Float32Array(n*3),B=new Float32Array(n*4),W=new Float32Array(n*4),I=new Uint32Array(m);
  let o=0,oi=0;
  for(const t of teile){
    const d=t.d,p=new Float32Array(b64(d.pos)),nr=new Float32Array(b64(d.nrm)),c=new Uint8Array(b64(d.col)),
      si=new Uint8Array(b64(d.si)),sw=new Uint8Array(b64(d.sw)),ix=new Uint16Array(b64(d.idx));
    P.set(p,o*3);Nr.set(nr,o*3);
    for(let i=0;i<d.n;i++){
      for(let k=0;k<3;k++)C[(o+i)*3+k]=Math.pow(c[i*3+k]/255,2.2);
      for(let k=0;k<4;k++){B[(o+i)*4+k]=si[i*4+k];W[(o+i)*4+k]=sw[i*4+k]/255;}
    }
    for(let i=0;i<ix.length;i++)I[oi+i]=ix[i]+o;
    o+=d.n;oi+=ix.length;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(P,3));g.setAttribute('normal',new THREE.BufferAttribute(Nr,3));
  g.setAttribute('color',new THREE.BufferAttribute(C,3));g.setAttribute('aBone',new THREE.BufferAttribute(B,4));
  g.setAttribute('aWeight',new THREE.BufferAttribute(W,4));g.setIndex(new THREE.BufferAttribute(I,1));
  g.userData.tris=m/3;
  return g;
}
function material(pk){
  const tex=new THREE.DataTexture(new Float32Array(b64(pk.anim.f32)),pk.anim.w,pk.anim.h,THREE.RGBAFormat,THREE.FloatType);
  tex.minFilter=tex.magFilter=THREE.NearestFilter;tex.generateMipmaps=false;tex.flipY=false;tex.needsUpdate=true;
  const U={uTime:{value:0},uAnimTex:{value:tex},uTexSize:{value:new THREE.Vector2(pk.anim.w,pk.anim.h)}};
  const m=new THREE.MeshLambertMaterial({vertexColors:true,side:THREE.DoubleSide});
  m.onBeforeCompile=sh=>{
    Object.assign(sh.uniforms,U);
    sh.vertexShader=sh.vertexShader
    .replace('#include <common>',`#include <common>
attribute vec4 aBone;attribute vec4 aWeight;attribute vec4 aAnim;attribute vec4 aAnimAlt;attribute vec3 aLoop;
uniform float uTime;uniform highp sampler2D uAnimTex;uniform vec2 uTexSize;
vec4 bTex(float bone,float row,float k){return texture2D(uAnimTex,vec2((bone*4.0+k+0.5)/uTexSize.x,(row+0.5)/uTexSize.y));}
mat4 bMat(float bone,float r0,float r1,float fr){
  return mat4(mix(bTex(bone,r0,0.0),bTex(bone,r1,0.0),fr),mix(bTex(bone,r0,1.0),bTex(bone,r1,1.0),fr),
              mix(bTex(bone,r0,2.0),bTex(bone,r1,2.0),fr),mix(bTex(bone,r0,3.0),bTex(bone,r1,3.0),fr));}
mat4 skinClip(vec4 an,float lp){
  float fLen=an.y;float fT=max(uTime-an.z,0.0)*an.w*30.0;float fA;float fB;
  if(lp>0.5){fT=mod(fT,fLen);fA=floor(fT);fB=mod(fA+1.0,fLen);}
  else{fT=min(fT,fLen-1.0);fA=floor(fT);fB=min(fA+1.0,fLen-1.0);}
  float fF=fT-fA;float rowA=an.x+fA;float rowB=an.x+fB;
  mat4 sk=mat4(0.0);
  for(int i=0;i<4;i++){float w=aWeight[i];if(w>0.0){sk+=w*bMat(aBone[i],rowA,rowB,fF);}}
  return sk;}`)
    .replace('#include <beginnormal_vertex>',`#include <beginnormal_vertex>
mat4 skM=skinClip(aAnim,aLoop.x);
float blN=clamp((uTime-aLoop.z)/0.2,0.0,1.0);
if(blN<1.0){mat4 skO=skinClip(aAnimAlt,aLoop.y);skM=skO+(skM-skO)*blN;}
objectNormal=(skM*vec4(objectNormal,0.0)).xyz;`)
    .replace('#include <begin_vertex>','#include <begin_vertex>\ntransformed=(skM*vec4(transformed,1.0)).xyz;');
  };
  m.customProgramCacheKey=()=>'schlachtspiel2';
  m.userData.U=U;
  return m;
}
const KIT=[];   // je Kit: {pk, mat, im:[nah,mittel], clip:{name:{row,len,loop}}, n:[0,0]}
function kitBauen(i,pk){
  const mat=material(pk),im=[];
  for(const stufe of ['nah','mittel']){
    const g=geometrie(pk,stufe);
    g.setAttribute('aAnim',new THREE.InstancedBufferAttribute(new Float32Array(N*4),4));
    g.setAttribute('aAnimAlt',new THREE.InstancedBufferAttribute(new Float32Array(N*4),4));
    g.setAttribute('aLoop',new THREE.InstancedBufferAttribute(new Float32Array(N*3),3));
    const m=new THREE.InstancedMesh(g,mat,N);m.frustumCulled=false;m.count=0;scene.add(m);im.push(m);
  }
  const clip={};pk.clips.forEach((c,k)=>{c.k=k;clip[c.n]=c;});
  KIT[i]={pk,mat,im,clip,cl:CN.map(n=>clip[n]||clip.stehen||pk.clips[0]),tris:im[0].geometry.userData.tris};
}

/* ====================================================================================================
   2  GELÄNDE  (eben, 400 × 300 m; Farbvariation über Eckfarben)
   ==================================================================================================== */
(function gelaende(){
  const g=new THREE.PlaneGeometry(2*FELD_X+120,2*FELD_Z+120,64,48);g.rotateX(-PI/2);
  const p=g.attributes.position,col=new Float32Array(p.count*3);
  for(let i=0;i<p.count;i++){
    const x=p.getX(i),z=p.getZ(i),v=.5+.25*Math.sin(x*.045)*Math.cos(z*.06)+.15*Math.sin(x*.13+z*.09);
    const inF=Math.abs(x)<=FELD_X&&Math.abs(z)<=FELD_Z;
    const r=(.30+.14*v)*(inF?1:.8),gg=(.40+.16*v)*(inF?1:.82),b=(.17+.07*v)*(inF?1:.8);
    col[i*3]=Math.pow(r,2.2);col[i*3+1]=Math.pow(gg,2.2);col[i*3+2]=Math.pow(b,2.2);
  }
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  scene.add(new THREE.Mesh(g,new THREE.MeshLambertMaterial({vertexColors:true})));
  // Grenzsteine am Feldrand
  const st=new THREE.Mesh(new THREE.CylinderGeometry(.5,.7,2,6),new THREE.MeshLambertMaterial({color:0x8a8478}));
  const im=new THREE.InstancedMesh(st.geometry,st.material,60);let k=0;const m=new THREE.Matrix4();
  for(let x=-FELD_X;x<=FELD_X;x+=40)for(const z of[-FELD_Z,FELD_Z]){m.makeTranslation(x,1,z);im.setMatrixAt(k++,m);}
  for(let z=-FELD_Z+50;z<FELD_Z;z+=50)for(const x of[-FELD_X,FELD_X]){m.makeTranslation(x,1,z);im.setMatrixAt(k++,m);}
  im.count=k;scene.add(im);
})();

/* ====================================================================================================
   3  EINHEITEN / SOLDATEN  (v2: jeder Soldat ein eigener Körper; Formation ist nur Ziel)
   ==================================================================================================== */
/* ---- Abstimmung (alle Werte hier) ---- */
const TICK=0.05;            // feste Kampfschritte: 20 Hz
const DREH=4.19;            // max. Drehrate rad/s (240°/s)
const BESCHL=3;             // Beschleunigung m/s²
const BREMS=6;              // Bremsen m/s²
const BLEND=0.2;            // Überblendung der Clips (Sekunden, im Shader)
const ZELLE=2;              // Raster-Hash, Zellgröße m
const SEP=0.75,SEP_F=0.85,SEP_L=0.62;   // Mindestabstand: Freund, Feind, Leiche
const KONT_R=6,KONT_R2=KONT_R*KONT_R;   // Kampfmodus ab 6 m
const KONT_HALT=1.5;        // Kampfmodus bleibt so lange nach letztem Kontakt
const SUCH1=4,SUCH2=7;      // Suchradius in Zellen (8 m / 14 m)
const MAXANG=2;             // höchstens 2 Angreifer je Verteidiger
const NOGOAL=-99999;
const GX0=-(FELD_X+30),GZ0=-(FELD_Z+30),GW=Math.ceil(2*(FELD_X+30)/ZELLE),GH=Math.ceil(2*(FELD_Z+30)/ZELLE);
const CN=['stehen','gehen','laufen','fliehen','stehen_bereit','kampf_bereit','schlag_a','schlag_b','schlag_c','stoss_speer','schild_stoss',
  'abwehr_schild','parade','ausweichen','treffer','sterben_vorn','sterben_hinten','jubeln'];
const C={};CN.forEach((n,i)=>C[n]=i);
const S_FORM=0,S_KAMPF=1,S_FLIEH=2,S_STIRBT=3,S_TOT=4,S_WEG=5;
const A_NIX=0,A_SCHLAG=1,A_REAKT=2,A_TREFFER=3;

// Soldaten (SoA), Index = Einheit*PRO + laufende Nummer
const sX=new Float32Array(N),sZ=new Float32Array(N),sVX=new Float32Array(N),sVZ=new Float32Array(N),sR=new Float32Array(N);
const sHP=new Float32Array(N),sFat=new Float32Array(N),sJit=new Float32Array(N),sJX=new Float32Array(N),sJZ=new Float32Array(N),sJR=new Float32Array(N);
const sDelay=new Float32Array(N),sCool=new Float32Array(N),sRet=new Float32Array(N),sBackT=new Float32Array(N),sPX=new Float32Array(N),sPZ=new Float32Array(N);
const sFOff=new Float32Array(N),sFA=new Float32Array(N),sFSp=new Float32Array(N),sKX=new Float32Array(N),sKZ=new Float32Array(N);
const sActT=new Float32Array(N),sAT=new Float32Array(N),sDur=new Float32Array(N),sHitT=new Float32Array(N),sReaT=new Float32Array(N),sPer=new Float32Array(N),sDmg=new Float32Array(N);
const sKit=new Uint8Array(N),sUnit=new Uint8Array(N),sSide=new Uint8Array(N),sSt=new Uint8Array(N),sAct=new Uint8Array(N),sSlot=new Uint8Array(N),sMov=new Uint8Array(N);
const sDeath=new Uint8Array(N),sOut=new Uint8Array(N),sPh=new Uint8Array(N),sNAtt=new Uint8Array(N),sJub=new Uint8Array(N);
const sCur=new Int8Array(N),sFoe=new Int16Array(N),sAtt=new Int16Array(N),sTgt=new Int16Array(N),sFace=new Int16Array(N),sCell=new Int32Array(N),sNext=new Int16Array(N);
const sAn=new Float32Array(N*12);   // je Soldat: [row,len,start,spd, rowAlt,lenAlt,startAlt,spdAlt, loop,loopAlt,blendStart, -]
const cHead=new Int16Array(GW*GH).fill(-1);
let spielzeit=0;
const U=[];   // Einheiten
let phase='laden',pausiert=false,tempoV=1,sel=-1,ergebnis=null;
const gefallen=[0,0];
const zaehler={schlaege:0,parade:0,ausweich:0,treffer:0,kills:0,umgeworfen:0,rueckweich:0,fliehende:0};

function einheitenAnlegen(){
  U.length=0;cHead.fill(-1);sCell.fill(-1);
  for(const k in zaehler)zaehler[k]=0;
  ROSTER.forEach((r,i)=>{
    const K=KITS[r.kit];
    const u={i,side:r.side,kit:K.key,k:r.kit,name:r.name,def:K,
      strength:PRO,morale:K.mor,state:'steht',
      cx:r.x,cz:r.z,f:r.side===0?0:PI,destX:0,destZ:0,hasDest:false,run:false,atkT:-1,stance:r.side===0?'halten':'angreifen',
      occ:new Int16Array(PRO),charge:0,runT:0,engaged:false,kT:0,sperre:0,kontakt:false,nahF:false,foeU:-1,curSpeed:0,aiT:Math.random()*.5,
      fx:0,fz:(r.side===0?-1:1),fAng:0,fled:0,flank:1,pr:0,loose:0,startX:r.x,startZ:r.z,
      mx:r.x,mz:r.z,sn:PRO,ax:0,az:0,an:0,nF:0,fatS:0,nL:PRO,cnt:new Int16Array(NU),
      lebend:PRO,kaempfend:0,muede:0};
    U.push(u);
    for(let s=0;s<PRO;s++){
      const id=i*PRO+s;
      sKit[id]=r.kit;sUnit[id]=i;sSide[id]=r.side;sSt[id]=S_FORM;sAct[id]=0;sSlot[id]=s;u.occ[s]=id;sMov[id]=0;sFoe[id]=-1;sAtt[id]=-1;sTgt[id]=-1;sFace[id]=-1;
      sJit[id]=.88+Math.random()*.24;sJX[id]=(Math.random()-.5)*.5;sJZ[id]=(Math.random()-.5)*.5;sJR[id]=(Math.random()-.5)*.14;
      sHP[id]=K.hp;sFat[id]=0;sDelay[id]=0;sCool[id]=Math.random()*.8;sRet[id]=Math.random()*.2;sBackT[id]=Math.random()*2;
      sPX[id]=NOGOAL;sPZ[id]=0;sVX[id]=sVZ[id]=0;sKX[id]=sKZ[id]=0;sJub[id]=0;sNAtt[id]=0;sFOff[id]=0;sFA[id]=0;sFSp[id]=1;
      slotPos(u,s,id);sX[id]=_tx;sZ[id]=_tz;sR[id]=u.f+sJR[id];sCur[id]=-1;
      initClip(id,C.stehen_bereit);
    }
  });
}
let _tx=0,_tz=0;
function slotPos(u,s,id){   // Weltposition des Platzes s -> _tx,_tz ; lockert sich beim Marsch (u.loose 0..1)
  const col=s%BREIT,row=(s/BREIT)|0,L=u.loose;
  const lx=(col-(BREIT-1)/2)*ABST*(1+.10*L)+((row&1)?.3:-.3)+sJX[id];
  const lz=((TIEF-1)/2-row)*ABST*(1+.35*L)-row*.25*L+sJZ[id];
  const c=Math.cos(u.f),sn=Math.sin(u.f);
  _tx=u.cx+lx*c+lz*sn;_tz=u.cz-lx*sn+lz*c;
}
function initClip(id,ci){
  const o=id*12,c=KIT[sKit[id]].cl[ci];
  sAn[o]=sAn[o+4]=c.row;sAn[o+1]=sAn[o+5]=c.len;sAn[o+2]=sAn[o+6]=spielzeit-Math.random()*c.len/30;sAn[o+3]=sAn[o+7]=sJit[id];
  sAn[o+8]=sAn[o+9]=c.loop?1:0;sAn[o+10]=-10;sCur[id]=ci;
}
/* Clip wechseln (Überblendung im Shader). sp = absolute Abspielgeschwindigkeit. Gibt Dauer in Sekunden zurück. */
function setClip(id,ci,sp,force){
  const A=sAn,o=id*12,c=KIT[sKit[id]].cl[ci],dur=c.len/30/sp;
  if(sCur[id]===ci&&!force){
    if(A[o+8]>.5&&Math.abs(sp-A[o+3])>.08*A[o+3]){const ph=(spielzeit-A[o+2])*A[o+3];A[o+3]=sp;A[o+2]=spielzeit-ph/sp;}   // Phase bleibt stetig
    return dur;
  }
  A[o+4]=A[o];A[o+5]=A[o+1];A[o+6]=A[o+2];A[o+7]=A[o+3];A[o+9]=A[o+8];
  A[o]=c.row;A[o+1]=c.len;A[o+3]=sp;A[o+8]=c.loop?1:0;
  A[o+2]=spielzeit-(c.loop?Math.random()*c.len/30/sp:0);
  A[o+10]=spielzeit;sCur[id]=ci;
  return dur;
}
const gone=u=>u.state==='geflohen'||u.state==='aufgerieben';
const aktiv=u=>!gone(u)&&u.state!=='flieht';
function slotFrei(u,id){   // Hintermann der Spalte rückt nach
  const slot=sSlot[id];if(u.occ[slot]!==id)return;
  const c=slot%BREIT;
  for(let r=(slot/BREIT)|0;r<TIEF-1;r++){const s1=r*BREIT+c,s2=(r+1)*BREIT+c;u.occ[s1]=u.occ[s2];if(u.occ[s1]>=0)sSlot[u.occ[s1]]=s1;u.occ[s2]=-1;}
  u.occ[(TIEF-1)*BREIT+c]=-1;
}

/* ====================================================================================================
   4  KAMPFREGELN  (feste Schritte 20 Hz; Verluste nur aus Zweikämpfen)
   ==================================================================================================== */
function flankF(b,a){   // Angriff von Einheit a auf b: Front 1, Seite 1,5, Rücken 2
  const d=Math.abs(wrap(Math.atan2(a.cx-b.cx,a.cz-b.cz)-b.f));
  return d<1.05?1:d<2.35?1.5:2;
}
function hashBauen(){
  for(let i=0;i<N;i++){const c=sCell[i];if(c>=0){cHead[c]=-1;sCell[i]=-1;}}
  for(let i=0;i<N;i++){
    if(sSt[i]===S_WEG)continue;
    let ix=((sX[i]-GX0)/ZELLE)|0,iz=((sZ[i]-GZ0)/ZELLE)|0;
    ix=ix<0?0:ix>=GW?GW-1:ix;iz=iz<0?0:iz>=GH?GH-1:iz;
    const c=iz*GW+ix;sNext[i]=cHead[c];cHead[c]=i;sCell[i]=c;
  }
}
function floh(u){
  if(u.state==='flieht'||gone(u))return;
  u.state='flieht';u.atkT=-1;u.hasDest=false;u.stance='halten';u.engaged=false;u.kT=0;
  const e=naechster(u,true);let dx=0,dz=u.side===0?-1:1;
  if(e){dx=u.cx-e.cx;dz=u.cz-e.cz;const l=Math.hypot(dx,dz)||1;dx/=l;dz/=l;}
  u.fx=dx;u.fz=dz;u.fAng=Math.atan2(dx,dz);
  for(let s=0;s<PRO;s++){const id=u.occ[s];if(id<0||sSt[id]>S_KAMPF)continue;
    sSt[id]=S_FLIEH;sFoe[id]=-1;sAct[id]=0;sKX[id]=sKZ[id]=0;sDelay[id]=Math.random()*.7;
    sFOff[id]=(Math.random()-.5)*.87;sFSp[id]=.9+Math.random()*.25;sFA[id]=u.fAng+sFOff[id];zaehler.fliehende++;}
  // Nachbarflucht nur, wenn die Nachbareinheit selbst schon Verluste hat oder bedrängt ist
  for(const v of U)if(v.side===u.side&&v!==u&&!gone(v)&&v.state!=='flieht'&&(v.strength<PRO||v.engaged)&&Math.hypot(v.cx-u.cx,v.cz-u.cz)<70)v.morale-=4;
  if(sel===u.i)uiAuswahl();
}
function soldatWeg(i){   // Flüchtling verlässt das Feld
  const u=U[sUnit[i]];sSt[i]=S_WEG;slotFrei(u,i);u.strength--;u.fled++;
  if(u.strength<=0){u.strength=0;u.state='geflohen';}
}
function beginEngage(u){
  let foe=null,bd=1e9;
  for(const v of U){if(v.side===u.side||gone(v))continue;const d=Math.hypot(v.mx-u.mx,v.mz-u.mz);if(d<bd){bd=d;foe=v;}}
  if(u.runT>0&&foe){u.charge=2;foe.morale-=3+(u.def.ans>1.6?4:0);}   // Ansturm
  for(let s=0;s<PRO;s++){const id=u.occ[s];if(id<0||sSt[id]!==S_FORM)continue;
    sSt[id]=S_KAMPF;sDelay[id]=Math.random()*.3;sRet[id]=Math.random()*.2;sPX[id]=NOGOAL;}
}
function endEngage(u){
  for(let s=0;s<PRO;s++){const id=u.occ[s];if(id<0||sSt[id]!==S_KAMPF)continue;
    sSt[id]=S_FORM;sFoe[id]=-1;sMov[id]=1;sDelay[id]=Math.random()*.4;}
}
function suche(i){   // Gegner für Soldat i; setzt sFoe oder das Drängel-Ziel sPX/sPZ
  const side=sSide[i],cx=((sX[i]-GX0)/ZELLE)|0,cz=((sZ[i]-GZ0)/ZELLE)|0;
  let best=-1,bs=1e12,near=-1,nd=1e12;
  const a=sAtt[i];   // bevorzugt der, der mich angreift -> echte Paare
  if(a>=0&&sSt[a]===S_KAMPF&&sFoe[a]===i&&sNAtt[a]<MAXANG){const dx=sX[a]-sX[i],dz=sZ[a]-sZ[i];if(dx*dx+dz*dz<64)best=a;}
  for(let pass=0;pass<2&&best<0;pass++){
    const R=pass?SUCH2:SUCH1,g0=Math.max(0,cx-R),g1=Math.min(GW-1,cx+R),h0=Math.max(0,cz-R),h1=Math.min(GH-1,cz+R);
    for(let gz=h0;gz<=h1;gz++)for(let gx=g0;gx<=g1;gx++){
      for(let j=cHead[gz*GW+gx];j>=0;j=sNext[j]){
        if(sSide[j]===side||sSt[j]>S_FLIEH)continue;
        const dx=sX[j]-sX[i],dz=sZ[j]-sZ[i],d2=dx*dx+dz*dz;
        if(d2<nd){nd=d2;near=j;}
        if(sNAtt[j]>=MAXANG)continue;
        const sc=d2+sNAtt[j]*6+(sSt[j]===S_FLIEH?40:0);
        if(sc<bs){bs=sc;best=j;}
      }
    }
  }
  if(best>=0){sFoe[i]=best;sNAtt[best]++;sAtt[best]=i;sPX[i]=NOGOAL;return;}
  sFoe[i]=-1;
  if(near>=0){sPX[i]=sX[near];sPZ[i]=sZ[near];}
  else{const e=naechster(U[sUnit[i]],false)||naechster(U[sUnit[i]],true);if(e){sPX[i]=e.mx;sPZ[i]=e.mz;}else sPX[i]=NOGOAL;}
}
function startSwing(i,f){
  const K=KITS[sKit[i]];let ci,dm=1;const r=Math.random();
  if(K.speer){if(r<.9){ci=C.stoss_speer;dm=1.2;}else{ci=C.schild_stoss;dm=.5;}}
  else if(r<.35){ci=C.schlag_a;dm=1;}else if(r<.6){ci=C.schlag_b;dm=1.5;}else if(r<.85){ci=C.schlag_c;dm=1.1;}else{ci=C.schild_stoss;dm=.5;}
  const dur=setClip(i,ci,sJit[i]*(1-.15*sFat[i]),true);
  sAct[i]=A_SCHLAG;sAT[i]=0;sDur[i]=dur;sHitT[i]=dur*.5;sReaT[i]=Math.max(0,dur*.5-.15);sPh[i]=0;sDmg[i]=dm;sTgt[i]=f;sOut[i]=0;
  sPer[i]=(1.1+Math.random()*.7)*(1+.4*sFat[i]);
  sFat[i]=Math.min(1,sFat[i]+.02);zaehler.schlaege++;
}
/* Ergebnis des Schlags festlegen (kurz vor dem Treffer) und Verteidiger reagieren lassen */
function reaktion(i){
  const j=sTgt[i];
  if(j<0||sSt[j]>S_FLIEH){sOut[i]=0;return;}
  const A=KITS[sKit[i]],D=KITS[sKit[j]],UA=U[sUnit[i]];
  const atkE=A.atk*(1-.4*sFat[i])*(UA.charge>0?1+(A.ans-1)*.7:1),defE=D.def*(1-.4*sFat[j]),ratio=atkE/defE;
  const ang=Math.abs(wrap(Math.atan2(sX[i]-sX[j],sZ[i]-sZ[j])-sR[j]));
  const fliehend=sSt[j]===S_FLIEH,steif=sAct[j]===A_TREFFER,busy=sAct[j]===A_SCHLAG;
  const pP=(ang<1.15&&!fliehend&&!steif)?Math.max(.08,Math.min(.65,.42/ratio))*(busy?.5:1):0;     // Parade nur von vorn
  const pD=(ang<2.4&&!fliehend&&!steif)?Math.max(.02,Math.min(.3,.16/ratio*(1-sFat[j])))*(busy?.6:1):0;   // Ausweichen nicht von hinten
  const r=Math.random();
  const out=r<pP?1:r<pP+pD?2:3;sOut[i]=out;
  if(out===3)return;
  if(busy)sCool[j]=.3;
  let ci;
  if(out===1)ci=D.speer?C.abwehr_schild:(Math.random()<.5?C.parade:C.abwehr_schild);else ci=C.ausweichen;
  const dur=setClip(j,ci,sJit[j]*(1-.15*sFat[j]),true);
  sAct[j]=A_REAKT;sActT[j]=dur;sFace[j]=i;sKX[j]=sKZ[j]=0;
  if(out===2){const dx=sX[j]-sX[i],dz=sZ[j]-sZ[i],d=Math.hypot(dx,dz)+1e-6;sKX[j]=dx/d*1.8;sKZ[j]=dz/d*1.8;}
}
function wirkung(i){
  const j=sTgt[i];if(j<0||sSt[j]>S_FLIEH)return;
  const dx=sX[j]-sX[i],dz=sZ[j]-sZ[i],r=(KITS[sKit[i]].speer?2.0:1.6)+.8;
  if(dx*dx+dz*dz>r*r)return;   // Ziel weggetreten: Fehlschlag
  let out=sOut[i];
  if(out!==3&&sAct[j]===A_TREFFER)out=3;   // inzwischen von anderem getroffen: keine Abwehr mehr
  if(out===1){zaehler.parade++;sCool[i]+=.12;return;}
  if(out===2){zaehler.ausweich++;return;}
  if(out===0)return;
  trefferWirkung(i,j);
}
function trefferWirkung(i,j){
  const UA=U[sUnit[i]],UD=U[sUnit[j]];
  const ang=Math.abs(wrap(Math.atan2(sX[i]-sX[j],sZ[i]-sZ[j])-sR[j]));
  const fm=ang<1.15?1:ang<2.4?1.5:2;
  const dmg=sDmg[i]*(fm>1.6?1.35:fm>1?1.15:1);
  sHP[j]-=dmg;zaehler.treffer++;sFat[j]=Math.min(1,sFat[j]+.01);
  if(fm>1)UD.morale-=.4*(fm-1);
  if(sHP[j]<=0){sterbe(j,i,fm);return;}
  if(sSt[j]===S_FLIEH)return;   // Fliehende werden nicht umgeworfen
  const dx=sX[j]-sX[i],dz=sZ[j]-sZ[i],d=Math.hypot(dx,dz)+1e-6;
  let kb=1.1,hold=0;
  if(sDmg[i]<.9||(UA.charge>0&&Math.random()<.4)){hold=1.2;kb=2.4;zaehler.umgeworfen++;}   // Schildstoß / Ansturm wirft um
  const dur=setClip(j,C.treffer,sJit[j],true);
  if(sAct[j]===A_SCHLAG)sCool[j]=.3;
  sAct[j]=A_TREFFER;sActT[j]=Math.max(dur,hold);sFace[j]=i;sKX[j]=sKZ[j]=0;
  sVX[j]+=dx/d*kb;sVZ[j]+=dz/d*kb;
}
function sterbe(j,i,fm){
  const u=U[sUnit[j]],dx=sX[i]-sX[j],dz=sZ[i]-sZ[j];
  const von_vorn=(Math.sin(sR[j])*dx+Math.cos(sR[j])*dz)>=0;   // Schlag von vorn -> fällt nach hinten
  sDeath[j]=von_vorn?1:0;
  sSt[j]=S_STIRBT;sAct[j]=0;sFoe[j]=-1;sVX[j]=sVZ[j]=0;
  sActT[j]=setClip(j,von_vorn?C.sterben_hinten:C.sterben_vorn,1,true);
  slotFrei(u,j);u.strength--;gefallen[u.side]++;zaehler.kills++;
  u.morale-=0.6*fm;                       // je Gefallenem (30.10.: 1,2 brach zu schnell)
  const ua=U[sUnit[i]];ua.morale=Math.min(ua.def.mor,ua.morale+.25);
  if(u.strength<=0){u.strength=0;u.state=u.fled>0?'geflohen':'aufgerieben';}
}
function rueckweichen(i,f){
  const dx=sX[i]-sX[f],dz=sZ[i]-sZ[f],d=Math.hypot(dx,dz)+1e-6;
  const dur=setClip(i,C.ausweichen,sJit[i],true);
  sAct[i]=A_REAKT;sActT[i]=dur;sFace[i]=f;sKX[i]=dx/d*1.6;sKZ[i]=dz/d*1.6;zaehler.rueckweich++;
}

function kampfTick(dt){
  // --- Einheitswerte, Nähe
  for(const u of U){u.kontakt=false;u.nahF=false;u.nF=0;u.fatS=0;u.nL=0;u.kaempfend=0;u.cnt.fill(0);}
  for(const u of U){if(gone(u)||u.state==='flieht')continue;
    for(const v of U){if(v.side===u.side||gone(v))continue;if(Math.hypot(u.mx-v.mx,u.mz-v.mz)<55){u.nahF=true;break;}}}
  // --- Kontakt (Raster) : Feind näher als 6 m
  for(let i=0;i<N;i++){
    if(sSt[i]>S_KAMPF)continue;
    const u=U[sUnit[i]];if(u.kontakt||!u.nahF||u.state==='flieht'||u.sperre>0)continue;
    const side=sSide[i],cx=((sX[i]-GX0)/ZELLE)|0,cz=((sZ[i]-GZ0)/ZELLE)|0;
    const g0=Math.max(0,cx-3),g1=Math.min(GW-1,cx+3),h0=Math.max(0,cz-3),h1=Math.min(GH-1,cz+3);
    found:for(let gz=h0;gz<=h1;gz++)for(let gx=g0;gx<=g1;gx++){
      for(let j=cHead[gz*GW+gx];j>=0;j=sNext[j]){
        if(sSide[j]===side||sSt[j]>S_FLIEH)continue;
        const dx=sX[j]-sX[i],dz=sZ[j]-sZ[i];
        if(dx*dx+dz*dz<KONT_R2){u.kontakt=true;const v=U[sUnit[j]];if(v.state!=='flieht'&&v.sperre<=0)v.kontakt=true;break found;}
      }
    }
  }
  for(const u of U){
    if(gone(u))continue;
    if(u.sperre>0)u.sperre=Math.max(0,u.sperre-dt);
    if(u.state==='flieht')continue;
    if(u.kontakt)u.kT=KONT_HALT;else u.kT-=dt;
    const eng=u.kT>0;
    if(eng&&!u.engaged)beginEngage(u);else if(!eng&&u.engaged)endEngage(u);
    u.engaged=eng;
    if(u.charge>0)u.charge=Math.max(0,u.charge-dt);
  }
  // --- Ziele prüfen, Angreifer zählen
  sNAtt.fill(0);
  for(let i=0;i<N;i++){
    const j=sFoe[i];if(j<0)continue;
    if(sSt[i]!==S_KAMPF||sSt[j]>S_FLIEH){sFoe[i]=-1;continue;}
    const dx=sX[j]-sX[i],dz=sZ[j]-sZ[i];
    if(dx*dx+dz*dz>196){sFoe[i]=-1;continue;}
    sNAtt[j]++;sAtt[j]=i;
  }
  // --- Soldaten
  for(let i=0;i<N;i++){
    const st=sSt[i];if(st>S_FLIEH)continue;
    const u=U[sUnit[i]];
    u.nL++;u.fatS+=sFat[i];
    if(sCool[i]>0)sCool[i]-=dt;
    sRet[i]-=dt;sBackT[i]-=dt;
    const act=sAct[i];
    if(act===A_SCHLAG){
      sAT[i]+=dt;
      if(sPh[i]===0&&sAT[i]>=sReaT[i]){sPh[i]=1;reaktion(i);}
      if(sPh[i]===1&&sAT[i]>=sHitT[i]){sPh[i]=2;wirkung(i);}
      if(sAct[i]===A_SCHLAG&&sAT[i]>=sDur[i]){sAct[i]=A_NIX;sCool[i]=Math.max(.05,sPer[i]-sDur[i]);}
    }else if(act!==A_NIX){
      sActT[i]-=dt;if(sActT[i]<=0){sAct[i]=A_NIX;sKX[i]=sKZ[i]=0;}
    }
    if(sSt[i]!==S_KAMPF)continue;
    let f=sFoe[i];
    if(f>=0){u.nF++;const dx=sX[f]-sX[i],dz=sZ[f]-sZ[i];if(dx*dx+dz*dz<4.5)u.kaempfend++;}
    if(sAct[i]!==A_NIX||sDelay[i]>0)continue;
    if(f>=0&&sRet[i]<=0){const dx=sX[f]-sX[i],dz=sZ[f]-sZ[i];if(dx*dx+dz*dz>12.25){sNAtt[f]--;sFoe[i]=-1;f=-1;}}
    if(f<0&&sRet[i]<=0){suche(i);f=sFoe[i];sRet[i]=.2+Math.random()*.2;}
    if(f<0)continue;
    const dx=sX[f]-sX[i],dz=sZ[f]-sZ[i],d2=dx*dx+dz*dz,K=KITS[sKit[i]],rg=K.speer?2.0:1.6;
    if(sCool[i]<=0&&d2<rg*rg){startSwing(i,f);continue;}
    if(u.pr>.12&&sBackT[i]<=0&&d2<4){   // unterlegene Seite weicht Schritt für Schritt zurück
      sBackT[i]=(1.6+Math.random()*2.4)/(.6+u.pr*1.5);rueckweichen(i,f);
    }
  }
  // --- Einheiten: Druck, Moral
  for(const u of U){
    if(gone(u))continue;
    u.lebend=u.strength;u.muede=u.nL?u.fatS/u.nL:0;
  }
  for(let i=0;i<N;i++){const j=sFoe[i];if(j>=0&&sSt[i]===S_KAMPF)U[sUnit[i]].cnt[sUnit[j]]++;}
  for(const u of U){
    if(gone(u))continue;
    let best=0;u.foeU=-1;for(let k=0;k<NU;k++)if(u.cnt[k]>best){best=u.cnt[k];u.foeU=k;}
    if(u.foeU<0){for(let k=0;k<NU;k++)if(U[k].cnt[u.i]>best){best=U[k].cnt[u.i];u.foeU=k;}}
    u.pr=0;u.flank=1;

    if(u.state==='flieht')continue;

  for(const u of U){if(u.state!=='flieht'||gone(u))continue;
    const e=naechster(u,true);let dx=u.fx,dz=u.fz;

  // --- Ende?
  if(phase==='schlacht'){
    const r=U.some(u=>u.side===0&&aktiv(u)),k=U.some(u=>u.side===1&&aktiv(u));
    if(!k)ende('sieg');else if(!r)ende('niederlage');

}

function naechster(u,mitFl){
  let best=null,bd=1e9;
  for(const v of U){if(v.side===u.side||gone(v))continue;if(!mitFl&&v.state==='flieht')continue;
    const d=Math.hypot(v.cx-u.cx,v.cz-u.cz);if(d<bd){bd=d;best=v;}}
  return best;
}
function auftrag(u,t,laufen){
  if(u.atkT===t&&u.run===laufen)return;
  u.atkT=t;u.run=laufen;u.hasDest=true;u.destX=U[t].cx;u.destZ=U[t].cz;
}
function halt(u){u.atkT=-1;u.hasDest=false;}
function autoZiel(u){   // Haltung „Angreifen“
  const T=naechster(u,false);let tgt=null,run=true;
  if(T&&Math.hypot(T.cx-u.cx,T.cz-u.cz)<45)tgt=T;
  else{const F=naechster(u,true);if(F&&F.state==='flieht'&&Math.hypot(F.cx-u.cx,F.cz-u.cz)<80)tgt=F;}
  if(tgt)auftrag(u,tgt.i,run);
}
function ki(u){
  if(gone(u)||u.state==='flieht')return;
  if(u.side===0){if(u.stance==='angreifen'&&!u.engaged&&u.atkT<0)autoZiel(u);return;}
  if(u.engaged)return;
  const T=naechster(u,false)||naechster(u,true);if(!T)return;
  const d=Math.hypot(T.cx-u.cx,T.cz-u.cz);
  if(u.k===3){auftrag(u,T.i,true);return;}                // Kelten stürmen zuerst
  // geschlossene Linie: nicht weit vor den anderen
  let dm=1e9;for(const v of U){if(v.side!==1||v===u||v.k===3||gone(v)||v.state==='flieht')continue;
    const e=naechster(v,false);if(e)dm=Math.min(dm,Math.hypot(e.cx-v.cx,e.cz-v.cz));}
  if(d>40&&d<dm-8){halt(u);return;}
  auftrag(u,T.i,d<35&&u.k===2);                           // Iberer laufen zuletzt, Libyer marschieren
}

/* ====================================================================================================
   Bewegung: Einheitsanker (Ziel der Formation) und jeder Soldat einzeln, jedes Bild
   ==================================================================================================== */
function bewegen(dt){
  for(const u of U){
    if(gone(u))continue;
    if(u.runT>0)u.runT-=dt;
    if(u.state==='flieht'){
      if(u.sn>0){u.cx=u.mx;u.cz=u.mz;}
      u.f+=Math.max(-6*dt,Math.min(6*dt,wrap(u.fAng-u.f)));u.curSpeed=u.def.run;
      continue;
    }
    if(phase==='ende'){u.curSpeed=0;continue;}
    if(u.atkT>=0){const T=U[u.atkT];
      if(gone(T)){u.atkT=-1;u.hasDest=false;}else{u.destX=T.cx;u.destZ=T.cz;u.hasDest=true;}}
    if(u.engaged){   // Anker folgt den Kämpfenden
      if(u.sn>0){const k=Math.min(1,dt*1.5);u.cx+=(u.mx-u.cx)*k;u.cz+=(u.mz-u.cz)*k;}
      const F=u.foeU>=0?U[u.foeU]:null;
      if(F)u.f+=Math.max(-2*dt,Math.min(2*dt,wrap(Math.atan2(F.cx-u.cx,F.cz-u.cz)-u.f)));
      u.curSpeed=0;u.loose=Math.max(0,u.loose-dt*.9);u.state='kampf';continue;
    }
    let moving=false;
    if(u.hasDest){
      const dx=u.destX-u.cx,dz=u.destZ-u.cz,d=Math.hypot(dx,dz);
      if(d<.6&&u.atkT<0)u.hasDest=false;
      else{
        const h=Math.atan2(dx,dz),df=wrap(h-u.f);
        u.f+=Math.max(-2.5*dt,Math.min(2.5*dt,df));
        let sp=u.run?u.def.run:u.def.walk;if(Math.abs(df)>1)sp*=.35;
        if(u.sn>0){const lag=Math.hypot(u.cx-u.mx,u.cz-u.mz);sp*=Math.max(.25,Math.min(1,1-(lag-3)/6));}   // wartet auf die Soldaten
        const st=Math.min(sp*dt,d);u.cx+=dx/d*st;u.cz+=dz/d*st;u.curSpeed=st/dt;moving=true;
        if(u.run&&u.curSpeed>2)u.runT=.7;
      }
    }
    if(!moving)u.curSpeed=0;
    u.loose+=((moving?1:0)-u.loose)*Math.min(1,dt*(moving?.6:.9));
    u.cx=Math.max(-FELD_X,Math.min(FELD_X,u.cx));u.cz=Math.max(-FELD_Z,Math.min(FELD_Z,u.cz));
    u.state=moving?(u.run?'lauf':'marsch'):'steht';
  }
}

});
cv.addEventListener('pointermove',e=>{
  const p=zeiger.get(e.pointerId);if(!p||!gest)return;
  const px=p.x,py=p.y;p.x=e.clientX;p.y=e.clientY;
  if(gest.mode==='zwei'&&zeiger.size>=2){
    const [a,b]=[...zeiger.values()];
    const ang=Math.atan2(b.y-a.y,b.x-a.x),ab=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    az-=wrap(ang-gest.ang);dist*=gest.abst/Math.max(20,ab);el+=(my-gest.my)*.004;
    gest.ang=ang;gest.abst=ab;gest.mx=mx;gest.my=my;camSetzen();return;
  }
  if(zeiger.size!==1)return;
  if(!gest.bewegt&&Math.hypot(e.clientX-gest.x0,e.clientY-gest.y0)>10)gest.bewegt=true;
  if(!gest.bewegt)return;
  if(gest.mode==='ziehen'){
    if(bodenAn(e.clientX,e.clientY,_g))platziere(gest.u,_g.x,_g.z);
  }else if(gest.mode==='dreh'){
    az-=(e.clientX-px)*.006;el+=(e.clientY-py)*.004;camSetzen();
  }else{   // Gelände schieben: Bodenpunkt bleibt unter dem Finger
    gest.mode='schieben';
    if(bodenAn(px,py,_g0)&&bodenAn(e.clientX,e.clientY,_g)){ziel.x+=_g0.x-_g.x;ziel.z+=_g0.z-_g.z;camSetzen();}
  }
});
function zeigerEnde(e){
  const p=zeiger.get(e.pointerId);zeiger.delete(e.pointerId);if(!p||!gest)return;
  if(e.type==='pointerup'&&gest.mode==='tipp'&&!gest.bewegt&&zeiger.size===0&&performance.now()-gest.t0<600)tippen(e.clientX,e.clientY);
  if(zeiger.size===0)gest=null;else if(zeiger.size===1&&gest.mode==='zwei'){gest={mode:'schieben',bewegt:true,x0:0,y0:0,t0:0};}
}
cv.addEventListener('pointerup',zeigerEnde);cv.addEventListener('pointercancel',zeigerEnde);
cv.addEventListener('wheel',e=>{dist*=1+Math.sign(e.deltaY)*.1;camSetzen();e.preventDefault();},{passive:false});
['gesturestart','gesturechange'].forEach(t=>document.addEventListener(t,e=>e.preventDefault()));
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

function platziere(u,x,z){   // Aufstellung
  u.cx=Math.max(-FELD_X+8,Math.min(FELD_X-8,x));u.cz=Math.max(-FELD_Z+8,Math.min(-20,z));
}
function tippen(px,py){
  if(!bodenAn(px,py,_g))return;
  const jetzt=performance.now(),dop=jetzt-letzterTipp.t<300&&Math.hypot(px-letzterTipp.x,py-letzterTipp.y)<30&&letzterTipp.boden;
  letzterTipp={t:jetzt,x:px,y:py,boden:false};
  const u=einheitBei(_g.x,_g.z,7);
  if(phase==='aufstellung'){
    if(u&&u.side===0)select(u.i);
    else if(sel>=0&&!u)platziere(U[sel],_g.x,_g.z);
    return;
  }
  if(phase!=='schlacht')return;
  if(u&&u.side===0){select(u.i);return;}
  if(sel<0||U[sel].state==='flieht'||gone(U[sel]))return;
  if(u&&u.side===1){angriff(sel,u.i);return;}
  letzterTipp.boden=true;
  befehl(sel,_g.x,_g.z,dop);
}
function select(i){sel=i;uiAuswahl();}

/* Befehle (auch für Tests) */
function befehl(i,x,z,laufen){
  const u=U[i];if(!u||gone(u)||u.state==='flieht')return false;
  u.atkT=-1;u.destX=Math.max(-FELD_X,Math.min(FELD_X,x));u.destZ=Math.max(-FELD_Z,Math.min(FELD_Z,z));u.hasDest=true;u.run=!!laufen;
  if(u.engaged){u.sperre=2.5;u.kT=0;}   // Marschbefehl im Gefecht: löst sich vom Feind
  return true;
}
function angriff(i,t){
  const u=U[i],T=U[t];if(!u||!T||T.side===u.side||gone(u)||gone(T)||u.state==='flieht')return false;
  auftrag(u,t,true);return true;
}

/* ====================================================================================================
   7  OBERFLÄCHE
   ==================================================================================================== */
const karten=[],chips=[];
function uiBauen(){
  const kb=$('karten'),fb=$('feinde');
  U.forEach(u=>{
    if(u.side===0){
      const d=document.createElement('div');d.className='karte';
      d.innerHTML='<div class="ring"><i></i></div><div class="t"><div class="n"></div><div class="s"></div><div class="z"></div><div class="mud"><i></i></div></div>';
      kb.appendChild(d);karten.push({u,d,ring:d.querySelector('.ring'),num:d.querySelector('i'),n:d.querySelector('.n'),s:d.querySelector('.s'),z:d.querySelector('.z'),mu:d.querySelector('.mud i')});
      d.querySelector('.n').textContent=u.name;
      langDruck(d,u,()=>select(u.i));
    }else{
      const d=document.createElement('div');d.className='chip';
      d.innerHTML='<i></i><b></b><span></span>';fb.appendChild(d);
      d.querySelector('b').textContent=u.name;
      chips.push({u,d,sp:d.querySelector('span')});
      langDruck(d,u,()=>{if(phase==='schlacht'&&sel>=0)angriff(sel,u.i);});
    }
  });
}
function langDruck(el,u,kurz){
  let tm=0,lang=false;
  el.addEventListener('pointerdown',e=>{e.stopPropagation();lang=false;clearTimeout(tm);tm=setTimeout(()=>{lang=true;erklaerung(u);},500);});
  const ab=()=>clearTimeout(tm);
  el.addEventListener('pointerleave',ab);el.addEventListener('pointercancel',ab);
  el.addEventListener('pointerup',e=>{e.stopPropagation();ab();if(!lang)kurz();});
}
function erklaerung(u){
  const K=u.def,e=$('erkl');
  e.innerHTML='<h2>'+u.name+'</h2>'
   +'<div class="zl"><span>Mannstärke</span><b>'+u.strength+' von '+PRO+'</b></div>'
   +'<div class="zl"><span>Angriff</span><b>'+fmt(K.atk)+'</b></div>'
   +'<div class="zl"><span>Abwehr</span><b>'+fmt(K.def)+'</b></div>'
   +'<div class="zl"><span>Leben je Mann</span><b>'+fmt(K.hp)+'</b></div>'
   +'<div class="zl"><span>Müdigkeit</span><b>'+fmt(u.muede*100)+' %</b></div>'
   +'<div class="zl"><span>Im Zweikampf</span><b>'+u.kaempfend+'</b></div>'
   +'<div class="zl"><span>Moral</span><b>'+fmt(u.morale)+' (Start '+fmt(K.mor)+')</b></div>'
   +'<div class="zl"><span>Gehen / Laufen</span><b>'+fmt(K.walk)+' / '+fmt(K.run)+' m/s</b></div>'
   +'<div class="zl"><span>Ansturm</span><b>'+(K.ans>1.6?'furchtbar (×2)':'wuchtig (×1,5)')+'</b></div>'
   +'<p>'+K.info+'</p><p style="font-style:normal;font-size:12px;opacity:.7">Antippen schließt die Karte.</p>';
  e.style.display='block';
}
document.addEventListener('pointerdown',e=>{if($('erkl').style.display==='block'&&!e.target.closest('.karte,.chip'))$('erkl').style.display='none';},true);
function moralFarbe(m){return m>55?'#7bbf5a':m>35?'#d9a63a':'#c4503f';}
const ZUSTAND={steht:'steht bereit',marsch:'marschiert',lauf:'stürmt',kampf:'im Nahkampf',flieht:'flieht!',geflohen:'geflohen',aufgerieben:'aufgerieben'};
function uiAktualisieren(){
  for(const k of karten){
    const u=k.u;k.d.classList.toggle('sel',sel===u.i);k.d.classList.toggle('weg',gone(u));
    k.n.textContent=u.name;k.s.innerHTML='<b>'+u.strength+'</b> Mann';k.z.textContent=ZUSTAND[u.state]||'';k.mu.style.width=Math.round(Math.min(1,u.muede*1.6)*100)+'%';
    const m=Math.max(0,Math.min(100,u.morale));k.ring.style.setProperty('--m',m);k.ring.style.setProperty('--mc',moralFarbe(u.morale));
    k.num.textContent=Math.round(m);
  }
  for(const c of chips){c.d.classList.toggle('weg',gone(c.u));c.sp.textContent=c.u.state==='flieht'?'flieht':(gone(c.u)?'–':c.u.strength);}
  const h=sel>=0?U[sel]:null;
  $('bHalt').firstChild.textContent=h&&h.stance==='angreifen'?'Angreifen':'Halten';
  $('bHalt').lastChild.textContent=h&&h.stance==='angreifen'?'Stürmt auf nahe Feinde. Antippen: Halten':'Steht fest. Antippen: Angreifen';
  $('bHalt').style.opacity=h?1:.55;
  $('bBegin').style.display=phase==='aufstellung'?'':'none';
  $('bPause').style.display=$('bTempo').style.display=phase==='schlacht'?'':'none';
  $('bPause').firstChild.textContent=pausiert?'Weiter':'Pause';
  $('bPause').lastChild.textContent=pausiert?'Schlacht geht weiter':'Schlacht anhalten';
  $('bTempo').firstChild.textContent='Tempo '+fmt(tempoV)+'×';
  $('bTempo').lastChild.textContent=tempoV>1?'Antippen: normal':'Antippen: schneller';
  let z;
  if(phase==='aufstellung')z='Ziehe deine Einheiten. Dann: Schlacht beginnen.';
  else if(phase==='ende')z=ergebnis==='sieg'?'Das Feld gehört Rom.':'Rom ist geschlagen.';
  else if(pausiert)z='Pause';
  else z=h?(h.name+' gewählt – Gelände antippen: marschieren, doppelt: laufen, Feind: angreifen'):'Wähle eine Einheit (Karte unten oder auf dem Feld).';
  $('zeile').textContent=z;
}
function uiAuswahl(){uiAktualisieren();}
function uiEnde(){
  const e=$('ende'),r=[0,0];for(const u of U)if(!gone(u)||u.state==='geflohen')r[u.side]+=u.state==='geflohen'?0:u.strength;
  const fl=[0,0];for(const u of U)fl[u.side]+=u.fled||0;
  const lebt=[0,0];for(const u of U)lebt[u.side]+=(u.state==='aufgerieben'||u.state==='geflohen')?0:u.strength;
  e.className=ergebnis==='sieg'?'sieg':'nied';
  e.innerHTML='<h2 class="titel">'+(ergebnis==='sieg'?'Sieg':'Niederlage')+'</h2>'
    +'<p class="u">'+(ergebnis==='sieg'?'Karthago weicht. Rom behauptet das Feld.':'Deine Legion ist zerschlagen.')+'</p>'
    +'<div class="zl"><span>Gefallene Rom</span><b>'+gefallen[0]+'</b></div>'
    +'<div class="zl"><span>Gefallene Karthago</span><b>'+gefallen[1]+'</b></div>'
    +'<div class="zl"><span>Geflohen Rom / Karthago</span><b>'+fl[0]+' / '+fl[1]+'</b></div>'
    +'<div class="zl"><span>Auf dem Feld Rom / Karthago</span><b>'+lebt[0]+' / '+lebt[1]+'</b></div>'
    +'<button class="plak gross" id="bNoch"><b>Noch einmal</b><small>Neue Aufstellung</small></button>';
  e.style.display='block';$('bNoch').onclick=neu;
}
$('bBegin').onclick=()=>start();
$('bHalt').onclick=()=>{if(sel<0)return;const u=U[sel];u.stance=u.stance==='angreifen'?'halten':'angreifen';if(u.stance==='angreifen'&&!u.engaged&&u.atkT<0&&phase==='schlacht')autoZiel(u);uiAktualisieren();};
$('bPause').onclick=()=>{pausiert=!pausiert;uiAktualisieren();};
$('bTempo').onclick=()=>{tempoV=tempoV>1?1:2;uiAktualisieren();};
for(const id of['bBegin','bHalt','bPause','bTempo'])$(id).addEventListener('pointerdown',e=>e.stopPropagation());

/* ====================================================================================================
   8  ABLAUF, HAUPTSCHLEIFE, TEST-SCHNITTSTELLE
   ==================================================================================================== */
function start(){
  if(phase!=='aufstellung')return false;
  phase='schlacht';pausiert=false;tickAcc=0;kiAcc=.5;
  for(const u of U)if(u.side===0&&u.stance==='angreifen')u.aiT=0;
  uiAktualisieren();return true;
}
function neu(){
  $('ende').style.display='none';$('erkl').style.display='none';
  gefallen[0]=gefallen[1]=0;ergebnis=null;pausiert=false;tempoV=1;sel=-1;
  const alt=U.map(u=>({ring:u.ring,flag:u.flag}));
  einheitenAnlegen();U.forEach((u,i)=>{u.ring=alt[i].ring;u.flag=alt[i].flag;});
  for(const k of karten)k.u=U[k.u.i];for(const c of chips)c.u=U[c.u.i];
  phase='aufstellung';tickAcc=0;uiAktualisieren();
}
function groesse(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();camSetzen();}
addEventListener('resize',groesse);

let letzt=0,fz=0,ft=0,uiT=0;const fpsLog=[];
function schleife(t){
  requestAnimationFrame(schleife);
  const dt=Math.min(.25,(t-letzt)/1000);letzt=t;
  if(phase==='aufstellung'){schritt(Math.min(dt,.05));}
  else if((phase==='schlacht'||phase==='ende')&&!pausiert){
    const g=dt*tempoV,n=Math.max(1,Math.ceil(g/.05)),h=g/n;
    for(let k=0;k<n;k++)schritt(h);
  }
  for(const K of KIT)K.mat.userData.U.uTime.value=spielzeit;
  baueInstanzen();markerUpdate(t);
  renderer.render(scene,camera);
  if(t-uiT>250){uiT=t;uiAktualisieren();}
  fz++;if(!ft)ft=t;
  if(t-ft>=2000){const f=fz*1000/(t-ft);$('fps').textContent=fmt(f)+' B/s';fpsLog.push(Math.round(f*10)/10);fz=0;ft=t;}
}

async function laden(){
  groesse();
  const ladeBar=f=>$('balki').style.width=Math.round(f*100)+'%';
  for(let i=0;i<KITS.length;i++){
    $('ladez').textContent=KITS[i].n+' ('+(i+1)+'/'+KITS.length+')';
    const r=await fetch('figuren/k_'+KITS[i].id+'.json');
    if(!r.ok)throw new Error('Paket fehlt: k_'+KITS[i].id+'.json');
    const tot=+r.headers.get('content-length')||0;let got=0;
    const rd=r.body.getReader(),parts=[];
    for(;;){const{done,value}=await rd.read();if(done)break;parts.push(value);got+=value.length;
      ladeBar((i+(tot?Math.min(1,got/tot):.5)*.85)/KITS.length);}
    const all=new Uint8Array(got);let o=0;for(const p of parts){all.set(p,o);o+=p.length;}
    const pk=JSON.parse(new TextDecoder().decode(all));
    $('ladez').textContent=KITS[i].n+' wird aufgestellt …';
    await new Promise(r=>requestAnimationFrame(r));
    kitBauen(i,pk);ladeBar((i+1)/KITS.length);
  }
  einheitenAnlegen();marker();uiBauen();
  phase='aufstellung';
  $('lade').style.display='none';
  uiAktualisieren();
  requestAnimationFrame(schleife);
}
laden().catch(e=>{$('ladez').textContent='Fehler: '+e.message;console.error(e);});

/* Test-Schnittstelle */
window.SCHLACHT={
  get phase(){return phase;},get pausiert(){return pausiert;},get tempoWert(){return tempoV;},get zeit(){return spielzeit;},
  get units(){return U;},get gefallen(){return gefallen.slice();},get ergebnis(){return ergebnis;},get fps(){return fpsLog;},
  get tris(){return KIT.map(k=>k.tris);},get zaehler(){return zaehler;},
  soldat(id){return{x:sX[id],z:sZ[id],st:sSt[id],act:sAct[id],hp:sHP[id],fat:sFat[id],clip:CN[sCur[id]],foe:sFoe[id],unit:sUnit[id]};},
  start,befehl,angriff,neu,waehle:select,
  tempo(n){tempoV=Math.max(.1,Math.min(30,+n||1));uiAktualisieren();},
  pause(p){pausiert=p===undefined?!pausiert:!!p;uiAktualisieren();},
  stellen(i,x,z){if(phase==='aufstellung'&&U[i])platziere(U[i],x,z);},
  bildPos(x,z){const v=new THREE.Vector3(x,0,z).project(camera);return[(v.x+1)/2*innerWidth,(1-v.y)/2*innerHeight];},
  haltung(i,s){if(U[i])U[i].stance=s;},
};
</script>
