<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Schlacht – Testschlacht</title>
<style>
:root{--bg:#1c1a16;--ink:#efe6d2;--mut:#b8ab90;--tinte:#2e261d;--bronze:#a9793a;--bronze2:#7a5524;--gold:#e0b45a;--rot:#a8322a;
  --holz:linear-gradient(#2e261d,#241d16);--perg:linear-gradient(#ecdfba,#cfba88);
  --sl:max(10px,env(safe-area-inset-left));--sr:max(10px,env(safe-area-inset-right));--st:max(10px,env(safe-area-inset-top));--sb:max(10px,env(safe-area-inset-bottom))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.35 Georgia,serif;overflow:hidden;touch-action:none;overscroll-behavior:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.titel{font-family:Marcellus,"Palatino Linotype",Palatino,Georgia,serif;letter-spacing:.02em}

/* Oberfläche: dunkles Holz für Karten, Bronze für Knöpfe, Pergament für Tafeln (Vorgabe 30.10.: eigene Gestaltung) */
svg.ic{width:26px;height:26px;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
svg.sy{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
#fps{position:fixed;right:var(--sr);top:var(--st);background:rgba(28,24,18,.8);border-radius:6px;padding:4px 9px;font:12px monospace;color:var(--mut);pointer-events:none;z-index:3}

/* oben Mitte: Kräftevergleich + Hinweiszeile */
#oben{position:fixed;left:50%;top:var(--st);transform:translateX(-50%);width:min(440px,calc(100vw - 380px));display:flex;flex-direction:column;align-items:center;gap:5px;pointer-events:none;z-index:2}
#kraft{width:100%;padding:6px 12px 5px;background:var(--holz);border:1px solid var(--bronze2);border-radius:11px;box-shadow:inset 0 0 0 1px rgba(224,180,90,.25),0 3px 10px rgba(0,0,0,.5)}
#kraft .kk{display:flex;align-items:center;gap:8px}
#kraft .kn{font:600 17px Marcellus,Georgia,serif;font-variant-numeric:tabular-nums;min-width:34px}
#kraft .kn.r{color:#e78a7e;text-align:right}#kraft .kn.k{color:#c79be6}
#kraft .kb{flex:1;height:13px;border-radius:7px;background:#7a3fa0;overflow:hidden;position:relative;border:1px solid #14110d;box-shadow:inset 0 1px 3px rgba(0,0,0,.6)}
#kraft .kb i{position:absolute;left:0;top:0;bottom:0;width:50%;background:linear-gradient(#d4503f,#8e241a);transition:width .6s}
#kraft .kb b{position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:var(--gold);opacity:.8}
#kraft .kz{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mut);margin-top:2px}
#kraft .kz em{font-style:normal;color:var(--gold);font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:4px}
#kraft svg.ic{width:13px;height:13px}
#hinweis{max-width:100%;text-align:center;padding:4px 14px;font-size:13px;border-radius:8px;background:rgba(28,24,18,.78);border:1px solid rgba(169,121,58,.55);opacity:0;transition:opacity 1.2s;min-height:24px}
#hinweis.an{opacity:1;transition:opacity .25s}

/* Bilder der Einheiten: echtes Bild (karten/<id>.jpg) über gemaltem Platzhalter */
.bild{position:relative;overflow:hidden;--c1:#c9473a;--c2:#3f100c;
  background:radial-gradient(circle at 28% 18%,rgba(255,226,160,.38),transparent 52%),repeating-linear-gradient(112deg,rgba(0,0,0,.07) 0 3px,transparent 3px 8px),linear-gradient(165deg,var(--c1),var(--c2))}
.bild.s1{--c1:#a56bd0;--c2:#240f33}
.bild::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 22px 4px rgba(0,0,0,.55);pointer-events:none}
.bild .ph{position:absolute;inset:14% 14% 18%;color:#f1d79a;opacity:.92;filter:drop-shadow(0 2px 2px rgba(0,0,0,.65))}
.bild img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%;opacity:0;transition:opacity .3s}
.bild img.ok{opacity:1}

/* Feindliste links */
#feinde{position:fixed;left:var(--sl);top:var(--st);display:flex;flex-direction:column;gap:5px;width:176px;z-index:2}
.fk{display:flex;align-items:center;gap:8px;padding:4px 8px 4px 4px;border-radius:9px;background:var(--holz);border:1px solid #5a3f1f;min-height:52px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.45)}
.fk .bild{width:38px;height:46px;border-radius:5px;flex:none;border:1px solid rgba(0,0,0,.6)}
.fk .t{flex:1;min-width:0}
.fk .n{font:13px Marcellus,Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fk .b{height:6px;border-radius:3px;background:rgba(0,0,0,.5);overflow:hidden;margin:3px 0 2px}
.fk .b i{display:block;height:100%;width:100%;background:linear-gradient(#b47be0,#6f3a95)}
.fk .z{font-size:11px;color:var(--mut);display:flex;justify-content:space-between}
.fk .z b{font-weight:normal;color:var(--gold)}
.fk.weg{opacity:.4;filter:saturate(.2)}
.fk.fl .bild{filter:grayscale(.7)}

/* Befehle rechts: immer EINE Spalte */
#spalte{position:fixed;right:var(--sr);top:calc(var(--st) + 30px);display:flex;flex-direction:column;gap:6px;width:150px;z-index:2}
.plak{display:flex;align-items:center;gap:9px;text-align:left;padding:7px 11px;border-radius:10px;
  background:linear-gradient(#cfa05a,#8f6429);border:1px solid #5a3f17;color:#20170c;box-shadow:inset 0 1px 0 rgba(255,235,190,.5),0 3px 8px rgba(0,0,0,.45);min-height:48px}
.plak span{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.plak b{font-family:Marcellus,Georgia,serif;font-weight:normal;font-size:16px}
.plak small{font-size:11.5px;opacity:.78;min-height:13px}
.plak:active{filter:brightness(.88)}
.plak.gross{background:linear-gradient(#e6bd6c,#a8722a);min-height:60px}
.plak.gross b{font-size:18px}
.plak.rot{background:linear-gradient(#c4503f,#7e231a);color:#fbeee0}
.plak.an{background:linear-gradient(#f0cf86,#b9812f);box-shadow:inset 0 0 0 2px var(--gold),0 3px 8px rgba(0,0,0,.45)}
.plak[hidden]{display:none}

/* Einheitenleiste unten */
#karten{position:fixed;left:calc(var(--sl) + 276px);right:calc(var(--sr) + 160px);bottom:var(--sb);display:flex;gap:10px;justify-content:center;align-items:flex-end;z-index:2}
.karte{position:relative;width:116px;padding:5px 5px 6px;border-radius:12px;background:var(--holz);border:2px solid #5a3f1f;
  box-shadow:0 3px 10px rgba(0,0,0,.55);cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s}
.karte .bild{height:118px;border-radius:7px;border:1px solid rgba(0,0,0,.7)}
.karte.sel{border-color:var(--gold);transform:translateY(-10px);box-shadow:0 0 16px rgba(224,180,90,.7),0 5px 12px rgba(0,0,0,.55)}
.karte.weg{opacity:.5;filter:saturate(.25)}
.karte .ring{position:absolute;right:8px;top:8px;z-index:2}
.karte .zst{position:absolute;left:7px;right:7px;bottom:50px;z-index:2;display:flex;align-items:center;gap:4px;padding:2px 6px;border-radius:9px;background:rgba(20,16,12,.72);font-size:11px;color:#f1d79a;white-space:nowrap;overflow:hidden}
.karte .zst svg{width:13px;height:13px;flex:none;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.karte .n{font:14px Marcellus,Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:5px 2px 2px}
.karte .st{display:flex;align-items:center;gap:6px;margin:0 2px}
.karte .st .bar{flex:1;height:8px;border-radius:4px;background:rgba(0,0,0,.55);overflow:hidden}
.karte .st .bar i{display:block;height:100%;width:100%;background:linear-gradient(#e46a58,#a22d22)}
.karte .st b{font:600 13px Georgia,serif;color:var(--gold);min-width:22px;text-align:right;font-variant-numeric:tabular-nums}
.karte .mud{height:3px;border-radius:2px;background:rgba(0,0,0,.45);margin:4px 2px 0;overflow:hidden}
.karte .mud i{display:block;height:100%;width:0;background:#c9a24a}
.ring{width:38px;height:38px;border-radius:50%;flex:none;background:conic-gradient(var(--mc,#7bbf5a) calc(var(--m,100)*1%),rgba(0,0,0,.6) 0);display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.7)}
.ring i{width:28px;height:28px;border-radius:50%;background:#241d16;display:grid;place-items:center;font:normal 11px Georgia,serif;color:var(--ink)}
.karte .mk{position:absolute;left:8px;top:8px;z-index:2;width:18px;height:18px;border-radius:50%;background:var(--gold);color:#20170c;font:700 11px/18px Georgia,serif;text-align:center;display:none}
.karte.sel.multi .mk{display:block}

/* Einheitenfenster links unten */
#fenster{position:fixed;left:var(--sl);bottom:var(--sb);width:262px;padding:8px 10px 9px;display:none;gap:10px;flex-wrap:wrap;
  background:var(--holz);border:2px solid var(--bronze2);border-radius:12px;box-shadow:inset 0 0 0 1px rgba(224,180,90,.25),0 4px 14px rgba(0,0,0,.6);z-index:2}
#fenster.an{display:flex}
#fenster .bild{width:90px;height:120px;border-radius:7px;border:1px solid rgba(0,0,0,.7);flex:none}
#fenster .w{flex:1;min-width:0}
#fenster h3{margin:0 0 3px;font:17px Marcellus,Georgia,serif;font-weight:normal;color:var(--gold);line-height:1.15}
#fenster .zl{display:flex;justify-content:space-between;font-size:13px;padding:1.5px 0;border-bottom:1px dotted rgba(184,171,144,.25)}
#fenster .zl b{font-weight:normal;color:var(--ink);font-variant-numeric:tabular-nums}
#fenster p{flex-basis:100%;margin:0;font-size:12.5px;font-style:italic;color:var(--mut);line-height:1.3}
#fenster .x{position:absolute;right:0;top:0;width:44px;height:44px;border:0;background:none;color:var(--mut);font-size:20px;line-height:1}

/* schwebende Banner über den Einheiten (DOM, per Transform; höchstens 15 Hz) */
#banner{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.bnr{position:absolute;left:0;top:0;width:44px;margin-left:0;transform-origin:50% 100%;will-change:transform,opacity;display:none;--c:#b02a22}
.bnr.s1{--c:#7a3fa0}
.bnr svg.bs{display:block;width:44px;height:52px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.6))}
.bnr svg.bs path{fill:var(--c);stroke:#e0b45a;stroke-width:2.5}
.bnr.sel svg.bs path{stroke:#fff3c4;stroke-width:4}
.bnr.fl{filter:grayscale(.8);opacity:.7}
.bnr .sym{fill:none;stroke:#f6e4b4;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.bnr .bb{height:6px;margin:1px 5px 0;border-radius:3px;background:rgba(0,0,0,.7);overflow:hidden;border:1px solid rgba(0,0,0,.8)}
.bnr .bb i{display:block;height:100%;width:100%;background:#e0b45a}

/* Tafeln */
#ende{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);display:none;background:var(--perg);color:var(--tinte);
  border:3px solid var(--bronze2);border-radius:14px;box-shadow:inset 0 0 0 2px rgba(255,240,200,.6),0 10px 40px rgba(0,0,0,.65);padding:18px 26px 20px;width:min(520px,94vw);max-height:94vh;overflow:auto;text-align:center;z-index:5}
#ende h2{margin:0 0 2px;font-family:Marcellus,Georgia,serif;font-weight:normal;font-size:44px}
#ende.sieg h2{color:#8a5a0e}#ende.nied h2{color:#8c2018}
#ende .u{margin:0 0 10px;font-style:italic}
#ende .eh{display:flex;align-items:center;gap:12px;padding:6px 0;border-top:1px dotted rgba(90,63,23,.45);text-align:left}
#ende .eh .bild{width:42px;height:56px;border-radius:5px;flex:none;border:1px solid rgba(60,40,10,.7)}
#ende .eh .t{flex:1;min-width:0}
#ende .eh .n{font:16px Marcellus,Georgia,serif}
#ende .eh .v{height:7px;border-radius:4px;background:rgba(60,40,10,.25);overflow:hidden;display:flex;margin:4px 0 2px}
#ende .eh .v i{display:block;height:100%}
#ende .eh small{font-size:12.5px;color:#5a4220}
#ende .zl{display:flex;justify-content:space-between;gap:30px;padding:4px 0;border-bottom:1px dotted rgba(90,63,23,.4)}
#ende .plak{margin:16px auto 0;justify-content:center;width:220px;text-align:center}
#ende .plak span{align-items:center}
#lade{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(#2e261d,#14110d);flex-direction:column;gap:12px;z-index:9;font-size:20px}
#lade .z{color:var(--mut);font-size:14px;min-height:18px}
.balken{width:min(320px,70vw);height:12px;border-radius:7px;background:#14110d;border:1px solid var(--bronze2);overflow:hidden}
.balken i{display:block;height:100%;width:0;background:linear-gradient(#e6bd6c,#a8722a)}

/* Hochformat: Fenster über die Leiste */
@media (max-aspect-ratio:1/1){
  #karten{left:var(--sl);right:calc(var(--sr) + 160px)}
  #fenster{bottom:calc(var(--sb) + 190px)}
}
@media (max-height:640px){.karte .bild{height:92px}.karte .zst{bottom:46px}}
</style>
</head>

<canvas id="cv"></canvas>
<div id="banner"></div>
<div id="oben">
  <div id="kraft">
    <div class="kk"><span class="kn r" id="kR">0</span><div class="kb"><i id="kBar"></i><b></b></div><span class="kn k" id="kK">0</span></div>

  </div>

<script>
'use strict';
/* ====================================================================================================
   Spielbare Testschlacht. Abschnitte: 1 Figurenmotor · 2 Gelände · 3 Einheiten/Formation · 4 Kampfregeln · 5 KI
   · 6 Steuerung · 7 Oberfläche · 8 Hauptschleife/Test-Schnittstelle.  Einheit: 1 m. Figuren blicken nach +Z.
   ==================================================================================================== */
const $=id=>document.getElementById(id);
const b64=s=>{const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u.buffer;};
const PI=Math.PI,TAU=PI*2;
const wrap=a=>{while(a>PI)a-=TAU;while(a<-PI)a+=TAU;return a;};
const fmt=n=>String(Math.round(n*10)/10).replace('.',',');

/* ---------- Daten ---------- */
/* Zusatzfelder: card = Bildname (karten/<card>.jpg) · sym = Symbol · schild = Chance, ein Geschoss von vorn abzuwehren · bloss = ungeschützt (Steine ×1,6)
   fern = Fernkampf: reich m · nachl [min,max] s · vorrat je Mann · schaden · moral (Zusatzabzug je Treffer) · wurfT Zeitpunkt des Abwurfs im Clip
   · v Fluggeschwindigkeit m/s · weich = Plänkler weicht, wenn Nahkämpfer näher als m · rueck = so weit weicht er zurück */
const KITS=[
  {id:'A1_hastatus',key:'hast',n:'Hastati',card:'hastatus',sym:'schwert',schild:.55,atk:10,def:11,mor:70,hp:3,walk:1.3,run:3.8,ans:1.5,speer:false,
   info:'Gedrillte römische Linieninfanterie. Hält die Linie, bricht nicht so schnell.'},

function kampfTick(dt){
  // --- Einheitswerte, Nähe
  for(const u of U){u.kontakt=false;u.nahF=false;u.nF=0;u.fatS=0;u.nL=0;u.kaempfend=0;u.cnt.fill(0);u.munS=0;

    const g0=Math.max(0,cx-3),g1=Math.min(GW-1,cx+3),h0=Math.max(0,cz-3),h1=Math.min(GH-1,cz+3);
    found:for(let gz=h0;gz<=h1;gz++)for(let gx=g0;gx<=g1;gx++){

        const dx=sX[j]-sX[i],dz=sZ[j]-sZ[i];
        if(dx*dx+dz*dz<KONT_R2){u.kontakt=true;const v=U[sUnit[j]];if(v.state!=='flieht'&&v.sperre<=0)v.kontakt=true;break found;}

    const dx=sX[j]-sX[i],dz=sZ[j]-sZ[i];

      if(u.fZ>=0&&st===S_FORM&&sAct[i]===A_NIX&&sCool[i]<=0&&sDelay[i]<=0&&sAmmo[i]>0&&phase==='schlacht')wurfStart(i,u);

    if(f<0&&sRet[i]<=0){suche(i);f=sFoe[i];sRet[i]=.2+Math.random()*.2;}

    const e=naechster(u,true);let dx=u.fx,dz=u.fz;

    const r=U.some(u=>u.side===0&&aktiv(u)),k=U.some(u=>u.side===1&&aktiv(u));

function ende(was){

/* ====================================================================================================
   5  KI  (einfach und vorsichtig)
   ==================================================================================================== */
function naechster(u,mitFl){
  let best=null,bd=1e9;
  for(const v of U){if(v.side===u.side||gone(v))continue;if(!mitFl&&v.state==='flieht')continue;
    const d=Math.hypot(v.cx-u.cx,v.cz-u.cz);if(d<bd){bd=d;best=v;}}
  return best;
}
function auftrag(u,t,laufen){
  if(u.atkT===t&&u.run===laufen)return;
  u.atkT=t;u.run=laufen;u.hasDest=true;u.destX=U[t].cx;u.destZ=U[t].cz;
}
function halt(u){u.atkT=-1;u.hasDest=false;}
function autoZiel(u){   // Haltung „Angreifen“
  const T=naechster(u,false);let tgt=null,run=true;
  if(T&&Math.hypot(T.cx-u.cx,T.cz-u.cz)<45)tgt=T;
  else{const F=naechster(u,true);if(F&&F.state==='flieht'&&Math.hypot(F.cx-u.cx,F.cz-u.cz)<80)tgt=F;}
  if(tgt)auftrag(u,tgt.i,run);
}
/* Plänkler (Velites, Balearen): schießen im Stehen, weichen Nahkämpfern aus; der Spieler kann sie näher an ein Ziel führen */
let _nv=null,_nd=0;
function naechsterNahk(u){   // nächste feindliche Einheit, die im Nahkampf gefährlich ist -> _nv,_nd
  _nv=null;_nd=1e9;
  for(const v of U){if(v.side===u.side||gone(v)||v.state==='flieht')continue;if(v.fern&&v.mun>0)continue;const d=Math.hypot(v.cx-u.cx,v.cz-u.cz);if(d<_nd){_nd=d;_nv=v;}}
}
function fernKI(u){   // true = Fernkampf-Verhalten führt die Einheit (Aufruf alle 0,5 s)
  const F=u.fern;if(!F||u.mun<=0)return false;
  if(gone(u)||u.state==='flieht'||u.engaged)return true;
  if(u.weichT>0)u.weichT-=.5;
  const eigen=u.side===0;
  naechsterNahk(u);
  if(u.plaenk&&_nv&&_nd<F.weich&&u.weichT<=0&&(u.rueck||!(eigen&&u.hasDest))){   // Nahkämpfer zu nah: zurückweichen (nicht, wenn der Spieler marschieren lässt)
    const ax=u.cx-_nv.cx,az=u.cz-_nv.cz,l=Math.hypot(ax,az)||1;
    u.destX=Math.max(-FELD_X+4,Math.min(FELD_X-4,u.cx+ax/l*F.rueck));u.destZ=Math.max(-FELD_Z+4,Math.min(FELD_Z-4,u.cz+az/l*F.rueck));
    u.hasDest=true;u.atkT=-1;u.run=true;u.rueck=true;u.zurueck=true;u.weichT=7;
    return true;
  }
  if(u.rueck&&u.hasDest)return true;
  if(!eigen){   // Feind-KI: nach dem Ausweichen zurück auf den Platz vor der Linie
    if(u.zurueck&&!u.hasDest&&(!_nv||_nd>F.weich*2.2)){u.destX=u.startX;u.destZ=u.startZ;u.hasDest=true;u.run=false;u.atkT=-1;u.zurueck=false;}
    return true;
  }
  if(!u.hasDest&&(u.fBef>=0||u.stance==='angreifen')){   // Spieler: in Schussweite an das Ziel heranführen
    const T=u.fBef>=0?U[u.fBef]:naechster(u,false);
    if(T&&!gone(T)){const d=Math.hypot(T.cx-u.cx,T.cz-u.cz);
      if(d>F.reich*.85){const l=d||1;u.destX=T.cx+(u.cx-T.cx)/l*F.reich*.75;u.destZ=T.cz+(u.cz-T.cz)/l*F.reich*.75;u.hasDest=true;u.atkT=-1;u.run=false;}}
  }

}
function ki(u){
  if(gone(u)||u.state==='flieht')return;
  if(u.fern&&fernKI(u))return;
  if(u.side===0){if(u.stance==='angreifen'&&!u.engaged&&u.atkT<0)autoZiel(u);return;}
  if(u.engaged)return;
  const T=naechster(u,false)||naechster(u,true);if(!T)return;
  const d=Math.hypot(T.cx-u.cx,T.cz-u.cz);
  if(u.k===3){auftrag(u,T.i,true);return;}                // Kelten stürmen zuerst
  // geschlossene Linie: nicht weit vor den anderen
  let dm=1e9;for(const v of U){if(v.side!==1||v===u||v.k===3||v.fern||gone(v)||v.state==='flieht')continue;
    const e=naechster(v,false);if(e)dm=Math.min(dm,Math.hypot(e.cx-v.cx,e.cz-v.cz));}
  if(d>40&&d<dm-8){halt(u);return;}
  auftrag(u,T.i,d<35&&u.k===2);                           // Iberer laufen zuletzt, Libyer marschieren
}

/* ====================================================================================================
   Bewegung: Einheitsanker (Ziel der Formation) und jeder Soldat einzeln, jedes Bild
   ==================================================================================================== */
function bewegen(dt){
  for(const u of U){
    if(gone(u))continue;

    if(u.state==='flieht'){
      if(u.sn>0){u.cx=u.mx;u.cz=u.mz;}
      u.f+=Math.max(-6*dt,Math.min(6*dt,wrap(u.fAng-u.f)));u.curSpeed=u.def.run;
      continue;
    }
    if(phase==='ende'){u.curSpeed=0;continue;}
    if(u.atkT>=0){const T=U[u.atkT];
      if(gone(T)){u.atkT=-1;u.hasDest=false;}else{u.destX=T.cx;u.destZ=T.cz;u.hasDest=true;}}
    if(u.engaged){   // Anker folgt den Kämpfenden
      if(u.sn>0){const k=Math.min(1,dt*1.5);u.cx+=(u.mx-u.cx)*k;u.cz+=(u.mz-u.cz)*k;}
      const F=u.foeU>=0?U[u.foeU]:null;

      u.curSpeed=0;u.loose=Math.max(0,u.loose-dt*.9);u.state='kampf';continue;
    }

      const dx=u.destX-u.cx,dz=u.destZ-u.cz,d=Math.hypot(dx,dz);
      if(d<.6&&u.atkT<0)u.hasDest=false;
      else{

        u.f+=Math.max(-2.5*dt,Math.min(2.5*dt,df));
        let sp=u.run?u.def.run:u.def.walk;if(Math.abs(df)>1)sp*=.35;
        {grad(u.cx,u.cz);const sl=(_gx*dx+_gz*dz)/d;sp*=sl>0?1-Math.min(.4,sl*2.2):1+Math.min(.12,-sl);sp*=1-.3*WF(u.cx,u.cz);}   // bergauf langsamer, Wald bremst
        if(u.sn>0){const lag=Math.hypot(u.cx-u.mx,u.cz-u.mz);sp*=Math.max(.25,Math.min(1,1-(lag-3)/6));}   // wartet auf die Soldaten
        const st=Math.min(sp*dt,d);u.cx+=dx/d*st;u.cz+=dz/d*st;u.curSpeed=st/dt;moving=true;
        if(u.run&&u.curSpeed>2)u.runT=.7;

    {const wd=WF(u.cx,u.cz),lz=Math.max(moving?1:0,.85*wd);u.loose+=(lz-u.loose)*Math.min(1,dt*(lz>u.loose?.6:.9));}   // Wald lockert die Formation
    u.cx=Math.max(-FELD_X,Math.min(FELD_X,u.cx));u.cz=Math.max(-FELD_Z,Math.min(FELD_Z,u.cz));
    u.state=moving?(u.run?'lauf':'marsch'):'steht';
  }
}
function figuren(dt){

      const f=act===A_SCHLAG?sTgt[i]:sFace[i];

    }

      else if(f>=0){
        const dx=sX[f]-sX[i],dz=sZ[f]-sZ[i],d=Math.sqrt(dx*dx+dz*dz)+1e-6,reach=K.speer?1.45:1.1;
        face=Math.atan2(dx,dz);hf=true;
        if(d>reach+.3){
          let sp=(sSt[f]===S_FLIEH||d>5)?K.run:K.walk*1.3;sp*=sJit[i]*(1-.25*sFat[i]);
          const ds=Math.min(sp,(d-reach)*2.5+.2);dvx=dx/d*ds;dvz=dz/d*ds;
        }else if(d<reach-.25){dvx=-dx/d*.5;dvz=-dz/d*.5;}
      }else if(sPX[i]!==NOGOAL){   // keinen Gegner: nach vorn drängen
        const dx=sPX[i]-sX[i],dz=sPZ[i]-sZ[i],d=Math.sqrt(dx*dx+dz*dz)+1e-6;
        face=Math.atan2(dx,dz);hf=true;
        if(d>1.3){const ds=Math.min(K.walk*1.3*sJit[i]*(1-.25*sFat[i]),d*1.5);dvx=dx/d*ds;dvz=dz/d*ds;}
      }else{hf=true;face=u.f;}
    }

      if(sMov[i]){if(d<.12)sMov[i]=0;}else if(d>.45){sMov[i]=1;sDelay[i]=Math.random()*.4;}
      if(sMov[i]&&sDelay[i]<=0){
        const base=(u.hasDest&&u.run)||u.runT>0?K.run:K.walk;
        const vmax=base*sJit[i]*(1-.25*sFat[i])*(d>2.5?1.3:d>1?1.12:1);
        const ds=Math.min(vmax,2.2*d+.15);dvx=dx/d*ds;dvz=dz/d*ds;
        if(d>1.5){face=Math.atan2(dx,dz);hf=true;}else{face=u.f+sJR[i];hf=true;}
      }else{face=u.f+sJR[i];hf=true;}
    }
    // Gelände: bergauf langsamer und müder, bergab etwas schneller, Wald bremst
    let slope=0;
    if(dvx!==0||dvz!==0){
      grad(sX[i],sZ[i]);const l=Math.sqrt(dvx*dvx+dvz*dvz);slope=(_gx*dvx+_gz*dvz)/l;
      const k=(slope>0?1-Math.min(.4,slope*2.2):1+Math.min(.12,-slope))*(1-.35*WF(sX[i],sZ[i]));dvx*=k;dvz*=k;

            const cb=lauf?C.laufen_b:C.gehen_b,rb=cl[cb].speed||(lauf?K.run:K.walk),r=sp/rb,war=cur===cb;

      }

const _v=new THREE.Vector3(),_g={x:0,z:0},_g0={x:0,z:0};
function bodenAn(px,py,out){   // Strahl gegen das Höhenfeld (Schrittsuche + Halbierung), keine Speicheranforderung
  _v.set(px/innerWidth*2-1,-(py/innerHeight*2-1),.5).unproject(camera).sub(camera.position).normalize();
  const ox=camera.position.x,oy=camera.position.y,oz=camera.position.z,dx=_v.x,dy=_v.y,dz=_v.z;
  let tt=0,pt=0,step=1.5,hit=false;
  for(let k=0;k<1000;k++){
    const y=oy+dy*tt;
    if(dy>0&&y>40)return false;
    if(y<H(ox+dx*tt,oz+dz*tt)){hit=true;break;}
    pt=tt;tt+=step;if(step<6)step*=1.012;if(tt>2800)return false;
  }
  if(!hit)return false;
  let lo=pt,hi=tt;
  for(let k=0;k<9;k++){const m=(lo+hi)*.5;if(oy+dy*m<H(ox+dx*m,oz+dz*m))hi=m;else lo=m;}
  out.x=ox+dx*hi;out.z=oz+dz*hi;return true;
}

    const d=Math.hypot(u.cx-x,u.cz-z);if(d<bd){bd=d;best=u;}}

function platziere(u,x,z){   // Aufstellung
  u.cx=Math.max(-FELD_X+8,Math.min(FELD_X-8,x));u.cz=Math.max(-FELD_Z+8,Math.min(-20,z));

function tippen(px,py){

  letzterTipp={t:jetzt,x:px,y:py,boden:false};
  const u=einheitBei(_g.x,_g.z,7);
  if(phase==='aufstellung'){
    if(u&&u.side===0)select(u.i);
    else if(sel>=0&&!u)platziere(U[sel],_g.x,_g.z);
    return;
  }
  if(phase!=='schlacht')return;
  if(u&&u.side===0){select(u.i);return;}
  if(sel<0||U[sel].state==='flieht'||gone(U[sel]))return;
  if(u&&u.side===1){for(const a of selListe())angriff(a.i,u.i);return;}
  letzterTipp.boden=true;

function gruppenBefehl(x,z,laufen){   // mehrere gewählte Einheiten: nebeneinander an das Ziel
  const L=selListe();if(!L.length)return;
  if(L.length===1){befehl(L[0].i,x,z,laufen);return;}
  let cx=0,cz=0;for(const u of L){cx+=u.cx;cz+=u.cz;}cx/=L.length;cz/=L.length;

function staubEmission(dt){

    let rate=0;
    if(u.state==='flieht')rate=5;else if(u.curSpeed>2.2)rate=6;else if(u.kaempfend>0)rate=Math.min(6,u.kaempfend*.3);
    if(rate<=0){u.dAcc=0;continue;}
    u.dAcc+=rate*pf*dt;
    while(u.dAcc>=1){
      u.dAcc-=1;
      for(let tr=0;tr<4;tr++){const id=u.i*PRO+((Math.random()*PRO)|0);if(sSt[id]<=S_FLIEH){staub(sX[id],sZ[id],1,u.kaempfend>0?1.2:1.5,.28);break;}}

  }

  if(t-bannerT>66){bannerT=t;bannerSchritt();}   // ~15 Hz
  fz++;if(!ft)ft=t;
  if(t-ft>=2000){const f=fz*1000/(t-ft);$('fps').textContent=fmt(f)+' B/s';fpsLog.push(Math.round(f*10)/10);fz=0;ft=t;}
}

async function laden(){
  groesse();
  const ladeBar=f=>$('balki').style.width=Math.round(f*100)+'%';
  for(let i=0;i<KITS.length;i++){
    $('ladez').textContent=KITS[i].n+' ('+(i+1)+'/'+KITS.length+')';
    const r=await fetch('figuren/k_'+KITS[i].id+'.json');
    if(!r.ok)throw new Error('Paket fehlt: k_'+KITS[i].id+'.json');
    const tot=+r.headers.get('content-length')||0;let got=0;
    const rd=r.body.getReader(),parts=[];
    for(;;){const{done,value}=await rd.read();if(done)break;parts.push(value);got+=value.length;
      ladeBar((i+(tot?Math.min(1,got/tot):.5)*.85)/KITS.length);}
    const all=new Uint8Array(got);let o=0;for(const p of parts){all.set(p,o);o+=p.length;}
    const pk=JSON.parse(new TextDecoder().decode(all));
    $('ladez').textContent=KITS[i].n+' wird aufgestellt …';
    await new Promise(r=>setTimeout(r,16));   // nicht auf Bilder warten: bei verdecktem Fenster bliebe das Laden sonst stehen
    kitBauen(i,pk);ladeBar((i+1)/KITS.length);
  }
  einheitenAnlegen();marker();uiBauen();
  {let g=null;try{const q=new URLSearchParams(location.search).get('g');g=STUFEN[q]?q:localStorage.getItem('schlachtGrafik');}catch(e){}
   if(!STUFEN[g])g=(('ontouchstart' in window)||navigator.maxTouchPoints>0)?'mittel':'hoch';   // iPad: Mittel; PC: Hoch
   setGrafik(g);}
  phase='aufstellung';
  $('lade').style.display='none';
  uiAktualisieren();
  requestAnimationFrame(schleife);
}
laden().catch(e=>{$('ladez').textContent='Fehler: '+e.message;console.error(e);});

/* Test-Schnittstelle */
window.SCHLACHT={
  get phase(){return phase;},get pausiert(){return pausiert;},get tempoWert(){return tempoV;},get zeit(){return spielzeit;},
  get units(){return U;},get gefallen(){return gefallen.slice();},get ergebnis(){return ergebnis;},get fps(){return fpsLog;},
  get tris(){return KIT.map(k=>k.tris);},get zaehler(){return zaehler;},
  soldat(id){return{x:sX[id],z:sZ[id],st:sSt[id],act:sAct[id],hp:sHP[id],fat:sFat[id],clip:CN[sCur[id]],foe:sFoe[id],unit:sUnit[id]};},
  get geschosse(){return G;},get ereignisse(){return evZ;},get auswahl(){return[...selM];},get schlachtZeit(){return schlachtZ;},
  start,befehl,angriff,neu,waehle:select,setGrafik,get grafik(){return grafikName;},hoehe:H,wald:WF,
  kamera(a,e,d,x,z){az=a;el=e;dist=d;ziel.x=x;ziel.z=z;camSetzen();},
  tempo(n){tempoV=Math.max(.1,Math.min(30,+n||1));uiAktualisieren();},
  pause(p){pausiert=p===undefined?!pausiert:!!p;uiAktualisieren();},
  stellen(i,x,z){if(phase==='aufstellung'&&U[i])platziere(U[i],x,z);},
  bildPos(x,z){const v=new THREE.Vector3(x,H(x,z),z).project(camera);return[(v.x+1)/2*innerWidth,(1-v.y)/2*innerHeight];},
  haltung(i,s){if(U[i])U[i].stance=s;},
};
