<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Schlacht – Testschlacht</title>
<style>
:root{--bg:#1c1a16;--ink:#efe6d2;--mut:#b8ab90;--tinte:#2e261d;--bronze:#a9793a;--bronze2:#7a5524;--gold:#e0b45a;--rot:#a8322a;
  --holz:linear-gradient(#2e261d,#241d16);--perg:linear-gradient(#ecdfba,#cfba88);
  --sl:max(10px,env(safe-area-inset-left));--sr:max(10px,env(safe-area-inset-right));--st:max(10px,env(safe-area-inset-top));--sb:max(10px,env(safe-area-inset-bottom))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.35 Georgia,serif;overflow:hidden;touch-action:none;overscroll-behavior:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.titel{font-family:Marcellus,"Palatino Linotype",Palatino,Georgia,serif;letter-spacing:.02em}

/* Oberfläche: dunkles Holz für Karten, Bronze für Knöpfe, Pergament für Tafeln */
#zeile{position:fixed;left:50%;top:var(--st);transform:translateX(-50%);max-width:46vw;text-align:center;padding:7px 16px;
  background:var(--holz);border:1px solid var(--bronze2);border-radius:10px;box-shadow:inset 0 0 0 1px rgba(224,180,90,.25),0 3px 10px rgba(0,0,0,.5);
  font-size:15px;pointer-events:none}
#fps{position:fixed;right:var(--sr);top:var(--st);background:rgba(28,24,18,.8);border-radius:6px;padding:4px 9px;font:12px monospace;color:var(--mut);pointer-events:none}
#feinde{position:fixed;left:var(--sl);top:var(--st);display:flex;flex-direction:column;gap:5px;width:170px}
.chip{display:flex;align-items:center;gap:8px;padding:5px 9px;border-radius:8px;background:var(--holz);border:1px solid #5a3f1f;font-size:13px;min-height:34px}
.chip b{font-weight:normal;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip span{color:var(--gold);font-variant-numeric:tabular-nums}
.chip i{width:10px;height:10px;border-radius:50%;background:#7a3fa0;border:1px solid #000;flex:none}
.chip.weg{opacity:.45;filter:saturate(.3)}
#spalte{position:fixed;right:var(--sr);top:calc(var(--st) + 34px);display:flex;flex-direction:column;gap:8px;width:188px}
.plak{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:9px 14px;border-radius:10px;
  background:linear-gradient(#cfa05a,#8f6429);border:1px solid #5a3f17;color:#20170c;box-shadow:inset 0 1px 0 rgba(255,235,190,.5),0 3px 8px rgba(0,0,0,.45);min-height:50px}
.plak b{font-family:Marcellus,Georgia,serif;font-weight:normal;font-size:17px}
.plak small{font-size:12px;opacity:.78}
.plak:active{filter:brightness(.88)}
.plak.gross{background:linear-gradient(#e6bd6c,#a8722a);min-height:62px}
.plak.gross b{font-size:20px}
.plak.rot{background:linear-gradient(#c4503f,#7e231a);color:#fbeee0}
#ausw{display:none}
#karten{position:fixed;left:50%;transform:translateX(-50%);bottom:var(--sb);display:flex;gap:10px}
.karte{display:flex;align-items:center;gap:10px;width:178px;padding:8px 10px;border-radius:12px;background:var(--holz);border:2px solid #5a3f1f;
  box-shadow:0 3px 10px rgba(0,0,0,.5);cursor:pointer}
.karte.sel{border-color:var(--gold);box-shadow:0 0 14px rgba(224,180,90,.65),0 3px 10px rgba(0,0,0,.5)}
.karte.weg{opacity:.5;filter:saturate(.25)}
.karte .t{flex:1;min-width:0}
.karte .n{font-family:Marcellus,Georgia,serif;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.karte .s{font-size:13px;color:var(--mut)}
.karte .s b{color:var(--gold);font-weight:normal}
.karte .z{font-size:11.5px;color:#d9b36a;min-height:14px}
.karte .mud{height:4px;border-radius:2px;background:rgba(0,0,0,.45);margin-top:2px;overflow:hidden}
.karte .mud i{display:block;height:100%;width:0;background:#c9a24a}
.ring{width:48px;height:48px;border-radius:50%;flex:none;background:conic-gradient(var(--mc,#7bbf5a) calc(var(--m,100)*1%),rgba(0,0,0,.5) 0);display:grid;place-items:center}
.ring i{width:35px;height:35px;border-radius:50%;background:#241d16;display:grid;place-items:center;font:normal 12px Georgia,serif;color:var(--ink)}
#erkl,#ende{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);display:none;background:var(--perg);color:var(--tinte);
  border:3px solid var(--bronze2);border-radius:14px;box-shadow:inset 0 0 0 2px rgba(255,240,200,.6),0 10px 40px rgba(0,0,0,.65);padding:18px 24px;min-width:300px;max-width:420px}
#erkl{top:46%}
#erkl h2,#ende h2{margin:0 0 4px;font-family:Marcellus,Georgia,serif;font-weight:normal;font-size:24px;border-bottom:2px solid var(--bronze);padding-bottom:4px}
#erkl .zl{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dotted rgba(90,63,23,.4)}
#erkl .zl b{color:#7a4a10;font-weight:normal}
#erkl p{margin:8px 0 0;font-style:italic;font-size:14px}
#ende{text-align:center;padding:24px 34px;z-index:5}
#ende h2{font-size:44px;border:0;margin-bottom:2px}
#ende.sieg h2{color:#8a5a0e}#ende.nied h2{color:#8c2018}
#ende .u{margin:0 0 12px;font-style:italic}
#ende .zl{display:flex;justify-content:space-between;gap:30px;padding:4px 0;border-bottom:1px dotted rgba(90,63,23,.4)}
#ende .plak{margin:16px auto 0;align-items:center;width:200px;text-align:center}
#lade{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(#2e261d,#14110d);flex-direction:column;gap:12px;z-index:9;font-size:20px}
#lade .z{color:var(--mut);font-size:14px;min-height:18px}
.balken{width:min(320px,70vw);height:12px;border-radius:7px;background:#14110d;border:1px solid var(--bronze2);overflow:hidden}
.balken i{display:block;height:100%;width:0;background:linear-gradient(#e6bd6c,#a8722a)}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="zeile" class="titel"></div>
<div id="fps">– B/s</div>
<div id="feinde"></div>
<div id="spalte">
  <button class="plak gross" id="bBegin"><b>Schlacht beginnen</b><small>Die Heere rücken vor</small></button>
  <button class="plak" id="bHalt"><b>Halten</b><small>Haltung der gewählten Einheit</small></button>
  <button class="plak" id="bPause"><b>Pause</b><small>Schlacht anhalten</small></button>
  <button class="plak" id="bTempo"><b>Tempo 1×</b><small>Antippen: schneller</small></button>
  <button class="plak" id="bGrafik"><b>Grafik: Mittel</b><small>Antippen: wechseln</small></button>
</div>
<div id="karten"></div>
<div id="erkl"></div>
<div id="ende"></div>
<div id="lade"><div class="titel">Das Heer sammelt sich …</div><div class="balken"><i id="balki"></i></div><div class="z" id="ladez"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* ====================================================================================================
   Spielbare Testschlacht. Abschnitte: 1 Figurenmotor · 2 Gelände · 3 Einheiten/Formation · 4 Kampfregeln · 5 KI
   · 6 Steuerung · 7 Oberfläche · 8 Hauptschleife/Test-Schnittstelle.  Einheit: 1 m. Figuren blicken nach +Z.
   ==================================================================================================== */
const $=id=>document.getElementById(id);
const b64=s=>{const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u.buffer;};
const PI=Math.PI,TAU=PI*2;
const wrap=a=>{while(a>PI)a-=TAU;while(a<-PI)a+=TAU;return a;};
const fmt=n=>String(Math.round(n*10)/10).replace('.',',');

/* ---------- Daten ---------- */
const KITS=[
  {id:'A1_hastatus',key:'hast',n:'Hastati',atk:10,def:11,mor:70,hp:3,walk:1.3,run:3.8,ans:1.5,speer:false,
   info:'Gedrillte römische Linieninfanterie. Hält die Linie, bricht nicht so schnell.'},
  {id:'A2_libysch',key:'liby',n:'Libysche Speerträger',atk:9,def:12,mor:65,hp:3,walk:1.3,run:3.6,ans:1.5,speer:true,
   info:'Dichte Speerreihen. Stark in der Abwehr, träge im Angriff.'},
  {id:'A3_iberisch',key:'iber',n:'Iberische Scutarii',atk:11,def:9,mor:60,hp:2.5,walk:1.4,run:4.0,ans:1.5,speer:false,
   info:'Wendige Schwertkämpfer mit großem Schild. Kräftig im Angriff, verwundbar in der Abwehr.'},
  {id:'A6_keltisch',key:'kelt',n:'Keltische Krieger',atk:12,def:8,mor:55,hp:2.5,walk:1.4,run:4.2,ans:2,speer:false,
   info:'Furchtbarer Ansturm in den ersten Augenblicken – doch wer ihn übersteht, sieht sie bald wanken.'},
];
const ROSTER=[   // fest für den Test: Rom (Spieler) 0–2, Karthago 3–7
  {side:0,kit:0,name:'Hastati I',x:30,z:-60},{side:0,kit:0,name:'Hastati II',x:0,z:-60},{side:0,kit:0,name:'Hastati III',x:-30,z:-60},
  {side:1,kit:3,name:'Keltische Krieger I',x:48,z:60},{side:1,kit:1,name:'Libysche Speerträger I',x:24,z:60},
  {side:1,kit:2,name:'Iberische Scutarii',x:0,z:60},{side:1,kit:1,name:'Libysche Speerträger II',x:-24,z:60},
  {side:1,kit:3,name:'Keltische Krieger II',x:-48,z:60},
];
const SEITE=['Rom','Karthago'];
const PRO=40,BREIT=10,TIEF=4,ABST=1.2;     // Figuren je Einheit, Formation 10 × 4, Abstand 1,2 m
const NU=ROSTER.length,N=NU*PRO;
const FELD_X=200,FELD_Z=150;               // Feld 400 × 300 m
const NAH=60;                              // Meter: nähere Figuren in voller Stufe
const FLIEH_MORAL=25;

/* ====================================================================================================
   1  FIGURENMOTOR  (GPU-Skinning aus Animations-Textur, wie dev/proto/schlacht_figuren.html)
   ==================================================================================================== */
const renderer=new THREE.WebGLRenderer({canvas:$('cv'),antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1;
renderer.shadowMap.enabled=false;
const scene=new THREE.Scene();      // Nebel und Himmel: siehe Abschnitt 2
const camera=new THREE.PerspectiveCamera(45,1,.5,3200);
const hemi=new THREE.HemisphereLight(0xa9c4f2,0x6a5f3a,.8);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffe7c4,2.2);scene.add(sun);scene.add(sun.target);
sun.shadow.camera.near=10;sun.shadow.camera.far=700;sun.shadow.bias=-.0006;sun.shadow.normalBias=.35;

function geometrie(pk,stufe){
  const teile=Object.values(pk.koerper).map(k=>({d:k[stufe]}));
  for(const t of Object.values(pk.teile))teile.push({d:t.nah});
  let n=0,m=0;teile.forEach(t=>{n+=t.d.n;m+=new Uint16Array(b64(t.d.idx)).length;});
  const P=new Float32Array(n*3),Nr=new Float32Array(n*3),C=new Float32Array(n*3),B=new Float32Array(n*4),W=new Float32Array(n*4),I=new Uint32Array(m);
  let o=0,oi=0;
  for(const t of teile){
    const d=t.d,p=new Float32Array(b64(d.pos)),nr=new Float32Array(b64(d.nrm)),c=new Uint8Array(b64(d.col)),
      si=new Uint8Array(b64(d.si)),sw=new Uint8Array(b64(d.sw)),ix=new Uint16Array(b64(d.idx));
    P.set(p,o*3);Nr.set(nr,o*3);
    for(let i=0;i<d.n;i++){
      for(let k=0;k<3;k++)C[(o+i)*3+k]=Math.pow(c[i*3+k]/255,2.2);
      for(let k=0;k<4;k++){B[(o+i)*4+k]=si[i*4+k];W[(o+i)*4+k]=sw[i*4+k]/255;}
    }
    for(let i=0;i<ix.length;i++)I[oi+i]=ix[i]+o;
    o+=d.n;oi+=ix.length;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(P,3));g.setAttribute('normal',new THREE.BufferAttribute(Nr,3));
  g.setAttribute('color',new THREE.BufferAttribute(C,3));g.setAttribute('aBone',new THREE.BufferAttribute(B,4));
  g.setAttribute('aWeight',new THREE.BufferAttribute(W,4));g.setIndex(new THREE.BufferAttribute(I,1));
  g.userData.tris=m/3;
  return g;
}
const SKIN_GLSL=`
attribute vec4 aBone;attribute vec4 aWeight;attribute vec4 aAnim;attribute vec4 aAnimAlt;attribute vec3 aLoop;
uniform float uTime;uniform highp sampler2D uAnimTex;uniform vec2 uTexSize;
vec4 bTex(float bone,float row,float k){return texture2D(uAnimTex,vec2((bone*4.0+k+0.5)/uTexSize.x,(row+0.5)/uTexSize.y));}
mat4 bMat(float bone,float r0,float r1,float fr){
  return mat4(mix(bTex(bone,r0,0.0),bTex(bone,r1,0.0),fr),mix(bTex(bone,r0,1.0),bTex(bone,r1,1.0),fr),
              mix(bTex(bone,r0,2.0),bTex(bone,r1,2.0),fr),mix(bTex(bone,r0,3.0),bTex(bone,r1,3.0),fr));}
mat4 skinClip(vec4 an,float lp){
  float fLen=an.y;float fT=max(uTime-an.z,0.0)*an.w*30.0;float fA;float fB;
  if(lp>0.5){fT=mod(fT,fLen);fA=floor(fT);fB=mod(fA+1.0,fLen);}
  else{fT=min(fT,fLen-1.0);fA=floor(fT);fB=min(fA+1.0,fLen-1.0);}
  float fF=fT-fA;float rowA=an.x+fA;float rowB=an.x+fB;
  mat4 sk=mat4(0.0);
  for(int i=0;i<4;i++){float w=aWeight[i];if(w>0.0){sk+=w*bMat(aBone[i],rowA,rowB,fF);}}
  return sk;}`;
/* Hautmatrix inkl. Überblendung – IDENTISCH für Figur und Schattenmaterial (sonst bewegen sich die Schatten nicht mit) */
const SKIN_MAT=`mat4 skM=skinClip(aAnim,aLoop.x);
float blN=clamp((uTime-aLoop.z)/0.2,0.0,1.0);
if(blN<1.0){mat4 skO=skinClip(aAnimAlt,aLoop.y);skM=skO+(skM-skO)*blN;}`;
function animTextur(pk){
  const tex=new THREE.DataTexture(new Float32Array(b64(pk.anim.f32)),pk.anim.w,pk.anim.h,THREE.RGBAFormat,THREE.FloatType);
  tex.minFilter=tex.magFilter=THREE.NearestFilter;tex.generateMipmaps=false;tex.flipY=false;tex.needsUpdate=true;return tex;
}
function material(pk){
  const U={uTime:{value:0},uAnimTex:{value:animTextur(pk)},uTexSize:{value:new THREE.Vector2(pk.anim.w,pk.anim.h)}};
  const m=new THREE.MeshLambertMaterial({vertexColors:true,side:THREE.DoubleSide});
  m.onBeforeCompile=sh=>{
    Object.assign(sh.uniforms,U);
    sh.vertexShader=sh.vertexShader
    .replace('#include <common>','#include <common>'+SKIN_GLSL)
    .replace('#include <beginnormal_vertex>','#include <beginnormal_vertex>\n'+SKIN_MAT+'\nobjectNormal=(skM*vec4(objectNormal,0.0)).xyz;')
    .replace('#include <begin_vertex>','#include <begin_vertex>\ntransformed=(skM*vec4(transformed,1.0)).xyz;');
  };
  m.customProgramCacheKey=()=>'schlachtspiel3';
  m.userData.U=U;
  // Schattenwurf: gleiche Haut-Anpassung im Tiefenmaterial, gleiche Uniform-Objekte
  const d=new THREE.MeshDepthMaterial({depthPacking:THREE.RGBADepthPacking});
  d.onBeforeCompile=sh=>{
    Object.assign(sh.uniforms,U);
    sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>'+SKIN_GLSL)
    .replace('#include <begin_vertex>','#include <begin_vertex>\n'+SKIN_MAT+'\ntransformed=(skM*vec4(transformed,1.0)).xyz;');
  };
  d.customProgramCacheKey=()=>'schlachtspiel3d';
  m.userData.depth=d;
  return m;
}
const KIT=[];   // je Kit: {pk, mat, im:[nah,mittel], clip:{name:{row,len,loop}}, n:[0,0]}
function kitBauen(i,pk){
  const mat=material(pk),im=[];
  for(const stufe of ['nah','mittel']){
    const g=geometrie(pk,stufe);
    g.setAttribute('aAnim',new THREE.InstancedBufferAttribute(new Float32Array(N*4),4));
    g.setAttribute('aAnimAlt',new THREE.InstancedBufferAttribute(new Float32Array(N*4),4));
    g.setAttribute('aLoop',new THREE.InstancedBufferAttribute(new Float32Array(N*3),3));
    const m=new THREE.InstancedMesh(g,mat,N);m.frustumCulled=false;m.count=0;m.customDepthMaterial=mat.userData.depth;scene.add(m);im.push(m);
  }
  const clip={};pk.clips.forEach((c,k)=>{c.k=k;clip[c.n]=c;});
  GMATS.push(mat,mat.userData.depth);
  KIT[i]={pk,mat,im,clip,cl:CN.map(n=>clip[n]||clip.stehen||pk.clips[0]),tris:im[0].geometry.userData.tris};
}

/* ====================================================================================================
   2  GELÄNDE, BEWUCHS, HIMMEL  (Höhenfeld 648 × 540 m; alles ab hier ist reine Darstellung, nur H/grad/WF wirken ins Spiel)
   ==================================================================================================== */
const HX=324,HZ=270,GNX=325,GNZ=271;       // Höhenraster: 2-m-Punkte von −HX..HX / −HZ..HZ
const UWT={value:0};                        // Wind-/Wolkenzeit (Sekunden, echte Zeit)
const sst=(a,b,x)=>{x=(x-a)/(b-a);x=x<0?0:x>1?1:x;return x*x*(3-2*x);};
function hash2(i,j){let h=Math.imul(i,0x27d4eb2d)^Math.imul(j+0x3c6ef372,0x165667b1);h=Math.imul(h^(h>>>15),0x85ebca6b);h^=h>>>13;h=Math.imul(h,0xc2b2ae35);h^=h>>>16;return(h>>>0)/4294967296;}
function vn(x,z){const i=Math.floor(x),j=Math.floor(z),fx=x-i,fz=z-j,u=fx*fx*(3-2*fx),v=fz*fz*(3-2*fz);
  return hash2(i,j)*(1-u)*(1-v)+hash2(i+1,j)*u*(1-v)+hash2(i,j+1)*(1-u)*v+hash2(i+1,j+1)*u*v;}
function vnp(x,z,p){const i=Math.floor(x),j=Math.floor(z),fx=x-i,fz=z-j,u=fx*fx*(3-2*fx),v=fz*fz*(3-2*fz);
  const i0=((i%p)+p)%p,i1=(i0+1)%p,j0=((j%p)+p)%p,j1=(j0+1)%p;
  return hash2(i0,j0)*(1-u)*(1-v)+hash2(i1,j0)*u*(1-v)+hash2(i0,j1)*(1-u)*v+hash2(i1,j1)*u*v;}
const mulberry=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
const rnd=mulberry(20261030);
const lin=(r,g,b)=>new THREE.Color(r/255,g/255,b/255).convertSRGBToLinear();   // sRGB-Wert -> Arbeitsfarbe
const disp=(r,g,b)=>new THREE.Color(r/255,g/255,b/255);                          // Anzeige-Wert (Nebel, Himmel)

/* ---- Höhenfunktion: Rolling Hills, flache Senke in der Mitte, Rücken auf der Ostflanke, Kuppen hinter beiden Heeren ---- */
function gauss(x,z,cx,cz,sx,sz,a){const u=(x-cx)/sx,v=(z-cz)/sz;return a*Math.exp(-(u*u+v*v));}
function hoeheFormel(x,z){
  const r=Math.max(Math.abs(x)/HX,Math.abs(z)/HZ),mask=1-sst(.70,.97,r);
  let h=1.5*Math.sin(x*.017+1.3)*Math.cos(z*.021+.4)+1.0*Math.sin(x*.041-z*.033+2)+.35*Math.sin(x*.09+z*.07)+.25*Math.sin(z*.11-x*.05);
  h*=.35+.65*sst(40,150,Math.hypot(x*.8,z*1.1));       // Kampfebene in der Mitte ruhiger
  h+=gauss(x,z,150,-15,40,85,9.5)+gauss(x,z,190,70,30,50,5)+gauss(x,z,-115,-125,50,40,6.5)+gauss(x,z,-100,125,45,35,5.5)
    +gauss(x,z,-150,10,35,60,3)+gauss(x,z,55,95,40,25,2.2)-gauss(x,z,15,4,70,40,2.4);
  return h*mask;
}
const HG=new Float32Array(GNX*GNZ);
for(let j=0;j<GNZ;j++)for(let i=0;i<GNX;i++)HG[j*GNX+i]=hoeheFormel(-HX+i*2,-HZ+j*2);
function H(x,z){   // Gelände-Höhe (bilinear aus dem 2-m-Raster), keine Speicheranforderung
  let fx=(x+HX)*.5,fz=(z+HZ)*.5;
  fx=fx<0?0:fx>GNX-1.001?GNX-1.001:fx;fz=fz<0?0:fz>GNZ-1.001?GNZ-1.001:fz;
  const ix=fx|0,iz=fz|0,tx=fx-ix,tz=fz-iz,o=iz*GNX+ix,a=HG[o],b=HG[o+1],c=HG[o+GNX],d=HG[o+GNX+1];
  return a+(b-a)*tx+(c-a)*tz+(a-b-c+d)*tx*tz;
}
let _gx=0,_gz=0;

function startSwing(i,f){

/* Ergebnis des Schlags festlegen (kurz vor dem Treffer) und Verteidiger reagieren lassen */
function reaktion(i){

  const A=KITS[sKit[i]],D=KITS[sKit[j]],UA=U[sUnit[i]];
  const dh=H(sX[i],sZ[i])-H(sX[j],sZ[j]);                       // Höhenunterschied Angreifer − Verteidiger
  const hang=Math.max(-.12,Math.min(.15,dh*.03));                // bergab +, bergauf −  (höchstens +15 % / −12 %)
  const ansF=UA.charge>0?1+(A.ans-1)*.7*(1+(dh>0?Math.min(.35,dh*.06):0)):1;   // Ansturm bergab wuchtiger
  const atkE=A.atk*(1-.4*sFat[i])*ansF*(1+hang),defE=D.def*(1-.4*sFat[j]),ratio=atkE/defE;
  const ang=Math.abs(wrap(Math.atan2(sX[i]-sX[j],sZ[i]-sZ[j])-sR[j]));
  const fliehend=sSt[j]===S_FLIEH,steif=sAct[j]===A_TREFFER,busy=sAct[j]===A_SCHLAG;
  const pP=(ang<1.15&&!fliehend&&!steif)?Math.max(.08,Math.min(.65,.42/ratio))*(busy?.5:1):0;     // Parade nur von vorn

function trefferWirkung(i,j){

function ende(was){

/* ====================================================================================================
   5  KI  (einfach und vorsichtig)
   ==================================================================================================== */
function naechster(u,mitFl){
  let best=null,bd=1e9;
  for(const v of U){if(v.side===u.side||gone(v))continue;if(!mitFl&&v.state==='flieht')continue;
    const d=Math.hypot(v.cx-u.cx,v.cz-u.cz);if(d<bd){bd=d;best=v;}}
  return best;
}
function auftrag(u,t,laufen){
  if(u.atkT===t&&u.run===laufen)return;
  u.atkT=t;u.run=laufen;u.hasDest=true;u.destX=U[t].cx;u.destZ=U[t].cz;
}
function halt(u){u.atkT=-1;u.hasDest=false;}
function autoZiel(u){   // Haltung „Angreifen“
  const T=naechster(u,false);let tgt=null,run=true;
  if(T&&Math.hypot(T.cx-u.cx,T.cz-u.cz)<45)tgt=T;
  else{const F=naechster(u,true);if(F&&F.state==='flieht'&&Math.hypot(F.cx-u.cx,F.cz-u.cz)<80)tgt=F;}
  if(tgt)auftrag(u,tgt.i,run);
}
function ki(u){
  if(gone(u)||u.state==='flieht')return;
  if(u.side===0){if(u.stance==='angreifen'&&!u.engaged&&u.atkT<0)autoZiel(u);return;}
  if(u.engaged)return;
  const T=naechster(u,false)||naechster(u,true);if(!T)return;
  const d=Math.hypot(T.cx-u.cx,T.cz-u.cz);
  if(u.k===3){auftrag(u,T.i,true);return;}                // Kelten stürmen zuerst
  // geschlossene Linie: nicht weit vor den anderen
  let dm=1e9;for(const v of U){if(v.side!==1||v===u||v.k===3||gone(v)||v.state==='flieht')continue;
    const e=naechster(v,false);if(e)dm=Math.min(dm,Math.hypot(e.cx-v.cx,e.cz-v.cz));}
  if(d>40&&d<dm-8){halt(u);return;}
  auftrag(u,T.i,d<35&&u.k===2);                           // Iberer laufen zuletzt, Libyer marschieren
}

/* ====================================================================================================
   Bewegung: Einheitsanker (Ziel der Formation) und jeder Soldat einzeln, jedes Bild
   ==================================================================================================== */
function bewegen(dt){
  for(const u of U){
    if(gone(u))continue;
    if(u.runT>0)u.runT-=dt;
    if(u.state==='flieht'){
      if(u.sn>0){u.cx=u.mx;u.cz=u.mz;}
      u.f+=Math.max(-6*dt,Math.min(6*dt,wrap(u.fAng-u.f)));u.curSpeed=u.def.run;
      continue;
    }
    if(phase==='ende'){u.curSpeed=0;continue;}
    if(u.atkT>=0){const T=U[u.atkT];
      if(gone(T)){u.atkT=-1;u.hasDest=false;}else{u.destX=T.cx;u.destZ=T.cz;u.hasDest=true;}}
    if(u.engaged){   // Anker folgt den Kämpfenden
      if(u.sn>0){const k=Math.min(1,dt*1.5);u.cx+=(u.mx-u.cx)*k;u.cz+=(u.mz-u.cz)*k;}
      const F=u.foeU>=0?U[u.foeU]:null;
      if(F)u.f+=Math.max(-2*dt,Math.min(2*dt,wrap(Math.atan2(F.cx-u.cx,F.cz-u.cz)-u.f)));
      u.curSpeed=0;u.loose=Math.max(0,u.loose-dt*.9);u.state='kampf';continue;
    }
    let moving=false;
    if(u.hasDest){
      const dx=u.destX-u.cx,dz=u.destZ-u.cz,d=Math.hypot(dx,dz);
      if(d<.6&&u.atkT<0)u.hasDest=false;
      else{
        const h=Math.atan2(dx,dz),df=wrap(h-u.f);
        u.f+=Math.max(-2.5*dt,Math.min(2.5*dt,df));
        let sp=u.run?u.def.run:u.def.walk;if(Math.abs(df)>1)sp*=.35;
        {grad(u.cx,u.cz);const sl=(_gx*dx+_gz*dz)/d;sp*=sl>0?1-Math.min(.4,sl*2.2):1+Math.min(.12,-sl);sp*=1-.3*WF(u.cx,u.cz);}   // bergauf langsamer, Wald bremst
        if(u.sn>0){const lag=Math.hypot(u.cx-u.mx,u.cz-u.mz);sp*=Math.max(.25,Math.min(1,1-(lag-3)/6));}   // wartet auf die Soldaten
        const st=Math.min(sp*dt,d);u.cx+=dx/d*st;u.cz+=dz/d*st;u.curSpeed=st/dt;moving=true;
        if(u.run&&u.curSpeed>2)u.runT=.7;
      }
    }
    if(!moving)u.curSpeed=0;
    u.hoehe=H(u.cx,u.cz);
    {const wd=WF(u.cx,u.cz),lz=Math.max(moving?1:0,.85*wd);u.loose+=(lz-u.loose)*Math.min(1,dt*(lz>u.loose?.6:.9));}   // Wald lockert die Formation
    u.cx=Math.max(-FELD_X,Math.min(FELD_X,u.cx));u.cz=Math.max(-FELD_Z,Math.min(FELD_Z,u.cz));
    u.state=moving?(u.run?'lauf':'marsch'):'steht';
  }
}
function figuren(dt){
  hashBauen();
  for(let k=0;k<NU;k++){const u=U[k];u.ax=0;u.az=0;u.an=0;}
  for(let i=0;i<N;i++){

const _v=new THREE.Vector3(),_g={x:0,z:0},_g0={x:0,z:0};
function bodenAn(px,py,out){   // Strahl gegen das Höhenfeld (Schrittsuche + Halbierung), keine Speicheranforderung
  _v.set(px/innerWidth*2-1,-(py/innerHeight*2-1),.5).unproject(camera).sub(camera.position).normalize();
  const ox=camera.position.x,oy=camera.position.y,oz=camera.position.z,dx=_v.x,dy=_v.y,dz=_v.z;
  let tt=0,pt=0,step=1.5,hit=false;
  for(let k=0;k<1000;k++){
    const y=oy+dy*tt;
    if(dy>0&&y>40)return false;
    if(y<H(ox+dx*tt,oz+dz*tt)){hit=true;break;}
    pt=tt;tt+=step;if(step<6)step*=1.012;if(tt>2800)return false;
  }

  for(let k=0;k<9;k++){const m=(lo+hi)*.5;if(oy+dy*m<H(ox+dx*m,oz+dz*m))hi=m;else lo=m;}

      kb.appendChild(d);karten.push({u,d,ring:d.querySelector('.ring'),num:d.querySelector('i'),n:d.querySelector('.n'),s:d.querySelector('.s'),z:d.querySelector('.z'),mu:d.querySelector('.mud i')});
      d.querySelector('.n').textContent=u.name;
      langDruck(d,u,()=>select(u.i));
    }else{
      const d=document.createElement('div');d.className='chip';
      d.innerHTML='<i></i><b></b><span></span>';fb.appendChild(d);
      d.querySelector('b').textContent=u.name;
      chips.push({u,d,sp:d.querySelector('span')});
      langDruck(d,u,()=>{if(phase==='schlacht'&&sel>=0)angriff(sel,u.i);});
    }
  });
}
function langDruck(el,u,kurz){
  let tm=0,lang=false;
  el.addEventListener('pointerdown',e=>{e.stopPropagation();lang=false;clearTimeout(tm);tm=setTimeout(()=>{lang=true;erklaerung(u);},500);});
  const ab=()=>clearTimeout(tm);
  el.addEventListener('pointerleave',ab);el.addEventListener('pointercancel',ab);
  el.addEventListener('pointerup',e=>{e.stopPropagation();ab();if(!lang)kurz();});
}
function erklaerung(u){
  const K=u.def,e=$('erkl');
  e.innerHTML='<h2>'+u.name+'</h2>'
   +'<div class="zl"><span>Mannstärke</span><b>'+u.strength+' von '+PRO+'</b></div>'
   +'<div class="zl"><span>Angriff</span><b>'+fmt(K.atk)+'</b></div>'
   +'<div class="zl"><span>Abwehr</span><b>'+fmt(K.def)+'</b></div>'
   +'<div class="zl"><span>Leben je Mann</span><b>'+fmt(K.hp)+'</b></div>'
   +'<div class="zl"><span>Müdigkeit</span><b>'+fmt(u.muede*100)+' %</b></div>'
   +'<div class="zl"><span>Im Zweikampf</span><b>'+u.kaempfend+'</b></div>'
   +'<div class="zl"><span>Moral</span><b>'+fmt(u.morale)+' (Start '+fmt(K.mor)+')</b></div>'
   +'<div class="zl"><span>Gehen / Laufen</span><b>'+fmt(K.walk)+' / '+fmt(K.run)+' m/s</b></div>'
   +'<div class="zl"><span>Ansturm</span><b>'+(K.ans>1.6?'furchtbar (×2)':'wuchtig (×1,5)')+'</b></div>'
   +'<p>'+K.info+'</p><p style="font-style:normal;font-size:12px;opacity:.7">Antippen schließt die Karte.</p>';
  e.style.display='block';
}
document.addEventListener('pointerdown',e=>{if($('erkl').style.display==='block'&&!e.target.closest('.karte,.chip'))$('erkl').style.display='none';},true);
function moralFarbe(m){return m>55?'#7bbf5a':m>35?'#d9a63a':'#c4503f';}
const ZUSTAND={steht:'steht bereit',marsch:'marschiert',lauf:'stürmt',kampf:'im Nahkampf',flieht:'flieht!',geflohen:'geflohen',aufgerieben:'aufgerieben'};
function uiAktualisieren(){
  for(const k of karten){
    const u=k.u;k.d.classList.toggle('sel',sel===u.i);k.d.classList.toggle('weg',gone(u));
    k.n.textContent=u.name;k.s.innerHTML='<b>'+u.strength+'</b> Mann';k.z.textContent=ZUSTAND[u.state]||'';k.mu.style.width=Math.round(Math.min(1,u.muede*1.6)*100)+'%';
    const m=Math.max(0,Math.min(100,u.morale));k.ring.style.setProperty('--m',m);k.ring.style.setProperty('--mc',moralFarbe(u.morale));
    k.num.textContent=Math.round(m);
  }
  for(const c of chips){c.d.classList.toggle('weg',gone(c.u));c.sp.textContent=c.u.state==='flieht'?'flieht':(gone(c.u)?'–':c.u.strength);}
  const h=sel>=0?U[sel]:null;
  $('bHalt').firstChild.textContent=h&&h.stance==='angreifen'?'Angreifen':'Halten';
  $('bHalt').lastChild.textContent=h&&h.stance==='angreifen'?'Stürmt auf nahe Feinde. Antippen: Halten':'Steht fest. Antippen: Angreifen';
  $('bHalt').style.opacity=h?1:.55;
  $('bBegin').style.display=phase==='aufstellung'?'':'none';
  $('bPause').style.display=$('bTempo').style.display=phase==='schlacht'?'':'none';
  $('bPause').firstChild.textContent=pausiert?'Weiter':'Pause';
  $('bPause').lastChild.textContent=pausiert?'Schlacht geht weiter':'Schlacht anhalten';
  $('bTempo').firstChild.textContent='Tempo '+fmt(tempoV)+'×';
  $('bTempo').lastChild.textContent=tempoV>1?'Antippen: normal':'Antippen: schneller';
  let z;
  if(phase==='aufstellung')z='Ziehe deine Einheiten. Dann: Schlacht beginnen.';
  else if(phase==='ende')z=ergebnis==='sieg'?'Das Feld gehört Rom.':'Rom ist geschlagen.';
  else if(pausiert)z='Pause';
  else z=h?(h.name+' gewählt – Gelände antippen: marschieren, doppelt: laufen, Feind: angreifen'):'Wähle eine Einheit (Karte unten oder auf dem Feld).';
  $('zeile').textContent=z;
}
function uiAuswahl(){uiAktualisieren();}
function uiEnde(){
  const e=$('ende'),r=[0,0];for(const u of U)if(!gone(u)||u.state==='geflohen')r[u.side]+=u.state==='geflohen'?0:u.strength;
  const fl=[0,0];for(const u of U)fl[u.side]+=u.fled||0;
  const lebt=[0,0];for(const u of U)lebt[u.side]+=(u.state==='aufgerieben'||u.state==='geflohen')?0:u.strength;
  e.className=ergebnis==='sieg'?'sieg':'nied';
  e.innerHTML='<h2 class="titel">'+(ergebnis==='sieg'?'Sieg':'Niederlage')+'</h2>'
    +'<p class="u">'+(ergebnis==='sieg'?'Karthago weicht. Rom behauptet das Feld.':'Deine Legion ist zerschlagen.')+'</p>'
    +'<div class="zl"><span>Gefallene Rom</span><b>'+gefallen[0]+'</b></div>'
    +'<div class="zl"><span>Gefallene Karthago</span><b>'+gefallen[1]+'</b></div>'
    +'<div class="zl"><span>Geflohen Rom / Karthago</span><b>'+fl[0]+' / '+fl[1]+'</b></div>'
    +'<div class="zl"><span>Auf dem Feld Rom / Karthago</span><b>'+lebt[0]+' / '+lebt[1]+'</b></div>'
    +'<button class="plak gross" id="bNoch"><b>Noch einmal</b><small>Neue Aufstellung</small></button>';
  e.style.display='block';$('bNoch').onclick=neu;
}
$('bBegin').onclick=()=>start();
$('bHalt').onclick=()=>{if(sel<0)return;const u=U[sel];u.stance=u.stance==='angreifen'?'halten':'angreifen';if(u.stance==='angreifen'&&!u.engaged&&u.atkT<0&&phase==='schlacht')autoZiel(u);uiAktualisieren();};
$('bPause').onclick=()=>{pausiert=!pausiert;uiAktualisieren();};
$('bTempo').onclick=()=>{tempoV=tempoV>1?1:2;uiAktualisieren();};
$('bGrafik').onclick=()=>setGrafik(GRAFIK_ORDNUNG[(GRAFIK_ORDNUNG.indexOf(grafikName)+1)%3]);
for(const id of['bBegin','bHalt','bPause','bTempo','bGrafik'])$(id).addEventListener('pointerdown',e=>e.stopPropagation());

/* ====================================================================================================
   8  ABLAUF, HAUPTSCHLEIFE, TEST-SCHNITTSTELLE
   ==================================================================================================== */
function start(){
  if(phase!=='aufstellung')return false;
  phase='schlacht';pausiert=false;tickAcc=0;kiAcc=.5;
  for(const u of U)if(u.side===0&&u.stance==='angreifen')u.aiT=0;
  uiAktualisieren();return true;
}
function neu(){
  $('ende').style.display='none';$('erkl').style.display='none';
  gefallen[0]=gefallen[1]=0;ergebnis=null;pausiert=false;tempoV=1;sel=-1;
  const alt=U.map(u=>({ring:u.ring,flag:u.flag}));
  einheitenAnlegen();U.forEach((u,i)=>{u.ring=alt[i].ring;u.flag=alt[i].flag;});
  for(const k of karten)k.u=U[k.u.i];for(const c of chips)c.u=U[c.u.i];
  phase='aufstellung';tickAcc=0;uiAktualisieren();
}
/* ---- Grafikstufen ---- */
const GRAFIK_ORDNUNG=['niedrig','mittel','hoch'];
const STUFEN={   // pr Pixeldichte-Grenze · schatten Kartengröße (0 = aus) · Gras nah/fern · baum/busch Anteil · staub Wölkchen · figS 0 keine, 1 nahe, 2 alle Figuren werfen Schatten · blob 1 alle, 2 ferne, 0 keine
  niedrig:{n:'Niedrig',pr:1,schatten:0,grasN:1800,grasF:1200,baum:.4,busch:.4,staub:80,figS:0,blob:1},
  mittel:{n:'Mittel',pr:1.5,schatten:2048,grasN:5000,grasF:3200,baum:.75,busch:.7,staub:200,figS:1,blob:2},
  hoch:{n:'Hoch',pr:2,schatten:2048,grasN:9000,grasF:6000,baum:1,busch:1,staub:320,figS:2,blob:0},
};
let grafikName='mittel',STUFE=STUFEN.mittel,shExt=0;
function setGrafik(nm){
  const S=STUFEN[nm];if(!S)return false;
  grafikName=nm;STUFE=S;
  const sh=S.schatten>0;
  renderer.setPixelRatio(Math.min(S.pr,window.devicePixelRatio||1));
  renderer.shadowMap.type=nm==='hoch'?THREE.PCFSoftShadowMap:THREE.PCFShadowMap;
  renderer.shadowMap.enabled=sh;sun.castShadow=sh;
  if(sh&&sun.shadow.mapSize.x!==S.schatten){sun.shadow.mapSize.set(S.schatten,S.schatten);if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null;}}
  shExt=0;
  gelNetz.castShadow=sh;gelNetz.receiveShadow=sh;gelAussen.receiveShadow=sh;
  for(const k in VEG){const v=VEG[k],fr=v.f==='baum'?S.baum:v.f==='busch'?S.busch:Math.max(.5,S.busch);
    v.m.count=Math.round(v.n*fr);v.m.castShadow=sh&&v.f!=='busch';v.m.receiveShadow=sh;}
  GRAS[0].m.geometry.instanceCount=Math.min(GRAS[0].max,S.grasN);GRAS[1].m.geometry.instanceCount=Math.min(GRAS[1].max,S.grasF);
  for(const g of GRAS)g.m.receiveShadow=sh;
  for(const K of KIT){K.im[0].castShadow=sh&&S.figS>=1;K.im[1].castShadow=sh&&S.figS>=2;K.im[0].receiveShadow=K.im[1].receiveShadow=sh;}
  pMax=S.staub;pHead=0;
  for(const m of GMATS)m.needsUpdate=true;
  blobMesh.visible=S.blob>0;
  const b=$('bGrafik');if(b){b.firstChild.textContent='Grafik: '+S.n;b.lastChild.textContent=sh?(nm==='hoch'?'Schatten, dichtes Gras':'Schatten, Gras'):'Weiche Kontaktschatten';}
  try{localStorage.setItem('schlachtGrafik',nm);}catch(e){}
  groesse();
  return true;
}
function sonneNachfuehren(){   // Schattenkarte folgt dem Blickziel; auf Texelraster gerastet (kein Flimmern)
  if(!sun.castShadow){sun.position.set(ziel.x+SD.x*300,ziel.y+SD.y*300,ziel.z+SD.z*300);sun.target.position.copy(ziel);return;}
  const ext=Math.max(30,Math.min(130,Math.ceil(dist*.75/10)*10)),sc=sun.shadow.camera;
  if(ext!==shExt){shExt=ext;sc.left=-ext;sc.right=ext;sc.top=ext;sc.bottom=-ext;sc.updateProjectionMatrix();}
  const tex=2*ext/sun.shadow.mapSize.x,cx=ziel.x,cy=ziel.y,cz=ziel.z;
  const a=cx*LR.x+cy*LR.y+cz*LR.z,b=cx*LU.x+cy*LU.y+cz*LU.z,da=Math.round(a/tex)*tex-a,db=Math.round(b/tex)*tex-b;
  const px=cx+LR.x*da+LU.x*db,py=cy+LR.y*da+LU.y*db,pz=cz+LR.z*da+LU.z*db;
  sun.target.position.set(px,py,pz);sun.position.set(px+SD.x*300,py+SD.y*300,pz+SD.z*300);
}
const LR=new THREE.Vector3().crossVectors(new THREE.Vector3(0,1,0),SD).normalize(),LU=new THREE.Vector3().crossVectors(SD,LR).normalize();
function groesse(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
  DU.uPx.value=renderer.domElement.height/(2*Math.tan(camera.fov*PI/360));camSetzen();}
addEventListener('resize',groesse);

/* Staub: laufende, fliehende und kämpfende Einheiten wirbeln Wölkchen auf */
function staubEmission(dt){
  const pf=pMax/200;
  for(const u of U){
    if(gone(u))continue;
    let rate=0;
    if(u.state==='flieht')rate=5;else if(u.curSpeed>2.2)rate=6;else if(u.kaempfend>0)rate=Math.min(6,u.kaempfend*.3);
    if(rate<=0){u.dAcc=0;continue;}
    u.dAcc+=rate*pf*dt;
    while(u.dAcc>=1){
      u.dAcc-=1;
      for(let tr=0;tr<4;tr++){const id=u.i*PRO+((Math.random()*PRO)|0);if(sSt[id]<=S_FLIEH){staub(sX[id],sZ[id],1,u.kaempfend>0?1.2:1.5,.28);break;}}
    }
  }
}
let letzt=0,fz=0,ft=0,uiT=0;const fpsLog=[];
function schleife(t){
  requestAnimationFrame(schleife);
  const dt=Math.min(.25,(t-letzt)/1000);letzt=t;
  if(phase==='aufstellung'){schritt(Math.min(dt,.05));}
  else if((phase==='schlacht'||phase==='ende')&&!pausiert){
    const g=dt*tempoV,n=Math.max(1,Math.ceil(g/.05)),h=g/n;
    for(let k=0;k<n;k++)schritt(h);
  }
  for(const K of KIT)K.mat.userData.U.uTime.value=spielzeit;
  UWT.value=t/1000;
  camSetzen();   // Kamera folgt dem Gelände (auch wenn Ziel sich nicht bewegt hat: billig)
  himmel.position.copy(camera.position);
  GRAS[0].uni.uCen.value.set(ziel.x,ziel.z);GRAS[1].uni.uCen.value.set(ziel.x,ziel.z);
  sonneNachfuehren();
  baueInstanzen();markerUpdate(t);
  if(!pausiert&&phase!=='aufstellung')staubEmission(Math.min(.1,dt));
  if(!pausiert)staubSchritt(Math.min(.1,dt));
  renderer.render(scene,camera);
  if(t-uiT>250){uiT=t;uiAktualisieren();}
  fz++;if(!ft)ft=t;
  if(t-ft>=2000){const f=fz*1000/(t-ft);$('fps').textContent=fmt(f)+' B/s';fpsLog.push(Math.round(f*10)/10);fz=0;ft=t;}
}

async function laden(){
  groesse();
  const ladeBar=f=>$('balki').style.width=Math.round(f*100)+'%';
  for(let i=0;i<KITS.length;i++){
    $('ladez').textContent=KITS[i].n+' ('+(i+1)+'/'+KITS.length+')';
    const r=await fetch('figuren/k_'+KITS[i].id+'.json');
    if(!r.ok)throw new Error('Paket fehlt: k_'+KITS[i].id+'.json');
    const tot=+r.headers.get('content-length')||0;let got=0;
    const rd=r.body.getReader(),parts=[];
    for(;;){const{done,value}=await rd.read();if(done)break;parts.push(value);got+=value.length;
      ladeBar((i+(tot?Math.min(1,got/tot):.5)*.85)/KITS.length);}
    const all=new Uint8Array(got);let o=0;for(const p of parts){all.set(p,o);o+=p.length;}
    const pk=JSON.parse(new TextDecoder().decode(all));
    $('ladez').textContent=KITS[i].n+' wird aufgestellt …';
    await new Promise(r=>setTimeout(r,16));   // nicht auf Bilder warten: bei verdecktem Fenster bliebe das Laden sonst stehen
    kitBauen(i,pk);ladeBar((i+1)/KITS.length);
  }
  einheitenAnlegen();marker();uiBauen();
  {let g=null;try{const q=new URLSearchParams(location.search).get('g');g=STUFEN[q]?q:localStorage.getItem('schlachtGrafik');}catch(e){}
   if(!STUFEN[g])g=(('ontouchstart' in window)||navigator.maxTouchPoints>0)?'mittel':'hoch';   // iPad: Mittel; PC: Hoch
   setGrafik(g);}
  phase='aufstellung';
  $('lade').style.display='none';
  uiAktualisieren();
  requestAnimationFrame(schleife);
}
laden().catch(e=>{$('ladez').textContent='Fehler: '+e.message;console.error(e);});

/* Test-Schnittstelle */
window.SCHLACHT={
  get phase(){return phase;},get pausiert(){return pausiert;},get tempoWert(){return tempoV;},get zeit(){return spielzeit;},
  get units(){return U;},get gefallen(){return gefallen.slice();},get ergebnis(){return ergebnis;},get fps(){return fpsLog;},
  get tris(){return KIT.map(k=>k.tris);},get zaehler(){return zaehler;},
  soldat(id){return{x:sX[id],z:sZ[id],st:sSt[id],act:sAct[id],hp:sHP[id],fat:sFat[id],clip:CN[sCur[id]],foe:sFoe[id],unit:sUnit[id]};},
  start,befehl,angriff,neu,waehle:select,setGrafik,get grafik(){return grafikName;},hoehe:H,wald:WF,
  kamera(a,e,d,x,z){az=a;el=e;dist=d;ziel.x=x;ziel.z=z;camSetzen();},
  tempo(n){tempoV=Math.max(.1,Math.min(30,+n||1));uiAktualisieren();},
  pause(p){pausiert=p===undefined?!pausiert:!!p;uiAktualisieren();},
  stellen(i,x,z){if(phase==='aufstellung'&&U[i])platziere(U[i],x,z);},
  bildPos(x,z){const v=new THREE.Vector3(x,H(x,z),z).project(camera);return[(v.x+1)/2*innerWidth,(1-v.y)/2*innerHeight];},
  haltung(i,s){if(U[i])U[i].stance=s;},
};
