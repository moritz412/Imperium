<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Schlacht – Testschlacht</title>
<style>
html,body{margin:0;height:100%;background:#1c1a16;color:#efe6d2;font:15px/1.35 Georgia,serif;overflow:hidden;touch-action:none;overscroll-behavior:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
#esch{position:fixed;inset:0;pointer-events:none;--sheetimg:url(../../img/u_sheet.webp)}
/* Ab hier: gemeinsamer Teil mit imperium.html (Abschnitt ESCH-CSS). Nur hier ändern und mit dem Abgleich (dev/docs/schlacht_integration.md) übertragen */
/*ESCH-CSS-BEGIN*/

#esch{--bg:#1c1a16;--ink:#efe6d2;--mut:#b8ab90;--tinte:#2e261d;--bronze:#a9793a;--bronze2:#7a5524;--gold:#e0b45a;--rot:#a8322a;
  --holz:linear-gradient(#2e261d,#241d16);--perg:linear-gradient(#ecdfba,#cfba88);
  --sl:max(10px,env(safe-area-inset-left));--sr:max(10px,env(safe-area-inset-right));--st:max(10px,env(safe-area-inset-top));--sb:max(10px,env(safe-area-inset-bottom))}
#esch *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
/*Seitenrahmen: html,body (nur Testseite)*/
/*Seitenrahmen: canvas (nur Testseite)*/
#esch button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
#esch .titel{font-family:Marcellus,"Palatino Linotype",Palatino,Georgia,serif;letter-spacing:.02em}

/* Oberfläche: dunkles Holz für Karten, Bronze für Knöpfe, Pergament für Tafeln (Vorgabe 30.10.: eigene Gestaltung) */
#esch svg.ic{width:26px;height:26px;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#esch svg.sy{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
#esch #fps{position:fixed;right:var(--sr);top:var(--st);background:rgba(28,24,18,.8);border-radius:6px;padding:4px 9px;font:12px monospace;color:var(--mut);pointer-events:none;z-index:3}

/* oben Mitte: Kräftevergleich, Feindreihe, Hinweiszeile (Feinde oben, eigene Einheiten unten) */
#esch #oben{position:fixed;left:50%;top:var(--st);transform:translateX(-50%);width:min(640px,calc(100vw - 400px));display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:2}
#esch #kraft{width:100%;padding:6px 10px 5px;background:var(--holz);border:1.5px solid var(--bronze);border-radius:12px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.55),inset 0 0 0 2px rgba(224,180,90,.22),0 4px 12px rgba(0,0,0,.55)}
#esch #kraft .kk{display:flex;align-items:center;gap:7px}
#esch #kraft .wap{width:30px;height:35px;flex:none;position:relative;filter:drop-shadow(0 2px 2px rgba(0,0,0,.6));--c:var(--sc0,#b02a22)}
#esch #kraft .wap.k{--c:var(--sc1,#7a3fa0)}
#esch #kraft .wap svg{width:100%;height:100%;display:block}
#esch #kraft .wap path{fill:var(--c);stroke:#e0b45a;stroke-width:2.5}
#esch #kraft .wap g{fill:none;stroke:#f6e4b4;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
#esch #kraft .kn{font:600 19px Marcellus,Georgia,serif;font-variant-numeric:tabular-nums;min-width:36px}
#esch #kraft .kn.r{color:#e78a7e;text-align:right}#esch #kraft .kn.k{color:#c79be6}
#esch #kraft .kb{flex:1;height:14px;border-radius:7px;background:#7a3fa0;overflow:hidden;position:relative;border:1px solid #14110d;box-shadow:inset 0 1px 3px rgba(0,0,0,.6),0 0 0 1px rgba(169,121,58,.45)}
#esch #kraft .kb i{position:absolute;left:0;top:0;bottom:0;width:50%;background:linear-gradient(#d4503f,#8e241a);transition:width .6s}
#esch #kraft .kb b{position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:var(--gold);opacity:.8}
#esch #kraft .kz{display:flex;justify-content:space-between;align-items:center;font:13px Marcellus,Georgia,serif;color:var(--mut);margin-top:1px;padding:0 4px}
#esch #kraft .kz em{font-style:normal;color:var(--gold);font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:4px}
#esch #kraft svg.ic{width:13px;height:13px}
#esch #hinweis{max-width:100%;text-align:center;padding:5px 16px;font-size:13.5px;border-radius:9px;background:var(--holz);border:1.5px solid var(--bronze);box-shadow:inset 0 0 0 1px rgba(0,0,0,.5),0 3px 8px rgba(0,0,0,.45);opacity:0;transition:opacity 1.2s;min-height:28px}
#esch #hinweis.an{opacity:1;transition:opacity .25s}

/* Bilder der Einheiten: echtes Bild (karten/<id>.jpg) über gemaltem Platzhalter */
#esch .bild{position:relative;overflow:hidden;--c1:#c9473a;--c2:#3f100c;
  background:radial-gradient(circle at 28% 18%,rgba(255,226,160,.38),transparent 52%),repeating-linear-gradient(112deg,rgba(0,0,0,.07) 0 3px,transparent 3px 8px),linear-gradient(165deg,var(--c1),var(--c2))}
#esch .bild.s1{--c1:#a56bd0;--c2:#240f33}
#esch .bild::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 22px 4px rgba(0,0,0,.55);pointer-events:none}
#esch .bild .ph{position:absolute;inset:14% 14% 18%;color:#f1d79a;opacity:.92;filter:drop-shadow(0 2px 2px rgba(0,0,0,.65))}
#esch .bild img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%;opacity:0;transition:opacity .3s}
#esch .bild img.ok{opacity:1}
#esch .bild{container-type:size}
#esch .bild .sh{position:absolute;left:50%;top:50%;width:max(100cqw,100cqh);aspect-ratio:1;transform:translate(-50%,-50%);background:var(--sheetimg) no-repeat;background-size:800% 1400%}
#esch .bild img.pb{opacity:1;object-position:50% 50%}
#esch .bild.leer img.pb{display:none}

/* Feindreihe oben: schmale Karten, Bild füllt die Karte, Text auf dunklem Band */
#esch #feinde{display:flex;gap:5px;width:100%;pointer-events:auto}
#esch .fk{position:relative;flex:1 1 0;min-width:0;height:72px;border-radius:9px;background:#241d16;border:1.5px solid var(--bronze);cursor:pointer;overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.6),0 3px 8px rgba(0,0,0,.55);transition:transform .12s,border-color .15s}
#esch .fk:active{transform:scale(.96)}
#esch .fk .bild{position:absolute;inset:0;border-radius:0}
#esch .fk .t{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:12px 5px 3px;background:linear-gradient(transparent,rgba(16,12,9,.92) 52%)}
#esch .fk .n{font:11.5px/1.1 Marcellus,Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #000}
#esch .fk .b{height:5px;border-radius:3px;background:rgba(0,0,0,.6);overflow:hidden;margin:3px 0 1px;border:1px solid rgba(0,0,0,.6)}
#esch .fk .b i{display:block;height:100%;width:100%;background:linear-gradient(#b47be0,#6f3a95)}
#esch .fk .z{font-size:10.5px;line-height:1.1;color:var(--mut);display:flex;justify-content:space-between;gap:3px;white-space:nowrap;min-height:11px}
#esch .fk .z span{overflow:hidden;text-overflow:ellipsis;min-width:0}
#esch .fk .z b{font-weight:normal;color:var(--gold)}
#esch .fk.weg{opacity:.45;filter:saturate(.2)}
#esch .fk.fl .bild{filter:grayscale(.7)}
#esch .fk.kampf{border-color:var(--gold)}

/* Befehle rechts: immer EINE Spalte */
#esch #spalte{position:fixed;right:var(--sr);top:calc(var(--st) + 30px);display:flex;flex-direction:column;gap:5px;width:152px;z-index:2}
#esch .plak{display:flex;align-items:center;gap:8px;text-align:left;padding:4px 10px 4px 8px;border-radius:11px;
  background:linear-gradient(#d4a65c,#8f6429);border:1.5px solid #4e3513;color:#20170c;box-shadow:inset 0 1px 0 rgba(255,235,190,.55),inset 0 -2px 0 rgba(60,35,8,.28),0 3px 8px rgba(0,0,0,.5);min-height:46px;
  transition:transform .1s,filter .12s}
#esch .plak svg.ic{width:30px;height:30px;stroke-width:2}
#esch .plak span{display:flex;flex-direction:column;line-height:1.12;min-width:0}
#esch .plak b{font-family:Marcellus,Georgia,serif;font-weight:normal;font-size:16px}
#esch .plak small{font-size:11px;opacity:.78;min-height:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (hover:hover){#esch .plak:hover{filter:brightness(1.1)}}
#esch .plak:active{filter:brightness(.86);transform:scale(.965)}
#esch .plak.gross{background:linear-gradient(#ecc374,#a8722a);min-height:58px}
#esch .plak.gross b{font-size:18px}
#esch .plak.rot{background:linear-gradient(#c4503f,#7e231a);color:#fbeee0}
#esch .plak.an{background:linear-gradient(#f0cf86,#b9812f);box-shadow:inset 0 0 0 2px var(--gold),0 3px 8px rgba(0,0,0,.45)}
#esch .plak[hidden]{display:none}

/* Einheitenleiste unten: Bild füllt die Karte, Name und Stärke auf dunklem Band */
#esch #karten{position:fixed;left:calc(var(--sl) + 276px);right:calc(var(--sr) + 162px);bottom:var(--sb);display:flex;gap:10px;justify-content:center;align-items:flex-end;z-index:2}
#esch .karte{position:relative;width:122px;height:158px;border-radius:13px;background:#241d16;border:2px solid var(--bronze);overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.65),0 4px 12px rgba(0,0,0,.6);cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s}
#esch .karte .bild{position:absolute;inset:0;border-radius:0}
#esch .karte.sel{border-color:var(--gold);transform:translateY(-10px);box-shadow:inset 0 0 0 1px rgba(0,0,0,.65),0 0 16px rgba(224,180,90,.75),0 5px 12px rgba(0,0,0,.55)}
#esch .karte:active{filter:brightness(1.08)}
#esch .karte.weg{opacity:.5;filter:saturate(.25)}
#esch .karte .ring{position:absolute;right:6px;top:6px;z-index:2}
#esch .karte .info{position:absolute;left:0;top:0;width:44px;height:44px;z-index:3;border:0;background:none;padding:6px;display:flex;align-items:flex-start;justify-content:flex-start}
#esch .karte .info span{width:22px;height:22px;border-radius:50%;background:rgba(20,15,10,.75);border:1px solid var(--bronze);color:var(--gold);font:italic 14px Georgia,serif;line-height:20px;text-align:center}
#esch .karte .zst{position:absolute;left:6px;right:6px;bottom:56px;z-index:2;display:flex;align-items:center;gap:4px;padding:2px 7px;border-radius:9px;background:rgba(20,16,12,.72);border:1px solid rgba(169,121,58,.4);font-size:11px;color:#f1d79a;white-space:nowrap;overflow:hidden}
#esch .karte .zst svg{width:13px;height:13px;flex:none;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#esch .karte .band{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:16px 7px 6px;background:linear-gradient(transparent,rgba(16,12,9,.93) 40%)}
#esch .karte .n{font:14.5px Marcellus,Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0 1px 3px;text-shadow:0 1px 2px #000}
#esch .karte .stz{display:flex;align-items:center;gap:6px;margin:0 1px}
#esch .karte .stz .zbar{flex:1;height:8px;border-radius:4px;background:rgba(0,0,0,.6);overflow:hidden;border:1px solid rgba(0,0,0,.6)}
#esch .karte .stz .zbar i{display:block;height:100%;width:100%;background:linear-gradient(#e46a58,#a22d22)}
#esch .karte .stz b{font:600 14px Marcellus,Georgia,serif;color:var(--gold);min-width:22px;text-align:right;font-variant-numeric:tabular-nums}
#esch .karte .mud{height:3px;border-radius:2px;background:rgba(0,0,0,.5);margin:4px 1px 0;overflow:hidden}
#esch .karte .mud i{display:block;height:100%;width:0;background:#c9a24a}
#esch .ring{width:38px;height:38px;border-radius:50%;flex:none;background:conic-gradient(var(--mc,#7bbf5a) calc(var(--m,100)*1%),rgba(0,0,0,.6) 0);display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.7)}
#esch .ring i{width:28px;height:28px;border-radius:50%;background:#241d16;display:grid;place-items:center;font:normal 11px Georgia,serif;color:var(--ink)}
#esch .karte .mk{position:absolute;left:7px;top:7px;z-index:2;width:20px;height:20px;border-radius:50%;background:var(--gold);color:#20170c;font:700 11px/20px Georgia,serif;text-align:center;display:none}
#esch .karte.sel.multi .mk{display:block}

/* Tonkarte (langer Druck auf „Ton“) */
#esch #tonkarte{position:fixed;display:none;width:262px;padding:10px 14px 12px;background:var(--holz);border:2px solid var(--bronze);border-radius:13px;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.6),inset 0 0 0 2px rgba(224,180,90,.2),0 6px 20px rgba(0,0,0,.65);z-index:6}
#esch #tonkarte.an{display:block}
#esch #tonkarte h3{margin:0 0 4px;font:19px Marcellus,Georgia,serif;font-weight:normal;color:var(--gold);padding-bottom:4px;border-bottom:1px solid rgba(169,121,58,.6)}
#esch #tonkarte .rg{display:block;margin:6px 0 0}
#esch #tonkarte .rg span{display:flex;justify-content:space-between;font-size:14px}
#esch #tonkarte .rg b{font-weight:normal;color:var(--gold);font-variant-numeric:tabular-nums}
#esch #tonkarte input[type=range]{width:100%;height:44px;margin:0;accent-color:#d4a65c;touch-action:pan-x;-webkit-user-select:auto;user-select:auto}
#esch #tonkarte .info{font-size:12px;color:var(--mut);line-height:1.35;margin:2px 0 0}
#esch #tonkarte .x{position:absolute;right:0;top:0;width:44px;height:44px;border:0;background:none;color:var(--mut);font-size:20px;line-height:1}

/* Einheitenfenster links unten */
#esch #fenster{position:fixed;left:var(--sl);bottom:var(--sb);width:262px;padding:8px 10px 9px;display:none;gap:10px;flex-wrap:wrap;
  background:var(--holz);border:2px solid var(--bronze2);border-radius:12px;box-shadow:inset 0 0 0 1px rgba(224,180,90,.25),0 4px 14px rgba(0,0,0,.6);z-index:2}
#esch #fenster.an{display:flex}
#esch #fenster .bild{width:90px;height:120px;border-radius:7px;border:1px solid rgba(0,0,0,.7);flex:none}
#esch #fenster .w{flex:1;min-width:0}
#esch #fenster h3{margin:0 0 3px;font:17px Marcellus,Georgia,serif;font-weight:normal;color:var(--gold);line-height:1.15}
#esch #fenster .zl{display:flex;justify-content:space-between;gap:8px;white-space:nowrap;font-size:13px;padding:1.5px 0;border-bottom:1px dotted rgba(184,171,144,.25)}
#esch #fenster .zl b{font-weight:normal;color:var(--ink);font-variant-numeric:tabular-nums}
#esch #fenster p{flex-basis:100%;margin:0;font-size:12.5px;font-style:italic;color:var(--mut);line-height:1.3}
#esch #fenster .x{position:absolute;right:0;top:0;width:44px;height:44px;border:0;background:none;color:var(--mut);font-size:20px;line-height:1}
#esch #fenster{width:300px;max-height:calc(100vh - 230px);overflow-y:auto;touch-action:pan-y}
#esch #fenster .sub{font-size:11.5px;color:var(--mut);line-height:1.2;margin:0 0 3px}
#esch #fenster .fa{flex-basis:100%;margin:0;font-size:12px;color:var(--gold);line-height:1.3;font-style:normal}
#esch #fenster .vl{flex-basis:100%;margin:0;font-size:11.5px;color:#d9a63a;line-height:1.3;font-style:normal}
/* Gefecht wählen (Karte links der Befehlsspalte) */
#esch #gefechte{position:fixed;display:none;width:300px;padding:10px 12px 12px;background:var(--holz);border:2px solid var(--bronze);border-radius:13px;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.6),inset 0 0 0 2px rgba(224,180,90,.2),0 6px 20px rgba(0,0,0,.65);z-index:6}
#esch #gefechte.an{display:block}
#esch #gefechte h3{margin:0 0 6px;font:19px Marcellus,Georgia,serif;font-weight:normal;color:var(--gold);padding-bottom:4px;border-bottom:1px solid rgba(169,121,58,.6)}
#esch #gefechte .gf{display:block;width:100%;min-height:58px;margin:0 0 6px;padding:6px 10px;text-align:left;border-radius:10px;background:linear-gradient(#3a2f23,#2a2119);border:1.5px solid var(--bronze2)}
#esch #gefechte .gf.on{border-color:var(--gold);background:linear-gradient(#5a4526,#3a2c17)}
#esch #gefechte .gf b{display:block;font:16px Marcellus,Georgia,serif;font-weight:normal}
#esch #gefechte .gf small{display:block;font-size:11.5px;color:var(--mut);line-height:1.25}

/* schwebende Banner über den Einheiten (DOM, per Transform; höchstens 15 Hz) */
#esch #banner{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
#esch .bnr{position:absolute;left:0;top:0;width:44px;margin-left:0;transform-origin:50% 100%;will-change:transform,opacity;display:none;--c:var(--sc0,#b02a22)}
#esch .bnr.s1{--c:var(--sc1,#7a3fa0)}
#esch .bnr svg.bs{display:block;width:44px;height:52px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.6))}
#esch .bnr svg.bs path{fill:var(--c);stroke:#e0b45a;stroke-width:2.5}
#esch .bnr.sel svg.bs path{stroke:#fff3c4;stroke-width:4}
#esch .bnr.fl{filter:grayscale(.8);opacity:.7}
#esch .bnr .sym{fill:none;stroke:#f6e4b4;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
#esch .bnr .bb{height:6px;margin:1px 5px 0;border-radius:3px;background:rgba(0,0,0,.7);overflow:hidden;border:1px solid rgba(0,0,0,.8)}
#esch .bnr .bb i{display:block;height:100%;width:100%;background:#e0b45a}

/* Tafeln */
#esch #ende{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);display:none;background:var(--perg);color:var(--tinte);
  border:3px solid var(--bronze2);border-radius:14px;box-shadow:inset 0 0 0 2px rgba(255,240,200,.6),0 10px 40px rgba(0,0,0,.65);padding:18px 26px 20px;width:min(520px,94vw);max-height:94vh;overflow:auto;text-align:center;z-index:5}
#esch #ende h2{margin:0 0 2px;font-family:Marcellus,Georgia,serif;font-weight:normal;font-size:44px}
#esch #ende.sieg h2{color:#8a5a0e}#esch #ende.nied h2{color:#8c2018}
#esch #ende .u{margin:0 0 10px;font-style:italic}
#esch #ende .eh{display:flex;align-items:center;gap:12px;padding:6px 0;border-top:1px dotted rgba(90,63,23,.45);text-align:left}
#esch #ende .eh .bild{width:42px;height:56px;border-radius:5px;flex:none;border:1px solid rgba(60,40,10,.7)}
#esch #ende .eh .t{flex:1;min-width:0}
#esch #ende .eh .n{font:16px Marcellus,Georgia,serif}
#esch #ende .eh .v{height:7px;border-radius:4px;background:rgba(60,40,10,.25);overflow:hidden;display:flex;margin:4px 0 2px}
#esch #ende .eh .v i{display:block;height:100%}
#esch #ende .eh small{font-size:12.5px;color:#5a4220}
#esch #ende .liste{max-height:calc(94vh - 250px);overflow-y:auto;touch-action:pan-y;padding-right:2px}
#esch #ende .zl{display:flex;justify-content:space-between;gap:30px;padding:4px 0;border-bottom:1px dotted rgba(90,63,23,.4)}
#esch #ende .plak{margin:16px auto 0;justify-content:center;width:220px;text-align:center}
#esch #ende .plak span{align-items:center}
#esch #lade{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(#2e261d,#14110d);flex-direction:column;gap:12px;z-index:9;font-size:20px}
#esch #lade .z{color:var(--mut);font-size:14px;min-height:18px}
#esch .balken{width:min(320px,70vw);height:12px;border-radius:7px;background:#14110d;border:1px solid var(--bronze2);overflow:hidden}
#esch .balken i{display:block;height:100%;width:0;background:linear-gradient(#e6bd6c,#a8722a)}

/* Hochformat: Fenster über die Leiste */
@media (max-aspect-ratio:1/1){
  #esch #karten{left:var(--sl);right:calc(var(--sr) + 162px)}
  #esch #fenster{bottom:calc(var(--sb) + 180px)}
}
@media (max-height:640px){#esch .karte{height:128px}#esch .karte .zst{bottom:50px}#esch .fk{height:62px}}

/* Einbettung (Hauptspiel und Testseite gleich): Schrift, Eingabefläche, Klickbares, Rücksetzen globaler Regeln der Seite */
#esch{color:var(--ink);font:15px/1.35 Georgia,serif;-webkit-user-select:none;user-select:none}
#esch #eingabe{position:fixed;inset:0;touch-action:none}
#esch #eingabe,#esch #spalte,#esch #karten,#esch #fenster,#esch #gefechte,#esch #ende,#esch #tonkarte,#esch #lade{pointer-events:auto}
#esch h2,#esch h3{display:block;text-transform:none;letter-spacing:normal}
#esch h3::before,#esch h3::after{content:none;display:none}
#esch button{margin:0;min-height:0}
#esch p{margin:0}
/*ESCH-CSS-END*/
</style>
</head>
<body>
<!--ESCH-DEFS-BEGIN-->

<script>
//ESCH-KERN-BEGIN
/* Schlachtkern: eine Fassung für die Testseite (dev/proto/schlacht_spiel.html) und das Hauptspiel (imperium.html, Abschnitt ESCH-KERN).
   Aufruf schlachtKern(OPT): OPT.root Wurzelelement (#esch) · OPT.renderer/OPT.canvas gemeinsamer Renderer (sonst eigener) · OPT.extern Hauptschleife von außen (api.schleife)
   · OPT.assets/img Pfade · OPT.onEnde(ergebnis) Hauptspiel-Modus · OPT.bdiff Schwierigkeit 0..3 (fehlt: alte Testwerte) · OPT.limit/zeitSieg Zeitgrenze · OPT.farben Wappenfarben · OPT.ton Lautstärke aus dem Spiel */
function schlachtKern(OPT){
'use strict';
OPT=OPT||{};
/* ====================================================================================================
   Spielbare Testschlacht. Abschnitte: 1 Figurenmotor · 2 Gelände · 3 Einheiten/Formation · 4 Kampfregeln · 5 KI
   · 6 Steuerung · 7 Oberfläche · 8 Hauptschleife/Test-Schnittstelle.  Einheit: 1 m. Figuren blicken nach +Z.
   ==================================================================================================== */
const WURZ=OPT.root||document.getElementById('esch');
const $=id=>WURZ.querySelector('#'+id);
const AS=OPT.assets||'';
const ZL=[];   // alle Zuhörer außerhalb von #esch, damit sie beim Abbau wieder verschwinden
function lis(el,t,f,o){el.addEventListener(t,f,o);ZL.push(()=>el.removeEventListener(t,f,o));}
const TEXS=[];   // alle Texturen der Schlacht (werden beim Abbau freigegeben)
const THREE=(()=>{const T=window.THREE,o=Object.assign({},T);for(const n of['DataTexture','CanvasTexture','Texture']){const C=T[n];o[n]=function(...a){const x=new C(...a);TEXS.push(x);return x;};o[n].prototype=C.prototype;}return o;})();
const b64=s=>{const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u.buffer;};
const PI=Math.PI,TAU=PI*2;
const wrap=a=>{while(a>PI)a-=TAU;while(a<-PI)a+=TAU;return a;};
const fmt=n=>String(Math.round(n*10)/10).replace('.',',');

/* ---------- Daten ---------- */
/* ====================================================================================================
   E1  SCHLACHT-EINHEIT AUS DER KAMPAGNEN-EINHEIT                        (30.10.2026)
   Eigenständiger Abschnitt: schlachtEinheit() und ihre Tabellen hängen nur an den Kampagnendaten (KAMP =
   dev/proto/einheiten_kampagne.json) und lassen sich später unverändert ins Spiel verschieben.

   Eingabe  {volk, kultur, rolle, variante, epoche, mann, waffen, ruestung, tier, rang, ausruestungEpoche}
            wie eine Einheit auf der Kampagnenkarte (volk = Schlüssel in UNIT_MOD, z. B. 'rom').
   Kampagnenstärke  str  = ROLES[rolle].str  (Epoche 0, keine Variante: UNIT_MOD[volk][rolle].str)
                          × VARIANTS[v].m.str × EPOCH_STR[ue] (Fernkampf zusätzlich × FERN_EPOCHE[ue]);  tier: × 1,2
                          (ue = Epoche der Ausrüstung, höchstens die Epoche der Einheit)
   Verhältnis       q    = str / (ROLES[rolle].str × EPOCH_STR[ue])
   Angriff = Grund-Angriff(Rolle) × √q × b.atk × (1+Rang.b) × (1+0,08·Waffenstufe)
   Abwehr  = Grund-Abwehr(Rolle)  × √q × b.def × (1+Rang.b) × (1+0,08·Rüstungsstufe)
   Moral   = Grund-Moral(Rolle) + 2·b.mor + Rang.m
   Tempo   = Grundtempo × b.spd · Ansturm = Grund-Ansturm × b.chg · Leben = Grundwert(Rolle)
   Fernkampf (nur Rolle missile): Waffenart (Wurfspeer/Schleuder) nach Figurenpaket; Reichweite × b.range,
            Schaden × b.ratk, Vorrat je Mann × b.ammo · Plänkeln = b.skirm · Pike = b.pike
   Figuren = round(mann/3), 4 bis 60 · Paket = Profil.paket (Rückfall: paketGenau=false -> „Figuren vorläufig“)
   ==================================================================================================== */
let KAMP=null;   // Inhalt von einheiten_kampagne.json
const ECHT_ROLLE={   // Echtzeit-Grundwerte je Kampagnenrolle (Gehen/Laufen in m/s)
  spear:{atk:9,def:12,hp:3,mor:65,walk:1.3,run:3.6,ans:1,sym:'speer'},
  sword:{atk:11,def:10,hp:3,mor:62,walk:1.35,run:3.8,ans:1.1,sym:'schwert'},
  missile:{atk:6,def:6,hp:2.5,mor:55,walk:1.4,run:4.0,ans:.8,sym:'wurfspeer'},
  cav:{atk:12,def:9,hp:4.5,mor:70,walk:2,run:8,ans:1.8,sym:'reiter'},
  art:{atk:4,def:4,hp:2,mor:50,walk:1,run:2,ans:0,sym:'schwert'},
};
/* Waffenarten des Fernkampfs (reich m · nachl [min,max] s · vorrat je Mann · schaden · moral = Zusatzabzug je Treffer · wurfT Zeitpunkt des Abwurfs im Clip
   · v Fluggeschwindigkeit m/s · weich = Plänkler weicht, wenn Nahkämpfer näher als m · rueck = so weit weicht er zurück) */
const ECHT_FERN={
  speer:{typ:'speer',reich:30,nachl:[4,6],vorrat:5,schaden:1.6,moral:.5,clip:'speerwurf',wurfT:.55,v:24,weich:14,rueck:22},
  pfeil:{typ:'pfeil',reich:110,nachl:[3,4.5],vorrat:20,schaden:1.0,moral:.3,clip:'bogen',wurfT:.72,v:55,weich:20,rueck:30},   // Kompositbogen (E2, 30.10.)
  stein:{typ:'stein',reich:70,nachl:[2.5,4],vorrat:25,schaden:.8,ungeschuetzt:1.6,clip:'schleuder',wurfT:.65,v:40,weich:24,rueck:34},
};
const FERN_PAKET={A1_veles:'speer',A4_balearisch:'stein',A7_toxotes:'pfeil',A6_plaenkler:'speer',A8_nubisch:'pfeil'};   // Pakete mit Fern-Clip; andere Fernkämpfer bekommen A1_veles
const ECHT_PAKET={   // Ausrüstung der Figuren: schild = Chance, ein Geschoss von vorn abzuwehren · bloss = ungeschützt (Steine ×1,6)
  A1_hastatus:{schild:.55},A1_veles:{schild:.4},A2_libysch:{schild:.45},A3_iberisch:{schild:.45},
  A4_balearisch:{schild:0,bloss:true},A6_keltisch:{schild:.35,bloss:true},A7_hellenistisch:{schild:.5},
  A7_phalangit:{schild:.3},A7_hoplit:{schild:.6},A7_toxotes:{schild:0,bloss:true},A6_plaenkler:{schild:.3,bloss:true},
  A1_legion:{schild:.6},A6_adlig:{schild:.45},A6_falx:{schild:0,bloss:true},A8_nubisch:{schild:0,bloss:true},A8_aksum:{schild:.4},
};
const ECHT_RANG=[{n:'Rekruten',b:0,m:0},{n:'Erprobt',b:.05,m:5},{n:'Veteranen',b:.1,m:10},{n:'Elite',b:.15,m:15},{n:'Legendär',b:.2,m:25}];   // wie RANKS der Kampagne
const STUFE_NAME=['einfach','verbessert','beste'];
const r1=x=>Math.round(x*10)/10;
function profilFinden(e,ue){   // Sondereinheit -> ihr Profil; Grundeinheit -> erstes Profil mit passender Kultur und Epoche, sonst irgendeines der Rolle
  const D=KAMP,P=D.profile;
  if(e.variante&&P[e.variante])return e.variante;
  let s1=null,s2=null;
  for(const id in P){
    if(id.slice(0,6)!=='basis_')continue;const p=P[id];if(p.rolle!==e.rolle)continue;
    const ep=p.epochen.indexOf(ue)>=0;
    if(ep&&p.kulturen.indexOf(e.kultur)>=0)return id;
    if(ep&&!s1)s1=id;if(!s2)s2=id;
  }
  return s1||s2;
}
function schlachtEinheit(e){
  const D=KAMP;if(!D)throw new Error('Kampagnendaten nicht geladen');
  const ep=e.epoche|0,ue=e.ausruestungEpoche==null?ep:Math.min(ep,e.ausruestungEpoche|0);
  const V=e.variante?D.VARIANTS[e.variante]:null,rolle=V?V.role:e.rolle,R0=D.ROLES[rolle],B=V?V.b:{},M=V?V.m:{};
  const pid=profilFinden({variante:e.variante,rolle,kultur:e.kultur},ue),P=D.profile[pid];
  const tier=e.tier?1:0,wpn=e.waffen|0,arm=e.ruestung|0,rk=Math.max(0,Math.min(4,(e.rang!=null?e.rang:e.erfahrung||0)|0)),RG=ECHT_RANG[rk];
  // Kampagnenstärke (wie unitStat/uStat der Kampagne)
  const mod=(ep===0&&!V)?((D.UNIT_MOD[e.volk]||{})[rolle]||{}):{};
  let str=(mod.str||R0.str)*(M.str||1);
  str=Math.round(str*EP_STR(ue,rolle)*10)/10;
  if(tier)str=Math.round(str*1.2*10)/10;
  const q=str/(R0.str*D.EPOCH_STR[ue]),sq=Math.sqrt(q);
  const G=ECHT_ROLLE[rolle],atkM=(1+RG.b)*(1+.08*wpn),defM=(1+RG.b)*(1+.08*arm),spd=B.spd||1;
  // Figurenpaket (Fernkämpfer brauchen ein Paket mit Wurf-Clips)
  let pak=P.paket,genau=P.paketGenau!==false;
  if(rolle==='missile'&&!FERN_PAKET[pak]){pak='A1_veles';genau=false;}
  const ele=rolle==='cav'&&P.reittier==='E_elefant';   // Kriegselefant: Treiber (Reiterpaket) auf dem Reittier E_elefant
  const PK=ele?{schild:0}:(ECHT_PAKET[pak]||{schild:.4});
  let fern=null;
  const reit=rolle==='cav';
  if(rolle==='missile'){
    const W=ECHT_FERN[FERN_PAKET[pak]];
    fern=Object.assign({},W,{reich:W.reich*(B.range||1),schaden:W.schaden*(B.ratk||1),vorrat:Math.max(1,Math.round(W.vorrat*(B.ammo||1)))});
  }else if(reit&&B.range&&pak==='A2_numidisch'){   // Reiter-Plänkler (Numider): Wurfspeere vom Pferd, weichen früher und weiter aus als Fußplänkler
    const W=ECHT_FERN.speer;
    fern=Object.assign({},W,{clip:'wurf_reiter',reich:W.reich*B.range,schaden:W.schaden*(B.ratk||1),vorrat:Math.max(1,Math.round(W.vorrat*(B.ammo||1))),weich:22,rueck:45});
  }
  // Kappen (30.10.): einzelne Kampagnen-Boni kumulieren sonst zu Ausreißern (Pikenphalanx Abwehr 18,2, Soldurii Moral 98)
  const kap=(v,g)=>Math.min(v,g*1.6);
  const werte={atk:kap(G.atk*sq*(B.atk||1)*atkM,G.atk),def:kap(G.def*sq*(B.def||1)*defM,G.def),mor:Math.min(90,G.mor+2*(B.mor||0)+RG.m),hp:ele?G.hp*4:G.hp,
    walk:G.walk*spd,run:ele?Math.min(G.run*spd,5.5):G.run*spd,ans:G.ans*(B.chg||1),pike:B.pike||0,skirm:B.skirm?1:(rolle==='missile'?1:0),
    schild:PK.schild,bloss:!!PK.bloss,speer:rolle==='spear',sym:ele?'elefant':reit?G.sym:fern?(fern.typ==='stein'?'schleuder':fern.typ==='pfeil'?'bogen':'wurfspeer'):G.sym,fern,pakId:pak,
    reit,ele,lanze:reit&&!ele&&pak!=='A2_numidisch',rg:ele?3.0:reit?2.1:rolle==='spear'?2.0:1.6,reach:ele?2.4:reit?1.7:rolle==='spear'?1.45:1.1};   // reit = Reiter (Pferd + Reiter je Figur) · lanze = Ansturm mit gesenkter Lanze · rg Schlagweite · reach Standabstand
  const f=[];
  if(fern)f.push(fern.typ==='stein'?'Schleuderer: große Reichweite':fern.typ==='pfeil'?'Bogenschützen: größte Reichweite':'Wurfspeere: kurze Reichweite');
  if(B.skirm)f.push('Plänkeln: weicht dem Nahkampf aus');else if(rolle==='missile')f.push('Plänkeln (Fernkämpfer weichen aus)');
  if(B.pike)f.push('Pike: Abwehr ×1,5 gegen Ansturm von vorn');
  if(ele){f.push('Kriegselefanten: trampeln Gegner nieder, Fußvolk fürchtet sie, Pferde scheuen');f.push('Sehr zäh, aber gegen Wurfspeere und Pfeile verwundbar; einzelne Tiere können in Panik geraten');}
  else if(reit)f.push('Reiterei: Ansturm bricht Linien (von der Seite am stärksten), im Nahkampf schwächer; Speere von vorn halten sie ab');
  if(reit&&fern)f.push('Wurfspeere vom Pferd: weicht früh aus');
  if(werte.ans>=1.6&&!reit)f.push('Wuchtiger Ansturm');
  if(spd>1.05)f.push('Schnell');else if(spd<.95)f.push('Langsam');
  const mann=e.mann!=null?e.mann|0:Math.round(R0.men*(M.men||1));
  const bild=P.sheet>=0?{typ:'sheet',sheet:P.sheet}:{typ:'ui',key:'u_e'+ue+'_'+rolle};
  return{id:pid,name:P.n+(tier?' (Veteranen)':''),rolle,epoche:ep,ausruestungEpoche:ue,kit:P.kit,paket:pak,paketGenau:genau,reittier:ele?'E_elefant':null,
    figuren:Math.max(4,Math.min(ele?10:60,Math.round(mann/3))),mann,bild,str,q,werte,faehigkeiten:f,beschreibung:V?V.d:'',
    waffen:wpn,ruestung:arm,tier,rang:rk,rangName:RG.n,sondereinheit:!!V};
}
function EP_STR(ue,rolle){return KAMP.EPOCH_STR[ue]*(rolle==='missile'?KAMP.FERN_EPOCHE[ue]:1);}

/* ---- Gefechte (Vorlagen): jede Einheit ist eine Kampagnen-Einheit; Seite 0 = Spieler, Seite 1 = Gegner; x/z = Platz in Metern ---- */
const GEFECHTE=[
  {id:'karthago',n:'Rom gegen Karthago',seiten:['Rom','Karthago'],text:'Gedrillte Legionäre gegen Libyer, Iberer und keltische Söldner.',

function slotPos(u,s,id){   // Weltposition des Platzes s -> _tx,_tz ; lockert sich beim Marsch (u.loose 0..1)

function initClip(id,ci){

}

function setClip(id,ci,sp,force){
  const A=sAn,o=id*12,c=KIT[sKit[id]].cl[ci],dur=c.len/30/sp;
  if(sCur[id]===ci&&!force){
    if(A[o+8]>.5&&Math.abs(sp-A[o+3])>.08*A[o+3]){const ph=(spielzeit-A[o+2])*A[o+3];A[o+3]=sp;A[o+2]=spielzeit-ph/sp;}   // Phase bleibt stetig
    return dur;
  }
  A[o+4]=A[o];A[o+5]=A[o+1];A[o+6]=A[o+2];A[o+7]=A[o+3];A[o+9]=A[o+8];
  A[o]=c.row;A[o+1]=c.len;A[o+3]=sp;A[o+8]=c.loop?1:0;
  A[o+2]=spielzeit-(c.loop?Math.random()*c.len/30/sp:0);
  A[o+10]=spielzeit;sCur[id]=ci;
  return dur;
}

/* Kegel vor dem Tier i (len m lang, am Ende 2·b breit): wirft um oder tötet. eigen = auch die eigene Seite (Panik) */
function elefTrampel(i,len,b,dmg,eigen){
  const side=sSide[i],ua=U[sUnit[i]],fx=Math.sin(sR[i]),fz=Math.cos(sR[i]),R=Math.ceil(len/ZELLE)+1;
  const cx=((sX[i]-GX0)/ZELLE)|0,cz=((sZ[i]-GZ0)/ZELLE)|0;
  for(let gz=Math.max(0,cz-R);gz<=Math.min(GH-1,cz+R);gz++)for(let gx=Math.max(0,cx-R);gx<=Math.min(GW-1,cx+R);gx++){
    for(let j=cHead[gz*GW+gx];j>=0;j=sNext[j]){
      if(j===i||sSt[j]>S_FLIEH||sRad[j]>1||sAct[j]===A_TREFFER)continue;
      if(!eigen&&sSide[j]===side)continue;
      const dx=sX[j]-sX[i],dz=sZ[j]-sZ[i],al=dx*fx+dz*fz;
      if(al<-1||al>len)continue;
      const across=dx*fz-dz*fx;if(Math.abs(across)>1.3+Math.max(0,al)/len*b)continue;
      const V=U[sUnit[j]];sHP[j]-=dmg;zaehler.treffer++;V.morale-=.7;
      spritzer(sX[j],sZ[j],fx,fz,3);
      if(sHP[j]<=0){if(eigen){if(sSide[j]===side)zaehler.panikEigene++;else zaehler.panikFeinde++;}sterbeDir(j,-fx,-fz,ua,1.3);continue;}
      if(sSt[j]===S_FLIEH)continue;

  }
}
function elefTick(i,u,dt){   // je Frame und Elefant: Trompeten, Wunden, Panik

function panikPruefen(i,u,dt){   // vorsichtig: höchstens ein Tier je Einheit gleichzeitig, danach 30 s Ruhe, höchstens zwei je Schlacht und Einheit

  if(sHurt[i]>=4)p+=.04*(sHurt[i]-3);                       // viele Wurfspeere / Pfeile kurz hintereinander

  if(p>0&&Math.random()<p*dt)panikStart(i,u);

  u.occ[(u.tief-1)*br+c]=-1;

/* Plänkler (Velites, Balearen): schießen im Stehen, weichen Nahkämpfern aus; der Spieler kann sie näher an ein Ziel führen */
let _nv=null,_nd=0;
function naechsterNahk(u){   // nächste feindliche Einheit, die im Nahkampf gefährlich ist -> _nv,_nd
  _nv=null;_nd=1e9;
  for(const v of U){if(v.side===u.side||gone(v)||v.state==='flieht')continue;if(v.fern&&v.mun>0)continue;const d=Math.hypot(v.cx-u.cx,v.cz-u.cz);if(d<_nd){_nd=d;_nv=v;}}

function fernKI(u){   // true = Fernkampf-Verhalten führt die Einheit (Aufruf alle 0,5 s)

  const eigen=u.side===0;
  naechsterNahk(u);
  if(u.plaenk&&_nv&&_nd<F.weich&&u.weichT<=0&&(u.rueck||!(eigen&&u.hasDest))){   // Nahkämpfer zu nah: zurückweichen (nicht, wenn der Spieler marschieren lässt)
    const ax=u.cx-_nv.cx,az=u.cz-_nv.cz,l=Math.hypot(ax,az)||1;

  if(!eigen&&u.def.reit){   // Reiter-Plänkler (Feind): in Wurfweite heranreiten, werfen, bei Nahkämpfern wieder ausweichen
    u.zurueck=false;
    if(!u.hasDest&&u.fZ<0){
      const T=naechster(u,false);
      if(T){const d=Math.hypot(T.cx-u.cx,T.cz-u.cz);
        if(d>F.reich*.9){const l=d||1;u.destX=T.cx+(u.cx-T.cx)/l*F.reich*.7;u.destZ=T.cz+(u.cz-T.cz)/l*F.reich*.7;u.hasDest=true;u.atkT=-1;u.run=d>40;}}
    }
    return true;

    gest={mode:'tipp',x0:e.clientX,y0:e.clientY,t0:performance.now(),bewegt:false,u:null};
    if(e.pointerType==='mouse'&&e.button===2)gest.mode='dreh';
    else if(phase==='aufstellung'&&bodenAn(e.clientX,e.clientY,_g)){
      const u=einheitBei(_g.x,_g.z,7,0);if(u){gest.mode='ziehen';gest.u=u;select(u.i);}
    }
  }else if(zeiger.size===2){
    const [a,b]=[...zeiger.values()];
    gest={mode:'zwei',bewegt:true,ang:Math.atan2(b.y-a.y,b.x-a.x),abst:Math.hypot(a.x-b.x,a.y-b.y),mx:(a.x+b.x)/2,my:(a.y+b.y)/2,t0:0};

lis(cv,'pointermove',e=>{

  }

});

function platziere(u,x,z){   // Aufstellung
  u.cx=Math.max(-FELD_X+8,Math.min(FELD_X-8,x));u.cz=Math.max(-FELD_Z+8,Math.min(-20,z));
  if(HN){hindPush(u.cx,u.cz,4);u.cx=_hx;u.cz=_hz;}
}
function tippen(px,py){
  if(!bodenAn(px,py,_g))return;
  const jetzt=performance.now(),dop=jetzt-letzterTipp.t<300&&Math.hypot(px-letzterTipp.x,py-letzterTipp.y)<30&&letzterTipp.boden;
  letzterTipp={t:jetzt,x:px,y:py,boden:false};
  const u=einheitBei(_g.x,_g.z,7);
  if(phase==='aufstellung'){
    if(u&&u.side===0)select(u.i);
    else if(sel>=0&&!u)platziere(U[sel],_g.x,_g.z);
    return;
  }
  if(phase!=='schlacht')return;
  if(u&&u.side===0){select(u.i);return;}
  if(sel<0||U[sel].state==='flieht'||gone(U[sel]))return;
  if(u&&u.side===1){for(const a of selListe())angriff(a.i,u.i);return;}
  letzterTipp.boden=true;
  gruppenBefehl(_g.x,_g.z,dop);
}
function select(i,add){   // add (langer Druck auf eine zweite Karte): zur Auswahl hinzufügen / entfernen
  if(add&&i>=0&&sel>=0){if(selM.has(i)){selM.delete(i);if(sel===i)sel=selM.size?[...selM][0]:-1;}else{selM.add(i);sel=i;}}
  else{selM.clear();if(i>=0)selM.add(i);sel=i;}
  uiAuswahl();
}
function gruppenBefehl(x,z,laufen){   // mehrere gewählte Einheiten: nebeneinander an das Ziel
  const L=selListe();if(!L.length)return;
  if(L.length===1){befehl(L[0].i,x,z,laufen);return;}
  let cx=0,cz=0;for(const u of L){cx+=u.cx;cz+=u.cz;}cx/=L.length;cz/=L.length;
  let dx=x-cx,dz=z-cz;const l=Math.hypot(dx,dz)||1;dx/=l;dz/=l;const px=-dz,pz=dx;
  L.sort((p,q)=>((p.cx-cx)*px+(p.cz-cz)*pz)-((q.cx-cx)*px+(q.cz-cz)*pz));
  L.forEach((u,k)=>{const o=(k-(L.length-1)/2)*16;befehl(u.i,x+px*o,z+pz*o,laufen);});
}

/* Befehle (auch für Tests) */
function befehl(i,x,z,laufen){
  const u=U[i];if(!u||gone(u)||u.state==='flieht')return false;
  u.atkT=-1;u.fBef=-1;u.rueck=false;u.zurueck=false;u.loesen=false;u.destX=Math.max(-FELD_X,Math.min(FELD_X,x));u.destZ=Math.max(-FELD_Z,Math.min(FELD_Z,z));
  if(HN){hindPush(u.destX,u.destZ,3.5);u.destX=_hx;u.destZ=_hz;}   // Ziele in Felsen und Häusern auf den Rand verschieben
  u.hasDest=true;u.run=!!laufen;
  if(u.engaged){u.sperre=2.5;u.kT=0;u.abzug=true;}   // Marschbefehl im Gefecht: löst sich vom Feind und geht bis zum Ziel durch (Verfolger schlagen in den Rücken)
  return true;
}
function angriff(i,t){
  const u=U[i],T=U[t];if(!u||!T||T.side===u.side||gone(u)||gone(T)||u.state==='flieht')return false;
  if(u.fern&&u.mun>0){u.fBef=t;u.atkT=-1;u.hasDest=false;u.rueck=false;fernKI(u);return true;}   // Schützen: feuern auf das Ziel, rücken in Schussweite vor
  u.loesen=false;u.abzug=false;ereignis('kriegsgeschrei',u.mx,u.mz);auftrag(u,t,true);return true;
}

function zustand(u){   // -> [Zeichen, Text]
  if(u.state==='geflohen')return['zs-flucht','geflohen'];
  if(u.state==='aufgerieben')return['zs-kampf','aufgerieben'];
  if(u.state==='flieht')return['zs-flucht','flieht!'];
  if(u.loesen)return['zs-flucht',u.hasDest?'löst sich':'sammelt sich'];
  if(u.engaged||u.state==='kampf')return['zs-kampf','kämpft'];
  if(u.rueck)return['zs-flucht','weicht aus'];
  if(u.fern&&u.mun>0&&u.schiessT>0)return['zs-schuss','schießt · '+u.mun];

function flankenHinweis(){   // Leicht: Hinweis, wenn feindliche Reiterei einer eigenen Einheit in Flanke oder Rücken kommt
  if(phase!=='schlacht'||pausiert||schlachtZ-flankT<6)return;
  for(const c of U){
    if(c.side!==1||!c.def.reit||gone(c)||c.state==='flieht')continue;
    for(const p of U){
      if(p.side!==0||gone(p)||p.state==='flieht')continue;
      const d=Math.hypot(c.cx-p.cx,c.cz-p.cz);if(d>70||d<4)continue;
      if(Math.abs(wrap(Math.atan2(c.cx-p.cx,c.cz-p.cz)-p.f))>1.3){flankT=schlachtZ;hinweis('Flankengefahr: '+c.name+' nähert sich '+p.name+' von der Seite.');return;}
    }
  }
}

    if(!gone(u)&&phase!=='laden'){
      _bnp.set(u.cx,H(u.cx,u.cz)+9,u.cz);const dist=camera.position.distanceTo(_bnp);_bnp.project(camera);
      x=(_bnp.x+1)*.5*W;y=(1-_bnp.y)*.5*Hh;

/* ====================================================================================================
   7b  TON  (Web Audio; Vorgabe dev/docs/schlacht_ton.md). Dateien: ton/m_<id>_<a|b>.mp3 (Musik), ton/s_<art>_<n>.mp3 (Geräusche).
   Alles optional: fehlende Dateien werden still übergangen und beim Schlachtbeginn sowie alle 60 s erneut versucht.
   Kein Knoten pro Bild: Teppiche sind Dauerschleifen mit gleitender Lautstärke, Einzelgeräusche kurzlebige Quellen (≤ 12), Zählung 5 Hz.
   ==================================================================================================== */
const TON=(()=>{
  const DIR=AS+'ton/',KULT='rom',MAXM=7,POLY=12,HOER=60,FADE=3.5;
  const SFX={klirren:8,schild:6,schildstoss:4,treffer:6,tod:6,speer:4,ruestung:4,kriegsgeschrei:4,horn:4,sieg_jubel:2,marsch:2,sturm:2,kampflaerm_nah:3,kampflaerm_fern:2,wind:2,wiese:1,pfeil:4,pfeil_treffer:4,schleuder:3,wurf:3,
    hufe_galopp:2,hufe_trab:1,wiehern:4,reiter_aufprall:3,pferd_tod:2,elefant_trompete:4,elefant_panik:2,elefant_tod:2};   // Reiterei (30.10.): Dateien entstehen am PC, fehlende werden still übergangen
  const KAMPF=['kampf_1','kampf_2','kampf_3','kampf_rom','kampf_karthago'];
  const GR={   // Zustand -> Gruppen in Ausweichreihenfolge (erste Gruppe mit geladenem Stück gewinnt)
    ruhe:[['ruhe_1']],
    aufmarsch:[['aufmarsch_'+KULT],['aufmarsch_rom','aufmarsch_karthago','aufmarsch_kelt'],KAMPF],
    kampf:[KAMPF],
    hoehepunkt:[['hoehepunkt_1','hoehepunkt_2'],KAMPF],
    sieg:[['sieg_1','sieg_2']],niederlage:[['niederlage_1']]};
  const FAC={ruhe:.8,aufmarsch:.8,kampf:1,hoehepunkt:1,sieg:.9,niederlage:.8};
  /* Spielereignis -> Geräuschart · v Lautstärke · t Mindestabstand (s) je Ereignisart · w Hörweite (m) */
  const EV={
    klirren:{a:'klirren',v:.8,t:.07},schild:{a:'schild',v:.8,t:.09},schildstoss:{a:'schildstoss',v:.8,t:.2},treffer:{a:'treffer',v:.45,t:.9},tod:{a:'tod',v:.42,t:2.2},speer:{a:'speer',v:.8,t:.15},
    pfeil:{a:'pfeil',v:.55,t:.12},wurf:{a:'wurf',v:.7,t:.2},schleuder:{a:'schleuder',v:.7,t:.15},treffer_fern:{a:'pfeil_treffer',v:.8,t:.15},abgewehrt:{a:'schild',v:.7,t:.2},
    kriegsgeschrei:{a:'kriegsgeschrei',v:.6,t:6,w:140},
    aufprall:{a:'reiter_aufprall',v:.8,t:.18,w:110},wiehern:{a:'wiehern',v:.5,t:5,w:120},pferd_tod:{a:'pferd_tod',v:.55,t:1.8},trompeten:{a:'elefant_trompete',v:.7,t:3.5,w:260},elefant_panik:{a:'elefant_panik',v:.8,t:2.5,w:220},elefant_tod:{a:'elefant_tod',v:.75,t:2},horn:{a:'horn',v:1,t:4,w:400},sieg_jubel:{a:'sieg_jubel',v:1,t:5,w:1e5}};
  for(const k in EV)EV[k].l=-1e9;
  /* Ladeliste: Musik (je Stück zuerst Fassung a, sonst b; höchstens MAXM Stück im Speicher) und Geräusche; Reihenfolge = Wichtigkeit */
  const LISTE=[];
  const mItem=id=>({alt:['m_'+id+'_a','m_'+id+'_b'],id,art:null,ok:false});
  LISTE.push(mItem('kampf_1'));
  const SFX_FEHLT={s_speer_1:1};   // beim Erzeugen aussortiert (fast stumm)
  for(const a in SFX)for(let n=1;n<=SFX[a];n++)if(!SFX_FEHLT['s_'+a+'_'+n])LISTE.push({alt:['s_'+a+'_'+n],id:null,art:a,ok:false});
  for(const id of ['ruhe_1','aufmarsch_rom','kampf_2','hoehepunkt_1','sieg_1','niederlage_1','kampf_3','hoehepunkt_2','sieg_2','kampf_rom','kampf_karthago'])LISTE.push(mItem(id));
  const MB={},SB={};          // geladene Puffer: Musik je Stück · Geräusche je Art (Liste)
  let abgebaut=false;
  let ctx=null,master=null,busM=null,busS=null,aktiv=false,figFertig=false,laedt=false,nM=0,nS=0,gespielt=0,retryT=0,tT=0;

  function lautstaerke(){

    master.gain.setTargetAtTime(tonAn?1:0,n,.05);busM.gain.setTargetAtTime(kurve(volM),n,.05);busS.gain.setTargetAtTime(kurve(volG),n,.05);
  }

  // (Safari 16.4+) und beim ersten Tippen ein stilles, endloses <audio> starten – dann behandelt iOS den Ton wie Videoton.

  /* ---- Laden: nacheinander, alles in try/catch, Puffer einmal dekodiert ---- */

          try{
            const r=await fetch(DIR+name+'.mp3');
            if(!r.ok)continue;
            const ab=await r.arrayBuffer();
            const b=await new Promise((ok,no)=>{try{const p=ctx.decodeAudioData(ab,ok,no);if(p&&p.catch)p.catch(no);}catch(e){no(e);}});
            if(it.id){MB[it.id]=b;nM++;}else{(SB[it.art]||(SB[it.art]=[])).push(b);nS++;}
            it.ok=true;break;
          }catch(e){}
        }
      }
    }catch(e){}

  }

  /* ---- Einzelgeräusche im Raum ---- */
  let nAkt=0;const lastV={};
  function spiele(typ,x,z){
    if(!aktiv||!tonAn)return;
    const e=EV[typ];if(!e)return;
    const now=ctx.currentTime;if(now-e.l<e.t||nAkt>=POLY)return;
    const dx=x-ziel.x,dz=z-ziel.z,d=Math.sqrt(dx*dx+dz*dz),R=(e.w||HOER)+.3*dist;
    if(d>R)return;
    const arr=SB[e.a];if(!arr)return;

    let k=(Math.random()*arr.length)|0;if(arr.length>1&&k===lastV[e.a])k=(k+1)%arr.length;lastV[e.a]=k;

    if(gv<.01)return;
    let pan=(dx*Math.cos(az)-dz*Math.sin(az))/(d+10);pan=pan>.85?.85:pan<-.85?-.85:pan;   // rechts der Kamera = positiv

  /* ---- Teppiche: Dauerschleifen, Lautstärke folgt der Zahl nahe kämpfender / marschierender Soldaten ---- */
  const AMB={};let nahK=0,fernK=0,marschK=0,sturmK=0,kampfGes=0;
  function ambStart(name){

  function zaehlen(){

      const st=sSt[i];if(st>S_FLIEH)continue;

  /* ---- Hufteppich: je bewegter Reitereinheit eine räumliche Schleife (Gang nach Tempo, Lautstärke nach Tempo, Zahl und Abstand) ---- */
  const HUF={};

  /* ---- Musik: ruhe → aufmarsch → kampf → hoehepunkt → sieg / niederlage; Überblendung FADE s ---- */

function staubEmission(dt){
  const pf=pMax/200;
  for(const u of U){
    if(gone(u))continue;
    let rate=0;
    if(u.state==='flieht')rate=5;else if(u.curSpeed>2.2)rate=6;else if(u.kaempfend>0)rate=Math.min(6,u.kaempfend*.3);
    if(rate<=0){u.dAcc=0;continue;}
    u.dAcc+=rate*pf*dt;
    while(u.dAcc>=1){
      u.dAcc-=1;
      for(let tr=0;tr<4;tr++){const id=u.i*PRO+((Math.random()*u.np)|0);if(sSt[id]<=S_FLIEH){staub(sX[id],sZ[id],1,u.kaempfend>0?1.2:1.5,.28);break;}}
    }
  }
}

  get tris(){return KIT.map(k=>k.tris);},get zaehler(){return zaehler;},
  soldat(id){return{x:sX[id],z:sZ[id],st:sSt[id],act:sAct[id],hp:sHP[id],fat:sFat[id],clip:CN[sCur[id]],foe:sFoe[id],unit:sUnit[id],pferd:pCur[id]>=0?(U[sUnit[id]].ele?EFN:PFN)[pCur[id]]:null,ch:sCh[id],rush:sRush[id],v:Math.hypot(sVX[id],sVZ[id]),reit:sRt[id],ele:!!(sRt[id]&&U[sUnit[id]].ele),pan:sPanK[id],hurt:sHurt[id],rad:sRad[id]};},
  elefPanik(i,w){const u=U[i];if(!u||!u.ele)return -1;for(let s=0;s<PRO;s++){const id=u.occ[s];if(id>=0&&sSt[id]<=S_KAMPF&&!sPanK[id]){panikStart(id,u);if(w!=null)sPA[id]=w;return id;}}return -1;},   // nur für Tests / Bilder
  get umwelt(){const o={hindernisse:HN,teile:{}};for(const k in UMW)o.teile[k]={n:UMW[k].n,sichtbar:UMW[k].m.count};o.liste=HIND.map(h=>[h.k||'',Math.round(h.x*10)/10,Math.round(h.z*10)/10,h.r]);return o;},
  loesen(i){return loesen(U[i]);},
  get ton(){return TON.info();},get geschosse(){return G;},get ereignisse(){return evZ;},get auswahl(){return[...selM];},get schlachtZeit(){return schlachtZ;},
  start,befehl,angriff,neu,waehle:select,setGrafik,get grafik(){return grafikName;},hoehe:H,wald:WF,vegInfo,lodUpdate,
  kamera(a,e,d,x,z){az=a;el=e;dist=d;ziel.x=x;ziel.z=z;camSetzen();},
  tempo(n){tempoV=Math.max(.1,Math.min(30,+n||1));uiAktualisieren();},
  pause(p){pausiert=p===undefined?!pausiert:!!p;uiAktualisieren();},
  stellen(i,x,z){if(phase==='aufstellung'&&U[i])platziere(U[i],x,z);},
  versetzen(i,x,z){const u=U[i];if(!u)return;const dx=x-u.cx,dz=z-u.cz;u.cx=x;u.cz=z;u.mx+=dx;u.mz+=dz;for(let s=0;s<PRO;s++){const id=u.occ[s];if(id>=0){sX[id]+=dx;sZ[id]+=dz;}}},   // nur für Tests: Einheit samt Soldaten umsetzen
  bildPos(x,z){const v=new THREE.Vector3(x,H(x,z),z).project(camera);return[(v.x+1)/2*innerWidth,(1-v.y)/2*innerHeight];},
  haltung(i,s){if(U[i])U[i].stance=s;},
  einheit(d){return schlachtEinheit(d);},gefecht(n){return gefechtWaehlen(n);},get gefechte(){return GEFECHTE.map(g=>g.id);},get aktuellesGefecht(){return GEFECHT.id;},
  get pakete(){return Object.keys(GELADEN);},
};
